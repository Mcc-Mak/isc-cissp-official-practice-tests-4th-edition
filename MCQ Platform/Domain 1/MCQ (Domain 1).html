<head>

    <style>
        * {
            box-sizing: border-box;

        }

        body {
            background: #f0f2f5;
            margin: 0;

            color: #1e293b;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 0.25rem;
            color: #0f3b5c;
        }

        .sub {

            border-left: 4px solid #2c7da0;
            padding-left: 1rem;
        }

        .toolbar {
            background: white;
            border-radius: 20px;
            padding: 1rem 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px -4px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            position: sticky;
            top: 10px;
            z-index: 10;

            background: rgba(255, 255, 255, 0.92);
            border: 1px solid #e2e8f0;
        }

        button {
            background: #1e6f5c;
            color: white;
            border: none;
            padding: 8px 22px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;

            transition: all 0.2s;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        button:hover {
            background: #0f5a49;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: #2c5282;
        }

        .btn-secondary:hover {
            background: #1e3a5f;
        }

        .btn-export {
            background: #2b6e4e;
        }

        .score-area {
            font-size: 1.2rem;
            font-weight: 700;

            padding: 6px 18px;

            color: #0e5e4a;
        }

        .questions-grid {
            display: flex;
            flex-direction: column;
            gap: 1.75rem;
        }

        .question-card {
            background: white;
            border-radius: 24px;
            padding: 1.3rem 1.8rem;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.03);
            border: 1px solid #e2edf2;
            transition: box-shadow 0.1s;
        }

        .question-header {
            display: flex;
            gap: 12px;
            align-items: baseline;
            flex-wrap: wrap;
            margin-bottom: 1rem;
            border-bottom: 2px solid #eef2f8;
            padding-bottom: 0.5rem;
        }

        .q-num {
            background: #d4e6f1;
            padding: 4px 12px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 0.8rem;
            color: #1a4d6b;
        }

        .q-text {
            font-weight: 600;
            font-size: 1rem;
            line-height: 1.4;
            color: #0f2f3f;
        }

        .options {
            margin: 1rem 0 0.5rem 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .option input {
            margin: 0;
            width: 18px;
            height: 18px;
            accent-color: #2c7da0;
        }

        .option label {
            font-size: 0.95rem;
            color: #1e3b4a;
        }

        .mapping-table {
            margin: 1rem 0 0.5rem 1rem;
            border-collapse: collapse;
            background: #fafdff;
            width: 100%;
            max-width: 700px;
        }

        .mapping-table td,
        .mapping-table th {
            border: 1px solid #cbdde6;
            padding: 10px 12px;
            vertical-align: middle;
        }

        .mapping-table th {
            background: #e7f0f5;
            font-weight: 600;
        }

        select {
            padding: 6px 12px;
            border-radius: 28px;
            border: 1px solid #bdd4e2;
            background: white;
            font-size: 0.9rem;
        }

        .summary-panel {
            margin-top: 2.5rem;
            background: #fefce8;
            border-radius: 24px;
            padding: 1.2rem 1.8rem;
            border-left: 8px solid #eab308;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.05);
        }

        .summary-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }

        .result-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
            background: white;
            border-radius: 16px;
            overflow: auto;
            display: block;
        }

        .result-table th,
        .result-table td {
            border: 1px solid #d4dee5;
            padding: 10px 8px;
            text-align: left;
            vertical-align: top;
        }

        .result-table th {
            background: #eef3f7;
            position: sticky;
            top: 0;
        }

        .correct-badge {
            background: #c8e6df;
            color: #0b5345;
            font-weight: bold;
            padding: 2px 12px;
            border-radius: 40px;
            display: inline-block;
        }

        .wrong-badge {
            background: #f8dddd;
            color: #9b2c2c;
            font-weight: bold;
            padding: 2px 12px;
            border-radius: 40px;
        }

        footer {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.75rem;
            color: #5b7c93;
        }

        @media (max-width: 760px) {
            .question-card {
                padding: 1rem;
            }

            .options {
                margin-left: 0.2rem;
            }
        }

        hr {
            margin: 0.5rem 0;
        }
    </style>
</head>

    <script>
        // ----------------------------------------------

        const questionsData = [
            { "question_number": "001", "question_text": "Alyssa is responsible for her organization's security awareness program. She is concerned that changes in technology may make the content outdated. What control can she put in place to protect against this risk?", "options": ["A. Gamification", "B. Computer-based training", "C. Content reviews", "D. Live training"] },
            { "question_number": "002", "question_text": "Gavin is creating a report for management on the results of his most recent risk assessment. In his report, he would like to identify the remaining level of risk to the organization after adopting security controls. What term best describes this current level of risk?", "options": ["A. Inherent risk", "B. Residual risk", "C. Control risk", "D. Mitigated risk"] },
            { "question_number": "003", "question_text": "Francine is a security specialist for an online service provider in the United States. She recently received a claim from a copyright holder that a user is storing information on her service that violates the third party's copyright. What law governs the actions that Francine must take?", "options": ["A. Copyright Act", "B. Lanham Act", "C. Digital Millennium Copyright Act", "D. Gramm-Leach-Bliley Act"] },
            { "question_number": "004", "question_text": "FlyAway Travel has offices in both the European Union (EU) and the United States and transfers personal information between those offices regularly. They have recently received a request from an EU customer requesting that their account be terminated. Under the General Data Protection Regulation (GDPR), which requirement for processing personal information states that individuals may request that their data no longer be disseminated or processed?", "options": ["A. The right to access", "B. Privacy by Design", "C. The right to erasure", "D. The right of data portability"] },
            { "question_number": "005", "question_text": "After conducting a qualitative risk assessment of her organization, Sally recommends purchasing cybersecurity breach insurance. What type of risk response behavior is she recommending?", "options": ["A. Accept", "B. Transfer", "C. Reduce", "D. Reject"] },
            { "question_number": "006", "question_text": "Which one of the following elements of information is not considered personally identifiable information that would trigger most United States state data breach laws?", "options": ["A. Student identification number", "B. Social Security number", "C. Driver's license number", "D. Credit card number"] },
            { "question_number": "007", "question_text": "Renee is purchasing a new software product and is working with the vendor on the negotiation of a license agreement that will specify customized terms of use and a discounted price. What type of agreement would normally be used to document the results of this negotiation?", "options": ["A. Perpetual license", "B. Subscription license", "C. Enterprise license agreement", "D. End-user license agreement"] },
            { "question_number": "008", "question_text": "Henry recently assisted one of his co-workers in preparing for the CISSP exam. During this process, Henry disclosed confidential information about the content of the exam, in violation of Canon IV of the Code of Ethics: 'Advance and protect the profession.' Who may bring ethics charges against Henry for this violation?", "options": ["A. Anyone may bring charges.", "B. Any certified or licensed professional may bring charges.", "C. Only Henry's employer may bring charges.", "D. Only the affected employee may bring charges."] },
            { "question_number": "009", "question_text": "Wanda is working with one of her organization's European Union business partners to facilitate the exchange of customer information. Wanda's organization is located in the United States. What would be the best method for Wanda to use to ensure GDPR compliance?", "options": ["A. Binding corporate rules", "B. Privacy Shield", "C. Standard contractual clauses", "D. Safe harbor"] },
            { "question_number": "010", "question_text": "Yolanda is the chief privacy officer for a financial institution and is researching privacy requirements related to customer checking accounts. Which one of the following laws is most likely to apply to this situation?", "options": ["A. GLBA", "B. SOX", "C. HIPAA", "D. FERPA"] },
            { "question_number": "011", "question_text": "Tim's organization recently received a contract to conduct sponsored research as a government contractor. What law now likely applies to the information systems involved in this contract?", "options": ["A. FISMA", "B. PCI DSS", "C. HIPAA", "D. GISRA"] },
            { "question_number": "012", "question_text": "Chris is advising travelers from his organization who will be visiting many different countries overseas. He is concerned about compliance with export control laws. Which of the following technologies is most likely to trigger these regulations?", "options": ["A. Memory chips", "B. Office productivity applications", "C. Hard drives", "D. Encryption software"] },
            { "question_number": "013", "question_text": "Bobbi is investigating a security incident and discovers that an attacker began with a normal user account but managed to exploit a system vulnerability to provide that account with administrative rights. What type of attack took place under the STRIDE threat model?", "options": ["A. Spoofing", "B. Repudiation", "C. Tampering", "D. Elevation of privilege"] },
            { "question_number": "014", "question_text": "You are completing your business continuity planning effort and have decided that you want to accept one of the risks. What should you do next?", "options": ["A. Implement new security controls to reduce the risk level.", "B. Design a disaster recovery plan.", "C. Repeat the business impact assessment.", "D. Document your decision-making process."] },
            { "question_number": "015", "question_text": "You are completing a review of the controls used to protect a media storage facility in your organization and would like to properly categorize each control that is currently in place. Which of the following control categories accurately describe a fence around a facility? (Select all that apply.)", "options": ["A. Physical", "B. Detection", "C. Deterrent", "D. Preventive"] },
            { "question_number": "016", "question_text": "Tony is developing a business continuity plan and is having difficulty prioritizing resources because of the difficulty of combining information about tangible and intangible assets. What would be the most effective risk assessment approach for him to use?", "options": ["A. Quantitative risk assessment", "B. Qualitative risk assessment", "C. Neither quantitative nor qualitative risk assessment", "D. Combination of quantitative and qualitative risk assessment"] },
            { "question_number": "017", "question_text": "Vincent believes that a former employee took trade secret information from his firm and brought it with him to a competitor. He wants to pursue legal action. Under what law could he pursue charges?", "options": ["A. Copyright law", "B. Lanham Act", "C. Glass-Steagall Act", "D. Economic Espionage Act"] },
            { "question_number": "018", "question_text": "Which one of the following principles imposes a standard of care upon an individual that is broad and equivalent to what one would expect from a reasonable person under the circumstances?", "options": ["A. Due diligence", "B. Separation of duties", "C. Due care", "D. Least privilege"] },
            { "question_number": "019", "question_text": "Brenda's organization recently completed the acquisition of a competitor firm. Which one of the following tasks would be LEAST likely to be part of the organizational processes addressed during the acquisition?", "options": ["A. Consolidation of security functions", "B. Integration of security tools", "C. Protection of intellectual property", "D. Documentation of security policies"] },
            { "question_number": "020", "question_text": "Kelly believes that an employee engaged in the unauthorized use of computing resources for a side business. After consulting with management, she decides to launch an administrative investigation. What is the burden of proof that she must meet in this investigation?", "options": ["A. Preponderance of the evidence.", "B. Beyond a reasonable doubt.", "C. Beyond the shadow of a doubt.", "D. There is no standard."] },
            { "question_number": "021", "question_text": "Keenan Systems recently developed a new manufacturing process for microprocessors. The company wants to license the technology to other companies for use but wants to prevent unauthorized use of the technology. What type of intellectual property protection is best suited for this situation?", "options": ["A. Patent", "B. Trade secret", "C. Copyright", "D. Trademark"] },
            { "question_number": "022", "question_text": "Which one of the following actions might be taken as part of a business continuity plan?", "options": ["A. Restoring from backup tapes", "B. Implementing RAID", "C. Relocating to a cold site", "D. Restarting business operations"] },
            { "question_number": "023", "question_text": "When developing a business impact analysis, the team should first create a list of assets. What should happen next?", "options": ["A. Identify vulnerabilities in each asset.", "B. Determine the risks facing the asset.", "C. Develop a value for each asset.", "D. Identify threats facing each asset."] },
            { "question_number": "024", "question_text": "Mike recently implemented an intrusion prevention system designed to block common network attacks from affecting his organization. What type of risk management strategy is Mike pursuing?", "options": ["A. Risk acceptance", "B. Risk avoidance", "C. Risk mitigation", "D. Risk transference"] },
            { "question_number": "025", "question_text": "Laura has been asked to perform a security controls assessment (SCA). What type of organization is she most likely in?", "options": ["A. Higher education", "B. Banking", "C. Government", "D. Healthcare"] },
            { "question_number": "026", "question_text": "Carl is a federal agent investigating a computer crime case. He identified an attacker who engaged in illegal conduct and wants to pursue a case against that individual that will lead to imprisonment. What standard of proof must Carl meet?", "options": ["A. Beyond the shadow of a doubt", "B. Preponderance of the evidence", "C. Beyond a reasonable doubt", "D. Majority of the evidence"] },
            { "question_number": "027", "question_text": "ISC2 uses the logo shown here to represent itself online and in a variety of forums. What type of intellectual property protection can it use to protect its rights in this logo? (Image: ISC2 logo)", "options": ["A. Copyright", "B. Patent", "C. Trade secret", "D. Trademark"] },
            { "question_number": "028", "question_text": "Mary is helping a computer user who sees the following message appear on his computer screen. What type of attack has occurred? (Image: CryptoLocker ransomware screenshot)", "options": ["A. Availability", "B. Confidentiality", "C. Disclosure", "D. Distributed"] },
            { "question_number": "029", "question_text": "Which one of the following organizations would not be automatically subject to the privacy and security requirements of HIPAA if they engage in electronic transactions?", "options": ["A. Healthcare provider", "B. Health and fitness application developer", "C. Health information clearinghouse", "D. Health insurance plan"] },
            { "question_number": "030", "question_text": "John's network begins to experience symptoms of slowness. Upon investigation, he realizes that the network is being bombarded with TCP SYN packets and believes that his organization is the victim of a denial-of-service attack. What principle of information security is being violated?", "options": ["A. Availability", "B. Integrity", "C. Confidentiality", "D. Denial"] },
            { "question_number": "031", "question_text": "Renee is designing a long-term security plan for her organization and has a three- to five-year planning horizon. Her primary goal is to align the security function with the broader plans and objectives of the business. What type of plan is she developing?", "options": ["A. Operational", "B. Tactical", "C. Summary", "D. Strategic"] },
            { "question_number": "032", "question_text": "Gina is working to protect a logo that her company will use for a new product they are launching. She has questions about the intellectual property protection process for this logo. What U.S. government agency would be best able to answer her questions?", "options": ["A. USPTO", "B. Library of Congress", "C. NSA", "D. NIST"] },
            { "question_number": "033", "question_text": "The Acme Widgets Company is putting new controls in place for its accounting department. Management is concerned that a rogue accountant may be able to create a new false vendor and then issue checks to that vendor as payment for services that were never rendered. What security control can best help prevent this situation?", "options": ["A. Mandatory vacation", "B. Segregation of duties", "C. Defense in depth", "D. Job rotation"] },
            { "question_number": "034", "question_text": "Which one of the following categories of organizations is most likely to be covered by the provisions of FISMA?", "options": ["A. Banks", "B. Defense contractors", "C. School districts", "D. Hospitals"] },
            { "question_number": "035", "question_text": "Robert is responsible for securing systems used to process credit card information. What security control framework should guide his actions?", "options": ["A. HIPAA", "B. PCI DSS", "C. SOX", "D. GLBA"] },
            { "question_number": "036", "question_text": "Which one of the following individuals is normally responsible for fulfilling the operational data protection responsibilities delegated by senior management, such as validating data integrity, testing backups, and managing security policies?", "options": ["A. Data custodian", "B. Data owner", "C. User", "D. Auditor"] },
            { "question_number": "037", "question_text": "Alan works for an e-commerce company that recently had some content stolen by another website and republished without permission. What type of intellectual property protection would best preserve Alan's company's rights?", "options": ["A. Trade secret", "B. Copyright", "C. Trademark", "D. Patent"] },
            { "question_number": "038", "question_text": "Florian receives a flyer from a U.S. federal government agency announcing that a new administrative law will affect his business operations. Where should he go to find the text of the law?", "options": ["A. U.S. Code", "B. Supreme Court rulings", "C. Code of Federal Regulations", "D. Compendium of Laws"] },
            { "question_number": "039", "question_text": "Tom enables an application firewall provided by his cloud infrastructure as a service provider that is designed to block many types of application attacks. When viewed from a risk management perspective, what metric is Tom attempting to lower by implementing this countermeasure?", "options": ["A. Impact", "B. RPO", "C. MTO", "D. Likelihood"] },
            { "question_number": "040", "question_text": "Which one of the following individuals would be the most effective organizational owner for an information security program?", "options": ["A. CISSP-certified analyst", "B. Chief information officer (CIO)", "C. Manager of network security", "D. President and CEO"] },
            { "question_number": "041", "question_text": "What important function do senior managers normally fill on a business continuity planning team?", "options": ["A. Arbitrating disputes about criticality", "B. Evaluating the legal environment", "C. Training staff", "D. Designing failure controls"] },
            { "question_number": "042", "question_text": "You are the CISO for a major hospital system and are preparing to sign a contract with a software-as-a-service (SaaS) email vendor. You want to perform a control assessment to ensure that its business continuity planning measures are reasonable. What type of audit might you request to meet this goal?", "options": ["A. SOC 1", "B. FISMA", "C. PCI DSS", "D. SOC 2"] },
            { "question_number": "043", "question_text": "Gary is analyzing a security incident and, during his investigation, encounters a user who denies having performed an action that Gary believes he did perform. What type of threat has taken place under the STRIDE model?", "options": ["A. Repudiation", "B. Information disclosure", "C. Tampering", "D. Elevation of privilege"] },
            { "question_number": "044", "question_text": "Beth is the security administrator for a public school district. She is implementing a new student information system and is testing the code to ensure that students are not able to alter their own grades. What principle of information security is Beth enforcing?", "options": ["A. Integrity", "B. Availability", "C. Confidentiality", "D. Denial"] },
            { "question_number": "045", "question_text": "Which one of the following issues is not normally addressed in a service-level agreement (SLA)?", "options": ["A. Confidentiality of customer information", "B. Failover time", "C. Uptime", "D. Maximum consecutive downtime"] },
            { "question_number": "046", "question_text": "Joan is seeking to protect a piece of computer software that she developed under intellectual property law. Which one of the following avenues of protection would not apply to a piece of software?", "options": ["A. Trademark", "B. Copyright", "C. Patent", "D. Trade secret"] },
            { "question_number": "047", "question_text": "Users in the two offices would like to access each other's file servers over the internet. What control would provide confidentiality for those communications?", "options": ["A. Digital signatures", "B. Virtual private network", "C. Virtual LAN", "D. Digital content management"] },
            { "question_number": "048", "question_text": "You are also concerned about the availability of data stored on each office's server. You would like to add technology that would enable continued access to files located on the server even if a hard drive in a server fails. What control allows you to add robustness without adding additional servers?", "options": ["A. Server clustering", "B. Load balancing", "C. RAID", "D. Scheduled backups"] },
            { "question_number": "049", "question_text": "Finally, there are historical records stored on the server that are extremely important to the business and should never be modified. You would like to add an integrity control that allows you to verify on a periodic basis that the files were not modified. What control can you add?", "options": ["A. Hashing", "B. ACLs", "C. Read-only attributes", "D. Firewalls"] },
            { "question_number": "050", "question_text": "Beth is a human resources specialist preparing to assist in the termination of an employee. Which of the following is not typically part of a termination process?", "options": ["A. An exit interview", "B. Recovery of organizational property", "C. Account termination", "D. Signing an NCA"] },
            { "question_number": "051", "question_text": "Frances is reviewing her organization's business continuity plan documentation for completeness. Which one of the following is not normally included in business continuity plan documentation?", "options": ["A. Statement of accounts", "B. Statement of importance", "C. Statement of priorities", "D. Statement of organizational responsibility"] },
            { "question_number": "052", "question_text": "An accounting employee at Doolittle Industries was recently arrested for participation in an embezzlement scheme. The employee transferred money to a personal account and then shifted funds around between other accounts every day to disguise the fraud for months. Which one of the following controls might have best allowed the earlier detection of this fraud?", "options": ["A. Separation of duties", "B. Least privilege", "C. Defense in depth", "D. Mandatory vacation"] },
            { "question_number": "053", "question_text": "Jeff would like to adopt an industry-standard approach for assessing the processes his organization uses to manage risk. What maturity model would be most appropriate for his use?", "options": ["A. CMM", "B. SW-CMM", "C. RMM", "D. COBIT"] },
            { "question_number": "054", "question_text": "Chris' organization recently suffered an attack that rendered their website inaccessible to paying customers for several hours. Which information security goal was most directly impacted?", "options": ["A. Confidentiality", "B. Integrity", "C. Availability", "D. Denial"] },
            { "question_number": "055", "question_text": "Yolanda is writing a document that will provide configuration information regarding the minimum level of security that every system in the organization must meet. What type of document is she preparing?", "options": ["A. Policy", "B. Baseline", "C. Guideline", "D. Procedure"] },
            { "question_number": "056", "question_text": "Who should receive initial business continuity plan training in an organization?", "options": ["A. Senior executives", "B. Those with specific business continuity roles", "C. Everyone in the organization", "D. First responders"] },
            { "question_number": "057", "question_text": "James is conducting a risk assessment for his organization and is attempting to assign an asset value to the servers in his data center. The organization's primary concern is ensuring that it has sufficient funds available to rebuild the data center in the event it is damaged or destroyed. Which one of the following asset valuation methods would be most appropriate in this situation?", "options": ["A. Purchase cost", "B. Depreciated cost", "C. Replacement cost", "D. Opportunity cost"] },

            { "question_number": "059", "question_text": "Rick recently engaged critical employees in each of his organization's business units to ask for their assistance with his security awareness program. They will be responsible for sharing security messages with their peers and answering questions about cybersecurity matters. What term best describes this relationship?", "options": ["A. Security champion", "B. Security expert", "C. Gamification", "D. Peer review"] },
            { "question_number": "060", "question_text": "Frank discovers a keylogger hidden on the laptop of his company's chief executive officer. What information security principle is the keylogger most likely designed to disrupt?", "options": ["A. Confidentiality", "B. Integrity", "C. Availability", "D. Denial"] },
            { "question_number": "061", "question_text": "Elise is helping her organization prepare to evaluate and adopt a new cloud-based human resource management (HRM) system vendor. What would be the most appropriate minimum security standard for her to require of possible vendors?", "options": ["A. Compliance with all laws and regulations", "B. Handling information in the same manner her organization would", "C. Elimination of all identified security risks", "D. Compliance with the vendor's own policies"] },

            { "answer_number": "097", "answer_text": "A.", "explanation": "Charles is tracking a key performance indicator (KPI)..." },
            { "answer_number": "098", "answer_text": "D.", "explanation": "A fitness evaluation is not a typical part of a hiring process..." },
            { "answer_number": "099", "answer_text": "A, C.", "explanation": "Supply chain risks occur when the adversary is interfering with the delivery of goods or services from a supplier to the customer..." },
            { "answer_number": "100", "answer_text": "GLBA: A, PCI DSS: C, HIPAA: D, SOX: B", "explanation": "The laws match: GLBA (privacy notice), PCI DSS (cards), HIPAA (medical), SOX (internal controls)." }
        ];
        const answerMap = new Map(answersData.map(a => [a.answer_number, a]));

        // Helper: get letter from option string "A. Text"
        function getLetter(opt) { return opt.charAt(0); }

        // Render questions
        const container = document.getElementById('questionsContainer');
        questionsData.forEach(q => {
            const qNum = q.question_number;
            const isMultiple = q.question_text.includes("(Select all that apply.)");
            const isMapping = (qNum === "100");
            const card = document.createElement('div');
            card.className = 'question-card';
            card.id = `qcard-${qNum}`;
            const header = `<div class="question-header"><span class="q-num">Q${qNum}</span><span class="q-text">${q.question_text}</span></div>`;
            let optionsHtml = '';
            if (isMapping) {
                optionsHtml = `<table class="mapping-table"><tr><th>Law / Standard</th><th>Match to description (select letter)</th></tr>`;
                mappingLaws.forEach(law => {
                    optionsHtml += `<tr><td><strong>${law}</strong></td><td><select class="map-select" data-law="${law}"><option value="">-- select --</option><option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option></select></td></tr>`;
                });
                optionsHtml += `</table><div class="desc-hint"><small>Descriptions: A = ${mappingDesc[0].substring(0, 80)}…, B = internal controls, C = payment cards, D = medical info</small></div>`;
            } else {
                optionsHtml = `<div class="options">`;
                q.options.forEach(opt => {
                    const letter = getLetter(opt);
                    const inputType = isMultiple ? 'checkbox' : 'radio';
                    const nameAttr = isMultiple ? `q${qNum}_chk` : `q${qNum}`;
                    optionsHtml += `<div class="option"><input type="${inputType}" name="${nameAttr}" value="${letter}" id="q${qNum}_${letter}"> <label for="q${qNum}_${letter}">${opt}</label></div>`;
                });
                optionsHtml += `</div>`;
            }
            card.innerHTML = header + optionsHtml;
            container.appendChild(card);
        });

        // Scoring & summary
        const submitBtn = document.getElementById('submitBtn');
        const exportBtn = document.getElementById('exportBtn');
        const summaryDiv = document.getElementById('summaryContainer');
        const scoreSpan = document.getElementById('scoreDisplay');

        function getUserAnswers() {
            let results = [];
            for (let i = 1; i <= 100; i++) {
                const qnum = i;
                const paddedNum = String(qnum).padStart(3, '0');   // ✅ "001", "002", ...
                const answerObj = answerMap.get(paddedNum);
                if (!answerObj) continue;                         // ✅ safety guard

                const correctRaw = answerObj.answer_text;
                const explanation = answerObj.explanation;
                let userAnswerRaw = "";
                let isCorrect = false;

                // ✅ Special handling for mapping question (Q100)
                if (qnum === 100) {
                    const selects = document.querySelectorAll(`.map-select`);
                    let mappingResult = [];
                    selects.forEach(sel => {
                        const law = sel.getAttribute('data-law');
                        const val = sel.value;
                        if (val) mappingResult.push(`${law}: ${val}`);
                    });
                    userAnswerRaw = mappingResult.join('; ') || "(no selection)";
                    const userMap = {};
                    selects.forEach(sel => { userMap[sel.getAttribute('data-law')] = sel.value; });
                    const correctMap = { GLBA: "A", "PCI DSS": "C", HIPAA: "D", SOX: "B" };
                    let ok = true;
                    for (let [law, correctLetter] of Object.entries(correctMap)) {
                        if (userMap[law] !== correctLetter) { ok = false; break; }
                    }
                    isCorrect = ok;
                }
                // --- Standard single‑choice / multiple‑select ---
                else {
                    // ✅ Find question data using padded number
                    const qData = questionsData.find(q => q.question_number === paddedNum);
                    const isMulti = qData ? qData.question_text.includes("(Select all that apply.)") : false;

                    if (isMulti) {
                        const checkboxes = document.querySelectorAll(`input[name="q${paddedNum}_chk"]:checked`);
                        const selected = Array.from(checkboxes).map(cb => cb.value).sort();
                        userAnswerRaw = selected.join(', ') || "(none)";
                        const correctLetters = correctRaw.replace(/\.$/, '').split(',').map(s => s.trim()).sort();
                        isCorrect = selected.length === correctLetters.length && correctLetters.every((v, i) => v === selected[i]);
                    } else {
                        const selectedRadio = document.querySelector(`input[name="q${paddedNum}"]:checked`);
                        userAnswerRaw = selectedRadio ? selectedRadio.value : "(no answer)";
                        const correctLetter = correctRaw.charAt(0);
                        isCorrect = (selectedRadio && selectedRadio.value === correctLetter);
                    }
                }
                results.push({ qnum, userAnswer: userAnswerRaw, correctAnswer: (qnum === 100 ? "GLBA: A, PCI DSS: C, HIPAA: D, SOX: B" : correctRaw), explanation, isCorrect });
            }
            return results;
        }

        function displaySummary(results) {
            const total = results.length;
            const correctCount = results.filter(r => r.isCorrect).length;
            scoreSpan.innerHTML = `✅ Score: ${correctCount}/${total} (${Math.round(correctCount / total * 100)}%)`;
            let html = `<div class="summary-panel"><div class="summary-header"><h3>📋 Detailed Report</h3><span>${correctCount} correct / ${total} total</span></div>`;
            html += `<div style="overflow-x: auto;"><table class="result-table"><thead><tr><th>Q#</th><th>Your Answer</th><th>Correct Answer</th><th>Result</th><th>Explanation</th></tr></thead><tbody>`;
            results.forEach(r => {
                const statusClass = r.isCorrect ? "correct-badge" : "wrong-badge";
                const statusText = r.isCorrect ? "Correct" : "Incorrect";
                html += `<tr><td>${r.qnum}</td><td>${escapeHtml(r.userAnswer)}</td><td>${escapeHtml(r.correctAnswer)}</td><td><span class="${statusClass}">${statusText}</span></td><td>${escapeHtml(r.explanation.substring(0, 200))}${r.explanation.length > 200 ? '…' : ''}</td></tr>`;
            });
            html += `</tbody></table></div><button id="closeSummaryBtn" style="margin-top:16px; background:#4b5563;">Hide Report</button></div>`;
            summaryDiv.innerHTML = html;
            summaryDiv.style.display = 'block';
            document.getElementById('closeSummaryBtn')?.addEventListener('click', () => { summaryDiv.style.display = 'none'; });
        }

        function escapeHtml(str) { return str.replace(/[&<>]/g, function (m) { if (m === '&') return '&amp;'; if (m === '<') return '&lt;'; if (m === '>') return '&gt;'; return m; }); }

        function exportCSV(results) {
            let csvRows = [["Question Number", "User Answer", "Correct Answer", "Result", "Explanation"]];
            results.forEach(r => {
                csvRows.push([r.qnum, r.userAnswer, r.correctAnswer, r.isCorrect ? "Correct" : "Incorrect", r.explanation]);
            });
            const csvContent = csvRows.map(row => row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(",")).join("\n");
            const blob = new Blob(["\uFEFF" + csvContent], { type: "text/csv;charset=utf-8;" });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.href = url;
            link.setAttribute("download", "domain1_results.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        submitBtn.addEventListener('click', () => {
            const results = getUserAnswers();
            displaySummary(results);
            window.currentResults = results;
        });
        exportBtn.addEventListener('click', () => {
            if (window.currentResults) exportCSV(window.currentResults);
            else alert("Please submit your answers first to generate CSV.");
        });
    </script>
</body>

</html>
