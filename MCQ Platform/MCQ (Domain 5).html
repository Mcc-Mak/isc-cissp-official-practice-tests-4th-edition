    { id: 71, text: "Brian's large organization has used RADIUS for AAA services for its network devices for years and has recently become aware of security issues with the unencrypted information transferred during authentication. How should Brian implement encryption for RADIUS?", options: ["A. Use the built-in encryption in RADIUS.", "B. Implement RADIUS over its native UDP using TLS for protection.", "C. Implement RADIUS over TCP using TLS for protection.", "D. Use an AES256 pre-shared cipher between devices."] },

// Map IDs 98, 99, 100 as mapping questions
const mappingQ98 = {
    items: ["Role-BAC", "Rule BAC", "DAC", "ABAC", "MAC"],
    correct: ["E", "B", "D", "C", "A"]  // Based on standard CISSP: Role-BAC -> E (job/function), Rule BAC -> B (parameters), DAC -> D (owner grants rights), ABAC -> C (policy-based, attributes), MAC -> A (OS enforced)
};
const mappingQ99 = {
    items: ["Password", "ID card", "Retinal scan", "Smartphone token", "Fingerprint analysis"],
    correct: ["B", "A", "C", "A", "C"]  // B=something you know, A=something you have, C=something you are
};
const mappingQ100 = {
    items: ["Information assets", "Systems", "Mobile devices", "Facilities", "Partner applications"],
    correct: ["A", "E", "D", "B", "C"]  // A=Discretionary access controls, E=User accounts with MFA, D=Biometric authentication, B=Badge readers, C=Federated identity management
};

// Answers for single/multi-choice questions (1-97)
const answersMap = {
    1: "B", 2: "C", 3: "D", 4: "C", 5: "B", 6: "C", 7: "B", 8: "A", 9: "B", 10: "C",
    11: "B", 12: "C", 13: "A", 14: "B", 15: "D", 16: "D", 17: "D", 18: "C", 19: "A", 20: "A",
    21: "C", 22: "C", 23: "A", 24: "B", 25: "A", 26: "C", 27: "A", 28: "B", 29: "B", 30: "D",
    31: "C", 32: "B", 33: "C", 34: "C", 35: "D", 36: "B", 37: "A", 38: "B", 39: "A", 40: "A",
    41: "C", 42: "A, B, C", 43: "C", 44: "B", 45: "C", 46: "B", 47: "C", 48: "A", 49: "C", 50: "B",
    51: "D", 52: "B", 53: "A, B", 54: "D", 55: "D", 56: "C", 57: "A", 58: "C", 59: "B", 60: "C",
    61: "C", 62: "C", 63: "B", 64: "C", 65: "C", 66: "C", 67: "B", 68: "A", 69: "C", 70: "C",
    71: "C", 72: "B", 73: "B", 74: "A", 75: "B, C", 76: "A", 77: "C", 78: "C", 79: "D", 80: "C",
    81: "B", 82: "B", 83: "B, C", 84: "C", 85: "D", 86: "B", 87: "B", 88: "C", 89: "A", 90: "D",
    91: "B", 92: "A", 93: "A", 94: "C", 95: "A", 96: "B", 97: "D"
};

// Render all questions
const container = document.getElementById('questionsContainer');
questionsData.forEach(q => {
    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = `qcard-${q.id}`;
    const isMultiple = q.options.length > 0 && (q.text.includes("(Select all that apply.)") || q.id === 42 || q.id === 53 || q.id === 75 || q.id === 83);
    const isMapping = (q.id === 98 || q.id === 99 || q.id === 100);
    let optionsHtml = '';
    if (isMapping && q.id === 98) {
        optionsHtml = `<table class="mapping-table"><thead><tr><th>Authorization Mechanism</th><th>Match to description (A–E)</th></tr></thead><tbody>`;
        mappingQ98.items.forEach((item, idx) => {
            optionsHtml += `<tr><td><strong>${item}</strong></td><td><select class="map-select-98" data-index="${idx}"><option value="">-- select --</option><option value="A">A. An access control model enforced by the operating system.</option><option value="B">B. Permissions or rights are granted based on parameters like an IP address, time, or other specific details that match requirements.</option><option value="C">C. Sometimes called policy-based access control, this model uses information about the subject to assign permissions.</option><option value="D">D. A model where subjects with the proper rights can assign or pass those rights to other subjects.</option><option value="E">E. Used to assign permissions based on job or function.</option></select></td></tr>`;
        });
        optionsHtml += `</tbody></table>`;
    } else if (isMapping && q.id === 99) {
        optionsHtml = `<table class="mapping-table"><thead><tr><th>Authentication Technique</th><th>Match to category (A, B, or C)</th></tr></thead><tbody>`;
        mappingQ99.items.forEach((item, idx) => {
            optionsHtml += `<tr><td><strong>${item}</strong></td><td><select class="map-select-99" data-index="${idx}"><option value="">-- select --</option><option value="A">A. Something you have</option><option value="B">B. Something you know</option><option value="C">C. Something you are</option></select></td></tr>`;
        });
        optionsHtml += `</tbody></table>`;
    } else if (isMapping && q.id === 100) {
        optionsHtml = `<table class="mapping-table"><thead><tr><th>Asset Type</th><th>Match to control (A–E)</th></tr></thead><tbody>`;
        mappingQ100.items.forEach((item, idx) => {
            optionsHtml += `<tr><td><strong>${item}</strong></td><td><select class="map-select-100" data-index="${idx}"><option value="">-- select --</option><option value="A">A. Discretionary access controls</option><option value="B">B. Badge readers</option><option value="C">C. Federated identity management</option><option value="D">D. Biometric authentication</option><option value="E">E. User accounts with multifactor authentication</option></select></td></tr>`;
        });
        optionsHtml += `</tbody></table>`;
    } else {
        optionsHtml = `<div class="options">`;
        q.options.forEach(opt => {
            const letter = opt.charAt(0);
            const inputType = isMultiple ? 'checkbox' : 'radio';
            const nameAttr = isMultiple ? `q${q.id}_chk` : `q${q.id}`;
            optionsHtml += `<div class="option"><input type="${inputType}" name="${nameAttr}" value="${letter}" id="q${q.id}_${letter}"> <label for="q${q.id}_${letter}">${opt}</label></div>`;
        });
        optionsHtml += `</div>`;
    }
    card.innerHTML = `<div class="question-header"><span class="q-num">Q${q.id}</span><span class="q-text">${q.text}</span><span class="hashtag" id="hashtag-${q.id}"></span></div>${optionsHtml}`;
    container.appendChild(card);
});

const submitBtn = document.getElementById('submitBtn');
const exportBtn = document.getElementById('exportBtn');
const modal = document.getElementById('summaryModal');
const modalBody = document.getElementById('modalBody');
const closeModal = document.querySelector('.close-modal');
let currentResults = [];

function getUserAnswers() {
    let results = [];
    for (let i = 1; i <= 100; i++) {
        const qid = i;
        let userAnswer = "";
        let isCorrect = false;
        let correctAnswerStr = "";
        if (qid === 98) {
            const selects = document.querySelectorAll('.map-select-98');
            let answers = [];
            selects.forEach(sel => answers.push(sel.value));
            userAnswer = answers.join(', ') || "(no selection)";
            const correct = mappingQ98.correct;
            isCorrect = answers.length === correct.length && answers.every((v, idx) => v === correct[idx]);
            correctAnswerStr = "Role-BAC→E, Rule BAC→B, DAC→D, ABAC→C, MAC→A";
        } else if (qid === 99) {
            const selects = document.querySelectorAll('.map-select-99');
            let answers = [];
            selects.forEach(sel => answers.push(sel.value));
            userAnswer = answers.join(', ') || "(no selection)";
            const correct = mappingQ99.correct;
            isCorrect = answers.length === correct.length && answers.every((v, idx) => v === correct[idx]);
            correctAnswerStr = "Password→B, ID card→A, Retinal scan→C, Smartphone token→A, Fingerprint analysis→C";
        } else if (qid === 100) {
            const selects = document.querySelectorAll('.map-select-100');
            let answers = [];
            selects.forEach(sel => answers.push(sel.value));
            userAnswer = answers.join(', ') || "(no selection)";
            const correct = mappingQ100.correct;
            isCorrect = answers.length === correct.length && answers.every((v, idx) => v === correct[idx]);
            correctAnswerStr = "Information assets→A, Systems→E, Mobile devices→D, Facilities→B, Partner applications→C";
        } else {
            const qData = questionsData.find(q => q.id === qid);
            const isMulti = qData && (qData.text.includes("(Select all that apply.)") || qid === 42 || qid === 53 || qid === 75 || qid === 83);
            if (isMulti) {
                const checkboxes = document.querySelectorAll(`input[name="q${qid}_chk"]:checked`);
                const selected = Array.from(checkboxes).map(cb => cb.value).sort();
                userAnswer = selected.join(', ') || "(none)";
                const correctRaw = answersMap[qid];
                const correctArray = correctRaw.split(',').map(s => s.trim()).sort();
                isCorrect = selected.length === correctArray.length && correctArray.every((v,i) => v === selected[i]);
                correctAnswerStr = correctRaw;
            } else {
                const radio = document.querySelector(`input[name="q${qid}"]:checked`);
                userAnswer = radio ? radio.value : "(skipped)";
                const correctLetter = answersMap[qid];
                isCorrect = (radio && radio.value === correctLetter);
                correctAnswerStr = correctLetter;
            }
        }
        const status = (userAnswer === "(skipped)" ? "skipped" : (isCorrect ? "correct" : "incorrect"));
        results.push({ qid, userAnswer, correctAnswer: correctAnswerStr || answersMap[qid] || "Mapping", isCorrect, status });
        const hashtagSpan = document.getElementById(`hashtag-${qid}`);
        if (hashtagSpan) {
            if (status === "correct") hashtagSpan.innerHTML = " #️⃣ correct";
            else if (status === "incorrect") hashtagSpan.innerHTML = " #️⃣ incorrect";
            else hashtagSpan.innerHTML = " #️⃣ skipped";
            hashtagSpan.className = `hashtag ${status}`;
        }
    }
    return results;
}

function escapeHtml(str) {
    if (str === undefined || str === null) return '';
    return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
    });
}

function showModal(results) {
    const total = results.length;
    const correctCount = results.filter(r => r.isCorrect).length;
    let html = `<p><strong>Score: ${correctCount}/${total} (${Math.round(correctCount/total*100)}%)</strong></p>`;
    html += `<table class="result-table"><thead><tr><th>Q#</th><th>Your Answer</th><th>Correct Answer</th><th>Result</th></tr></thead><tbody>`;
    results.forEach(r => {
        const statusText = r.isCorrect ? `<span class="hashtag correct">Correct</span>` : (r.userAnswer === "(skipped)" ? `<span class="hashtag skipped">Skipped</span>` : `<span class="hashtag incorrect">Incorrect</span>`);
        html += `<tr><td>${r.qid}</td><td>${escapeHtml(String(r.userAnswer))}</td><td>${escapeHtml(String(r.correctAnswer))}</td><td>${statusText}</td></tr>`;
    });
    html += `</tbody></table>`;
    modalBody.innerHTML = html;
    modal.style.display = 'flex';
}

function exportCSV(results) {
    let csvRows = [["Question ID","User Answer","Correct Answer","Result"]];
    results.forEach(r => {
        csvRows.push([r.qid, r.userAnswer, r.correctAnswer, r.isCorrect ? "Correct" : (r.userAnswer === "(skipped)" ? "Skipped" : "Incorrect")]);
    });
    const csvContent = csvRows.map(row => row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(",")).join("\n");
    const blob = new Blob(["\uFEFF" + csvContent], {type: "text/csv;charset=utf-8;"});
    const link = document.createElement("a");
    const url = URL.createObjectURL(blob);
    link.href = url;
    link.setAttribute("download", "domain5_results.csv");
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
}

submitBtn.addEventListener('click', () => {
    const results = getUserAnswers();
    currentResults = results;
    const correctCount = results.filter(r => r.isCorrect).length;
    document.getElementById('scoreDisplay').innerHTML = `✅ Score: ${correctCount}/${results.length} (${Math.round(correctCount/results.length*100)}%)`;
    showModal(results);
});
exportBtn.addEventListener('click', () => {
    if (currentResults && currentResults.length) exportCSV(currentResults);
    else alert("Please submit your answers first to generate CSV.");
});
document.getElementById('modalExportBtn').addEventListener('click', () => {
    if (currentResults) exportCSV(currentResults);
});
closeModal.addEventListener('click', () => { modal.style.display = 'none'; });
window.addEventListener('click', (e) => { if (e.target === modal) modal.style.display = 'none'; });
</script>
