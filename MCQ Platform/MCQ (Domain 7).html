        // Mapping for Q99
        const mappingQ99 = [
            { item: "Honeypot", correct: "C" },
            { item: "Honeynet", correct: "B" },
            { item: "Pseudo-flaw", correct: "A" },
            { item: "Darknet", correct: "D" }
        ];

        const mappingQ100 = [
            { item: "Hot site", correct: "B" },
            { item: "Cold site", correct: "D" },
            { item: "Warm site", correct: "C" },
            { item: "Service bureau", correct: "A" }
        ];

        // Render questions
        const container = document.getElementById('questionsContainer');
        questionsData.forEach(q => {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.id = `qcard-${q.id}`;
            const isMultiple = q.options.length > 0 && (q.text.includes("(Select all that apply.)") || q.id === 15 || q.id === 24 || q.id === 30 || q.id === 71 || q.id === 72 || q.id === 85);
            const isMapping = (q.id === 99 || q.id === 100);
            let optionsHtml = '';
            if (isMapping && q.id === 99) {
                optionsHtml = `<table class="mapping-table"><thead><tr><th>Term</th><th>Match to definition (A–D)</th></tr></thead><tbody>`;
                mappingQ99.forEach((item, idx) => {
                    optionsHtml += `<tr>
                <td><strong>${item.item}</strong></td>
                <td><select class="map-select-99" data-index="${idx}">
                    <option value="">-- select --</option>
                    <option value="A">A. An intentionally designed vulnerability used to lure in an attacker</option>
                    <option value="B">B. A network set up with intentional vulnerabilities</option>
                    <option value="C">C. A system set up with intentional vulnerabilities</option>
                    <option value="D">D. A monitored network without any hosts</option>
                </select></table>
            </tr>`;
                });
                optionsHtml += `</tbody></table>`;
            } else if (isMapping && q.id === 100) {
                optionsHtml = `<table class="mapping-table"><thead><tr><th>Recovery Capability</th><th>Match to definition (A–D)</th></tr></thead><tbody>`;
                mappingQ100.forEach((item, idx) => {
                    optionsHtml += `<tr>
                <td><strong>${item.item}</strong></td>
                <td><select class="map-select-100" data-index="${idx}">
                    <option value="">-- select --</option>
                    <option value="A">A. An organization that can provide on-site or off-site IT services in the event of a disaster</option>
                    <option value="B">B. A site with dedicated storage and real-time data replication, often with shared equipment that allows restoration of service in a very short time</option>
                    <option value="C">C. A site that relies on shared storage and backups for recovery</option>
                    <option value="D">D. A rented space with power, cooling, and connectivity that can accept equipment as part of a recovery effort</option>
                </select></td>
            </tr>`;
                });
                optionsHtml += `</tbody></table>`;
            } else {
                optionsHtml = `<div class="options">`;
                q.options.forEach(opt => {
                    const letter = opt.charAt(0);
                    const inputType = isMultiple ? 'checkbox' : 'radio';
                    const nameAttr = isMultiple ? `q${q.id}_chk` : `q${q.id}`;
                    optionsHtml += `<div class="option"><input type="${inputType}" name="${nameAttr}" value="${letter}" id="q${q.id}_${letter}"> <label for="q${q.id}_${letter}">${opt}</label></div>`;
                });
                optionsHtml += `</div>`;
            }
            card.innerHTML = `<div class="question-header"><span class="q-num">Q${q.id}</span><span class="q-text">${q.text}</span><span class="hashtag" id="hashtag-${q.id}"></span></div>${optionsHtml}`;
            container.appendChild(card);
        });

        const submitBtn = document.getElementById('submitBtn');
        const exportBtn = document.getElementById('exportBtn');
        const modal = document.getElementById('summaryModal');
        const modalBody = document.getElementById('modalBody');
        const closeModal = document.querySelector('.close-modal');
        let currentResults = [];

        function getUserAnswers() {
            let results = [];
            for (let i = 1; i <= 100; i++) {
                const qid = i;
                let userAnswer = "";
                let isCorrect = false;
                let correctAnswerStr = "";
                let explanation = explanations[qid] || "No explanation available.";
                if (qid === 99) {
                    const selects = document.querySelectorAll('.map-select-99');
                    let answers = [];
                    selects.forEach(sel => answers.push(sel.value));
                    userAnswer = answers.join(', ') || "(no selection)";
                    const correct = mappingQ99.map(m => m.correct);
                    isCorrect = answers.length === correct.length && answers.every((v, idx) => v === correct[idx]);
                    correctAnswerStr = "Honeypot→C, Honeynet→B, Pseudo-flaw→A, Darknet→D";
                } else if (qid === 100) {
                    const selects = document.querySelectorAll('.map-select-100');
                    let answers = [];
                    selects.forEach(sel => answers.push(sel.value));
                    userAnswer = answers.join(', ') || "(no selection)";
                    const correct = mappingQ100.map(m => m.correct);
                    isCorrect = answers.length === correct.length && answers.every((v, idx) => v === correct[idx]);
                    correctAnswerStr = "Hot site→B, Cold site→D, Warm site→C, Service bureau→A";
                } else {
                    const qData = questionsData.find(q => q.id === qid);
                    const isMulti = qData && (qData.text.includes("(Select all that apply.)") || qid === 15 || qid === 24 || qid === 30 || qid === 71 || qid === 72 || qid === 85);
                    if (isMulti) {
                        const checkboxes = document.querySelectorAll(`input[name="q${qid}_chk"]:checked`);
                        const selected = Array.from(checkboxes).map(cb => cb.value).sort();
                        userAnswer = selected.join(', ') || "(none)";
                        const correctRaw = answersMap[qid];
                        const correctArray = correctRaw.split(',').map(s => s.trim()).sort();
                        isCorrect = selected.length === correctArray.length && correctArray.every((v, i) => v === selected[i]);
                        correctAnswerStr = correctRaw;
                    } else {
                        const radio = document.querySelector(`input[name="q${qid}"]:checked`);
                        userAnswer = radio ? radio.value : "(skipped)";
                        const correctLetter = answersMap[qid];
                        isCorrect = (radio && radio.value === correctLetter);
                        correctAnswerStr = correctLetter;
                    }
                }
                const status = (userAnswer === "(skipped)" ? "skipped" : (isCorrect ? "correct" : "incorrect"));
                results.push({ qid, userAnswer, correctAnswer: (qid === 99 || qid === 100) ? correctAnswerStr : (answersMap[qid] || "Mapping"), isCorrect, status, explanation });
                const hashtagSpan = document.getElementById(`hashtag-${qid}`);
                if (hashtagSpan) {
                    if (status === "correct") hashtagSpan.innerHTML = " #️⃣ correct";
                    else if (status === "incorrect") hashtagSpan.innerHTML = " #️⃣ incorrect";
                    else hashtagSpan.innerHTML = " #️⃣ skipped";
                    hashtagSpan.className = `hashtag ${status}`;
                }
            }
            return results;
        }

        function escapeHtml(str) {
            if (str === undefined || str === null) return '';
            return str.replace(/[&<>]/g, function (m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        function showModal(results) {
            document.querySelectorAll(`input`).forEach(e => e.disabled = true);
            const total = results.length;
            const correctCount = results.filter(r => r.isCorrect).length;
            let html = `<p><strong>Score: ${correctCount}/${total} (${Math.round(correctCount / total * 100)}%)</strong></p>`;
            html += `<div style="overflow-x: auto;"><table class="result-table"><thead><tr><th>Q#</th><th>Your Answer</th><th>Correct Answer</th><th>Result</th><th>Explanation</th></tr></thead><tbody>`;
            results.forEach(r => {
                const statusText = r.isCorrect ? `<span class="hashtag correct">Correct</span>` : (r.userAnswer === "(skipped)" ? `<span class="hashtag skipped">Skipped</span>` : `<span class="hashtag incorrect">Incorrect</span>`);
                html += `<tr>
            <td style="white-space: nowrap;">${r.qid}</td>
            <td>${escapeHtml(r.userAnswer)}</td>
            <td>${escapeHtml(r.correctAnswer)}</td>
            <td>${statusText}</td>
            <td>${escapeHtml(r.explanation)}</td>
        </tr>`;
            });
            html += `</tbody></table></div>`;
            modalBody.innerHTML = html;
            modal.style.display = 'flex';
        }

        function exportCSV(results) {
            let csvRows = [["Question ID", "User Answer", "Correct Answer", "Result", "Explanation"]];
            results.forEach(r => {
                csvRows.push([r.qid, r.userAnswer, r.correctAnswer, r.isCorrect ? "Correct" : (r.userAnswer === "(skipped)" ? "Skipped" : "Incorrect"), r.explanation]);
            });
            const csvContent = csvRows.map(row => row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(",")).join("\n");
            const blob = new Blob(["\uFEFF" + csvContent], { type: "text/csv;charset=utf-8;" });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.href = url;
            link.setAttribute("download", "domain7_results.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        submitBtn.addEventListener('click', () => {
            const results = getUserAnswers();
            currentResults = results;
            const correctCount = results.filter(r => r.isCorrect).length;
            document.getElementById('scoreDisplay').innerHTML = `✅ Score: ${correctCount}/100 (${Math.round(correctCount / 100 * 100)}%)`;
            showModal(results);
        });

        exportBtn.addEventListener('click', () => {
            if (currentResults && currentResults.length) exportCSV(currentResults);
            else alert("Please submit your answers first to generate CSV.");
        });
        document.getElementById('modalExportBtn').addEventListener('click', () => {
            if (currentResults) exportCSV(currentResults);
        });
        closeModal.addEventListener('click', () => { modal.style.display = 'none'; });
        window.addEventListener('click', (e) => { if (e.target === modal) modal.style.display = 'none'; });
    </script>
