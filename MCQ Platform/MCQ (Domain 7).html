    { id: 1, text: "Mary is reviewing the availability controls for the system architecture shown here. What technology is shown that provides fault tolerance for the database servers? (Image: network diagram with RAID array)", options: ["A. Failover cluster", "B. UPS", "C. Tape backup", "D. Cold site"] },
    { id: 2, text: "Joe is the security administrator for an ERP system. He is preparing to create accounts for several new employees. What default access should he give to all of the new employees as he creates the accounts?", options: ["A. Read only", "B. Editor", "C. Administrator", "D. No access"] },
    { id: 3, text: "Tim is configuring a privileged account management solution for his organization. Which one of the following is not a privileged administrative activity that should be automatically sent to a log of superuser actions?", options: ["A. Purging log entries", "B. Restoring a system from backup", "C. Logging into a workstation", "D. Managing user accounts"] },
    { id: 4, text: "When one of the employees of Alice's company calls in for support, she uses a code word that the company agreed to use if employees were being forced to perform an action. What is this scenario called?", options: ["A. Social engineering", "B. Duress", "C. Force majeure", "D. Stockholm syndrome"] },
    { id: 5, text: "Jordan is preparing to bring evidence into court after a cybersecurity incident investigation. He is responsible for preparing the physical artifacts, including affected servers and mobile devices. What type of evidence consists entirely of tangible items that may be brought into a court of law?", options: ["A. Documentary evidence", "B. Parol evidence", "C. Testimonial evidence", "D. Real evidence"] },
    { id: 6, text: "Lauren wants to ensure that her users only run software that her organization has approved. What technology should she deploy?", options: ["A. Blacklisting", "B. Configuration management", "C. Whitelisting", "D. Graylisting"] },
    { id: 7, text: "Colin is responsible for managing his organization's use of cybersecurity deception technologies. Which one of the following should he use on a honeypot system to consume an attacker's time while alerting administrators?", options: ["A. Honeynet", "B. Pseudo-flaw", "C. Warning banner", "D. Darknet"] },
    { id: 8, text: "Toni responds to the desk of a user who reports slow system activity. Upon checking outbound network connections from that system, Toni notices a large amount of social media traffic originating from the system. The user does not use social media, and when Toni checks the accounts in question, she sees they contain strange messages that appear encrypted. What is the most likely cause of this traffic?", options: ["A. Other users are relaying social media requests through the user's computer.", "B. The user's computer is part of a botnet.", "C. The user is lying about her use of social media.", "D. Someone else is using the user's computer when she is not present."] },
    { id: 9, text: "John deploys his website to multiple regions using load balancers around the world through his cloud infrastructure as a service provider. What availability concept is he using?", options: ["A. Multiple processing sites", "B. Warm sites", "C. Cold sites", "D. A honeynet"] },
    { id: 10, text: "Jim would like to identify compromised systems on his network that may be participating in a botnet. He plans to do this by watching for connections made to known command-and-control servers. Which one of the following techniques would be most likely to provide this information if Jim has access to a list of known servers?", options: ["A. NetFlow records", "B. IDS logs", "C. Authentication logs", "D. RFC logs"] },
    { id: 11, text: "As Gary decides what access permissions he should grant to each user, what principle should guide his decisions about default permissions?", options: ["A. Segregation of duties", "B. Least privilege", "C. Privilege creep", "D. Separation of privileges"] },
    { id: 12, text: "As Gary designs the program, he uses the matrix shown here. What principle of information security does this matrix most directly help enforce? (Image: conflict matrix)", options: ["A. Segregation of duties", "B. Privilege creep", "C. Two-person control", "D. Defense in depth"] },
    { id: 13, text: "Gary is preparing to create an account for a new user and assign privileges to the HR database. What two elements of information must Gary verify before granting this access?", options: ["A. Credentials and need to know", "B. Clearance and need to know", "C. Password and clearance", "D. Password and biometric scan"] },
    { id: 14, text: "Gary is preparing to develop controls around access to root encryption keys and would like to apply a principle of security designed specifically for very sensitive operations. Which principle should he apply?", options: ["A. Least privilege", "B. Defense in depth", "C. Security through obscurity", "D. Two-person control"] },
    { id: 15, text: "How often should Gary and his team conduct a review of the privileged access that a user has to sensitive systems? (Select all that apply.)", options: ["A. On a periodic basis", "B. When a user leaves the organization", "C. When a user changes roles", "D. On a daily basis"] },
    { id: 16, text: "Which one of the following terms is often used to describe a collection of unrelated patches released in a large collection?", options: ["A. Hotfix", "B. Update", "C. Security fix", "D. Service pack"] },
    { id: 17, text: "Tonya is collecting evidence from a series of systems that were involved in a cybersecurity incident. A colleague suggests that she use a write blocker for the collection process. What is the function of this device?", options: ["A. Masking error conditions reported by the storage device", "B. Transmitting write commands to the storage device", "C. Intercepting and modifying or discarding commands sent to the storage device", "D. Preventing data from being returned by a read operation sent to the device"] },
    { id: 18, text: "Lydia is processing access control requests for her organization. She comes across a request where the user does have the required security clearance, but there is no business justification for the access. Lydia denies this request. What security principle is she following?", options: ["A. Need to know", "B. Least privilege", "C. Segregation of duties", "D. Two-person control"] },
    { id: 19, text: "Helen is tasked with implementing security controls in her organization that might be used to deter fraudulent insider activity. Which one of the following mechanisms would be LEAST useful to her work?", options: ["A. Job rotation", "B. Mandatory vacations", "C. Incident response", "D. Two-person control"] },
    { id: 20, text: "Matt wants to ensure that critical network traffic from systems throughout his company is prioritized over web browsing and social media use at this company. What technology can he use to do this?", options: ["A. VLANs", "B. QoS", "C. VPN", "D. ISDN"] },
    { id: 21, text: "Tom is responding to a recent security incident and is seeking information on the approval process for a recent modification to a system's security settings. Where would he most likely find this information?", options: ["A. Change log", "B. System log", "C. Security log", "D. Application log"] },
    { id: 22, text: "Staff from Susan's company often travel internationally and require connectivity to corporate systems for their work. Susan believes that these users may be targeted for corporate espionage activities because of the technologies that her company is developing and wants to include advice in the security training provided to international travelers. What practice should Susan recommend that they adopt for connecting to networks while they travel?", options: ["A. Only connect to public Wi-Fi.", "B. Use a VPN for all connections.", "C. Only use websites that support TLS.", "D. Do not connect to networks while traveling."] },
    { id: 23, text: "Ricky is seeking a list of information security vulnerabilities in applications, devices, and operating systems. Which one of the following threat intelligence sources would be most useful to him?", options: ["A. OWASP", "B. CIS", "C. Microsoft Security Bulletins", "D. CVE"] },
    { id: 24, text: "Which of the following would normally be considered an example of a disaster when performing disaster recovery planning? (Select all that apply.)", options: ["A. Hacking incident", "B. Flood", "C. Fire", "D. Terrorism"] },
    { id: 25, text: "Glenda would like to conduct a disaster recovery test and is seeking a test that will allow a review of the plan with no disruption to normal information system activities and as minimal a commitment of time as possible. What type of test should she choose?", options: ["A. Tabletop exercise", "B. Parallel test", "C. Full interruption test", "D. Read-through"] },
    { id: 26, text: "Which one of the following is not an example of a backup tape rotation scheme?", options: ["A. Grandfather-Father-Son", "B. Meet-in-the-Middle", "C. Tower of Hanoi", "D. Six Cartridge Weekly"] },
    { id: 27, text: "Helen is implementing a new security mechanism for granting employees administrative privileges in the accounting system. She designs the process so that both the employee's manager and the accounting manager must approve the request before the access is granted. What information security principle is Helen enforcing?", options: ["A. Least privilege", "B. Two-person control", "C. Job rotation", "D. Segregation of duties"] },
    { id: 28, text: "Frank is considering the use of different types of evidence in an upcoming criminal matter. Which one of the following is not a requirement for evidence to be admissible in court?", options: ["A. The evidence must be relevant.", "B. The evidence must be material.", "C. The evidence must be tangible.", "D. The evidence must be competently acquired."] },
    { id: 29, text: "Harold recently completed leading the postmortem review of a security incident. What documentation should he prepare next?", options: ["A. A lessons learned document", "B. A risk assessment", "C. A remediation list", "D. A mitigation checklist"] },
    { id: 30, text: "Beth is creating a new cybersecurity incident response team (CSIRT) and would like to determine the appropriate team membership. Which of the following groups would she normally include? (Select all that apply.)", options: ["A. Information security", "B. Law enforcement", "C. Senior management", "D. Public affairs"] },
    { id: 31, text: "Sam is responsible for backing up his company's primary file server. He configured a backup schedule that performs full backups every Monday evening at 9 p.m. and differential backups on other days of the week at that same time. Files change according to the information shown here. How many files will be copied in Wednesday's backup? (Image: file changes)", options: ["A. 2", "B. 3", "C. 5", "D. 6"] },
    { id: 32, text: "Which one of the following security tools is not capable of generating an active response to a security event?", options: ["A. IPS", "B. Firewall", "C. IDS", "D. Antivirus software"] },
    { id: 33, text: "Scott is responsible for disposing of disk drives that have been pulled from his company's SAN as they are retired. Which of the following options should he avoid if the data on the SAN is considered highly sensitive by his organization?", options: ["A. Destroy them physically.", "B. Sign a contract with the SAN vendor that requires appropriate disposal and provides a certification process.", "C. Reformat each drive before it leaves the organization.", "D. Use a secure wipe tool like DBAN."] },
    { id: 34, text: "Which of the following topics is least likely to be included in a company's user security training and awareness program?", options: ["A. Insider threat", "B. Social media impact", "C. 2FA fatigue", "D. Secure router configuration guidelines"] },
    { id: 35, text: "Which one of the following types of agreements is the most formal document that contains expectations about availability and other performance parameters between a service provider and a customer?", options: ["A. Service-level agreement (SLA)", "B. Operational-level agreement (OLA)", "C. Memorandum of understanding (MOU)", "D. Statement of work (SOW)"] },
    { id: 36, text: "As the CIO of a large organization, Clara would like to adopt standard processes for managing IT activities. Which one of the following frameworks focuses on IT service management and includes topics such as change management, configuration management, and service-level agreements?", options: ["A. ITIL", "B. PMBOK", "C. PCI DSS", "D. TOGAF"] },
    { id: 37, text: "Richard is experiencing issues with the quality of network service on his organization's network. The primary symptom is that packets are consistently taking too long to travel from their source to their destination. What term describes the issue Richard is facing?", options: ["A. Jitter", "B. Packet loss", "C. Interference", "D. Latency"] },
    { id: 38, text: "Joe wants to test a program he suspects may contain malware. What technology can he use to isolate the program while it runs?", options: ["A. ASLR", "B. Sandboxing", "C. Clipping", "D. Process isolation"] },
    { id: 39, text: "Which one of the following is an example of a non-natural disaster?", options: ["A. Hurricane", "B. Flood", "C. Mudslide", "D. Transformer explosion"] },
    { id: 40, text: "Anne wants to gather information about security settings as well as build an overall view of her organization's assets by gathering data about a group of Windows 11 workstations spread throughout her company. What Windows tool is best suited to this type of configuration management task?", options: ["A. ConfigMgr", "B. Group Policy", "C. SCOM", "D. A custom PowerShell script"] },
    { id: 41, text: "Javier is verifying that only IT system administrators have the ability to log on to servers used for administrative purposes. What principle of information security is he enforcing?", options: ["A. Need to know", "B. Least privilege", "C. Two-person control", "D. Transitive trust"] },
    { id: 42, text: "Which one of the following is not a basic preventive measure that you can take to protect your systems and applications against attack?", options: ["A. Implement intrusion detection and prevention systems.", "B. Maintain current patch levels on all operating systems and applications.", "C. Remove unnecessary accounts and services.", "D. Conduct forensic imaging of all systems."] },
    { id: 43, text: "Chas is a cybersecurity manager who is concerned that the cloud provider his organization relies upon for disaster recovery may not be able to meet their needs in the event that a disaster strikes multiple customers simultaneously. What type of agreement should Chas enter into with this provider?", options: ["A. Nondisclosure agreement", "B. Resource capacity agreement", "C. Mutual assistance agreement", "D. Business partnership agreement"] },
    { id: 44, text: "Which one of the following is an example of a computer security incident?", options: ["A. Failure of a backup to complete properly", "B. System access recorded in a log", "C. Unauthorized vulnerability scan of a file server", "D. Update of antivirus signatures"] },
    { id: 45, text: "Roland is a physical security specialist in an organization that has a large amount of expensive lab equipment that often moves around the facility. Which one of the following technologies would provide the most automation of an inventory control process in a cost-effective manner?", options: ["A. IPS", "B. Wi-Fi", "C. RFID", "D. Ethernet"] },
    { id: 46, text: "Connor's company recently experienced a denial-of-service attack that Connor believes came from an inside source. If true, what type of event has the company experienced?", options: ["A. Espionage", "B. Confidentiality breach", "C. Sabotage", "D. Integrity breach"] },
    { id: 47, text: "Evan detects an attack against a server in his organization and examines the TCP flags on a series of packets, shown in the following diagram. What type of attack most likely took place? (Image: TCP flags diagram)", options: ["A. SYN flood", "B. Ping flood", "C. Smurf", "D. Fraggle"] },
    { id: 48, text: "Florian is building a disaster recovery plan for his organization and would like to determine the amount of time that a particular IT service may be down without causing serious damage to business operations. What variable is Florian calculating?", options: ["A. RTO", "B. MTD", "C. RPO", "D. SLA"] },
    { id: 49, text: "Which of the following would normally be classified as zero-day attacks?", options: ["A. An attacker who is new to the world of hacking", "B. A database attack that places the date 00/00/0000 in data tables in an attempt to exploit flaws in business logic", "C. An attack previously unknown to the security community", "D. An attack that sets the operating system date and time to 00/00/0000 and 00:00:00"] },
    { id: 50, text: "Rob is conducting a forensic investigation and is looking for elements of trace digital evidence. Which one of the following principles applies most closely to his work?", options: ["A. Kerckhoff's principle", "B. Principle of least privilege", "C. Defense-in-depth principle", "D. Locard's principle"] },
    { id: 51, text: "During an incident investigation, investigators meet with a system administrator who may have information about the incident but is not a suspect. What type of conversation is taking place during this meeting?", options: ["A. Interview", "B. Interrogation", "C. Both an interview and an interrogation", "D. Neither an interview nor an interrogation"] },
    { id: 52, text: "What technique has been used to protect the intellectual property shown here? (Image: seashore photo)", options: ["A. Steganography", "B. Clipping", "C. Sampling", "D. Watermarking"] },
    { id: 53, text: "You are working to evaluate the risk of flood to an area as part of a business continuity planning (BCP) effort. You consult the flood maps from the Federal Emergency Management Agency (FEMA). According to those maps, the area lies within a 200-year flood plain. What is the annualized rate of occurrence (ARO) of a flood in that region?", options: ["A. 200", "B. 0.01", "C. 0.02", "D. 0.005"] },
    { id: 54, text: "Which one of the following individuals poses the greatest risk to security in most well-defended organizations?", options: ["A. Political activist", "B. Malicious insider", "C. Script kiddie", "D. Thrill attacker"] },
    { id: 55, text: "Veronica is considering the implementation of a database recovery mechanism recommended by a consultant. In the recommended approach, an automated process will move database backups from the primary facility to an off-site location each night. What type of database recovery technique is the consultant describing?", options: ["A. Remote journaling", "B. Remote mirroring", "C. Electronic vaulting", "D. Transaction logging"] },
    { id: 56, text: "When designing an access control scheme, Hilda set up roles so that the same person does not have the ability to provision a new user account and assign superuser privileges to an account. What information security principle is Hilda following?", options: ["A. Least privilege", "B. Segregation of duties", "C. Job rotation", "D. Security through obscurity"] },
    { id: 57, text: "Patrick was asked to implement a threat-hunting program for his organization. Which one of the following is the basic assumption of a threat-hunting program that he should use as he plans his work?", options: ["A. Security controls were designed using a defense-in-depth strategy.", "B. Audits may uncover control deficiencies.", "C. Attackers may already be present on the network.", "D. Defense mechanisms may contain unpatched vulnerabilities."] },

    { id: 66, text: "Now that Ann understands that an attack has taken place that violates her organization's security policy, what term best describes what has occurred in Ann's organization?", options: ["A. Security occurrence", "B. Security incident", "C. Security event", "D. Security intrusion"] },
    { id: 67, text: "Frank is seeking to introduce a hacker's laptop in court as evidence against the hacker. The laptop does contain logs that indicate the hacker committed the crime, but the court ruled that the search of the apartment that resulted in police finding the laptop was unconstitutional. What admissibility criteria prevents Frank from introducing the laptop as evidence?", options: ["A. Materiality", "B. Relevance", "C. Hearsay", "D. Competence"] },
    { id: 68, text: "Gordon suspects that a hacker has penetrated a system belonging to his company. The system does not contain any regulated information, and Gordon wants to conduct an investigation on behalf of his company. He has permission from his supervisor to conduct the investigation. Which of the following statements is true?", options: ["A. Gordon is legally required to contact law enforcement before beginning the investigation.", "B. Gordon may not conduct his own investigation.", "C. Gordon's investigation may include examining the contents of hard disks, network traffic, and any other systems or information belonging to the company.", "D. Gordon may ethically perform “hack back” activities after identifying the perpetrator."] },
    { id: 69, text: "Which one of the following tools provides an organization with the greatest level of protection against a software vendor going out of business?", options: ["A. Service-level agreement", "B. Escrow agreement", "C. Mutual assistance agreement", "D. PCI DSS compliance agreement"] },
    { id: 70, text: "Fran is considering new human resources policies for her bank that will deter fraud. She plans to implement a mandatory vacation policy. What is typically considered the shortest effective length of a mandatory vacation?", options: ["A. Two days", "B. Four days", "C. One week", "D. One month"] },
    { id: 71, text: "Which of the following events would constitute a security incident? (Select all that apply.)", options: ["A. An attempted network intrusion", "B. A successful database intrusion", "C. A malware infection", "D. A successful attempt to access a file", "E. A violation of a confidentiality policy", "F. An unsuccessful attempt to remove information from a secured area"] },
    { id: 72, text: "Amanda is configuring her organization's firewall to implement egress filtering. Which one of the following traffic types should be blocked by her organization's egress filtering policy? (Select all that apply.)", options: ["A. Traffic rapidly scanning many IP addresses on port 22", "B. Traffic with a broadcast destination", "C. Traffic with a source address from an external network", "D. Traffic with a destination address on an external network"] },
    { id: 73, text: "Allie is responsible for reviewing authentication logs on her organization's network. She does not have the time to review all logs, so she decides to choose only records where there have been four or more invalid authentication attempts. What technique is Allie using to reduce the size of the pool?", options: ["A. Sampling", "B. Random selection", "C. Clipping", "D. Statistical analysis"] },
    { id: 74, text: "You are performing an investigation into a potential bot infection on your network and want to perform a forensic analysis of the information that passed between different systems on your network and those on the Internet. You believe that the information was likely encrypted. You are beginning your investigation after the activity concluded. What would be the best and easiest way to obtain the source of this information?", options: ["A. Packet captures", "B. NetFlow data", "C. Intrusion detection system logs", "D. Centralized authentication records"] },
    { id: 75, text: "Which one of the following tools helps system administrators by providing a standard, secure template of configuration settings for operating systems and applications?", options: ["A. Security guidelines", "B. Security policy", "C. Baseline configuration", "D. Running configuration"] },
    { id: 76, text: "What type of disaster recovery test activates the alternate processing facility and uses it to conduct transactions but leaves the primary site up and running?", options: ["A. Full interruption test", "B. Parallel test", "C. Read-through", "D. Tabletop exercise"] },
    { id: 77, text: "During which phase of the incident response process would an analyst receive an intrusion detection system alert and verify its accuracy?", options: ["A. Response", "B. Mitigation", "C. Detection", "D. Reporting"] },
    { id: 78, text: "Kevin is developing a continuous security monitoring strategy for his organization. Which one of the following is not normally used when determining assessment and monitoring frequency?", options: ["A. Threat intelligence", "B. System categorization/impact level", "C. Security control operational burden", "D. Organizational risk tolerance"] },
    { id: 79, text: "Hunter is reviewing his organization's monitoring strategy and identifying new technologies that they might deploy. His assessment reveals that the firm is not doing enough to monitor employee activity on endpoint devices. Which one of the following technologies would best meet his needs?", options: ["A. EDR", "B. IPS", "C. IDS", "D. UEBA"] },
    { id: 80, text: "Bruce is seeing quite a bit of suspicious activity on his network. After consulting records in his SIEM, it appears that an outside entity is attempting to connect to all of his systems using a TCP connection on port 22. What type of scanning is the outsider likely engaging in?", options: ["A. FTP scanning", "B. Telnet scanning", "C. SSH scanning", "D. HTTP scanning"] },
    { id: 81, text: "Dylan believes that a database server in his environment was compromised using a SQL injection attack. Which one of the following actions would Dylan most likely take during the remediation phase of the attack?", options: ["A. Rebuilding the database from backups", "B. Adding input validation to a web application", "C. Reviewing firewall logs", "D. Reviewing database logs"] },
    { id: 82, text: "Roger recently accepted a new position as a security professional at a company that runs its entire IT infrastructure within an IaaS environment. Which one of the following would most likely be the responsibility of Roger's firm?", options: ["A. Configuring the network firewall", "B. Applying hypervisor updates", "C. Patching operating systems", "D. Wiping drives prior to disposal"] },
    { id: 83, text: "What technique can application developers use to test applications in an isolated virtualized environment before allowing them on a production network?", options: ["A. Penetration testing", "B. Sandboxing", "C. White-box testing", "D. Black-box testing"] },
    { id: 84, text: "Gina is the firewall administrator for a small business and recently installed a new firewall. After seeing signs of unusually heavy network traffic, she checked the intrusion detection system, which reported that a SYN flood attack was underway. What firewall configuration change can Gina make to most effectively prevent this attack?", options: ["A. Block SYN from known IPs.", "B. Block SYN from unknown IPs.", "C. Enable SYN-ACK spoofing at the firewall.", "D. Disable TCP."] },
    { id: 85, text: "Nancy is leading an effort to modernize her organization's antimalware protection and would like to add endpoint detection and response (EDR) capabilities. Which of the following actions are normally supported by EDR systems? (Select all that apply.)", options: ["A. Analyzing endpoint memory, filesystem, and network activity for signs of malicious activity", "B. Automatically isolating possible malicious activity to contain the potential damage", "C. Conducting simulated phishing campaigns", "D. Integration with threat intelligence sources"] },
    { id: 86, text: "Alan is assessing the potential for using machine learning and artificial intelligence in his cybersecurity program. Which of the following activities is most likely to benefit from this technology?", options: ["A. Intrusion detection", "B. Account provisioning", "C. Firewall rule modification", "D. Media sanitization"] },
    { id: 87, text: "Timber Industries recently had a dispute with a customer. During a meeting with his account representative, the customer stood up and declared, “There is no other solution. We will have to take this matter to court.” He then left the room. When does Timber Industries have an obligation to begin preserving evidence?", options: ["A. Immediately", "B. Upon receipt of a notice of litigation from opposing attorneys", "C. Upon receipt of a subpoena", "D. Upon receipt of a court order"] },
    { id: 88, text: "Candace is designing a backup strategy for her organization's file server. She would like to perform a backup every weekday that has the smallest possible storage footprint. What type of backup should she perform?", options: ["A. Incremental backup", "B. Full backup", "C. Differential backup", "D. Transaction log backup"] },
    { id: 89, text: "Darcy is a computer security specialist who is assisting with the prosecution of a hacker. The prosecutor requests that Darcy give testimony in court about whether, in her opinion, the logs and other records in a case are indicative of a hacking attempt. What type of evidence is Darcy being asked to provide?", options: ["A. Expert opinion", "B. Direct evidence", "C. Real evidence", "D. Documentary evidence"] },
    { id: 90, text: "Which one of the following techniques is not commonly used to remove unwanted remnant data from magnetic tapes?", options: ["A. Physical destruction", "B. Degaussing", "C. Overwriting", "D. Reformatting"] },
    { id: 91, text: "Sally is building a new server for use in her environment and plans to implement RAID level 1 as a storage availability control. What is the minimum number of physical hard disks that she needs to implement this approach?", options: ["A. One", "B. Two", "C. Three", "D. Five"] },
    { id: 92, text: "Jerome is conducting a forensic investigation and is reviewing database server logs to investigate query contents for evidence of SQL injection attacks. What type of analysis is he performing?", options: ["A. Hardware analysis", "B. Software analysis", "C. Network analysis", "D. Media analysis"] },
    { id: 93, text: "Quigley Computing regularly ships tapes of backup data across the country to a secondary facility. These tapes contain confidential information. What is the most important security control that Quigley can use to protect these tapes?", options: ["A. Locked shipping containers", "B. Private couriers", "C. Data encryption", "D. Media rotation"] },
    { id: 94, text: "Carolyn is concerned that users on her network may be storing sensitive information, such as Social Security numbers, on their hard drives without proper authorization or security controls. What third-party security service can she implement to best detect this activity?", options: ["A. IDS", "B. IPS", "C. DLP", "D. TLS"] },
    { id: 95, text: "Gavin is the disaster recovery team leader for his organization, which is currently in the response phase of an incident that has severe customer impact. Gavin just received a phone call from a reporter asking for details on the root cause and an estimated recovery time. Gavin has this information at his fingertips. What should he do?", options: ["A. Provide the information to the reporter.", "B. Request a few minutes to gather the information and return the call.", "C. Refer the matter to the public relations department.", "D. Refuse to provide any information."] },
    { id: 96, text: "Pauline is reviewing her organization's emergency management plans. What should be the highest priority when creating these plans?", options: ["A. Protection of mission-critical data", "B. Preservation of operational systems", "C. Collection of evidence", "D. Preservation of safety"] },
    { id: 97, text: "Barry is the CIO of an organization that recently suffered a serious operational issue that required activation of the disaster recovery plan. He would like to conduct a lessons learned session to review the incident. Who would be the best facilitator for this session?", options: ["A. Barry, as chief information officer", "B. Chief information security officer", "C. Disaster recovery team leader", "D. External consultant"] },
    { id: 98, text: "Brent is reviewing the controls that will protect his organization in the event of a sustained period of power loss. Which one of the following solutions would best meet his needs?", options: ["A. Redundant servers", "B. Uninterruptible power supply (UPS)", "C. Generator", "D. RAID"] },
    { id: 99, text: "Match each of the numbered terms with its correct lettered definition: Terms: 1. Honeypot, 2. Honeynet, 3. Pseudo-flaw, 4. Darknet. Definitions: A. An intentionally designed vulnerability used to lure in an attacker, B. A network set up with intentional vulnerabilities, C. A system set up with intentional vulnerabilities, D. A monitored network without any hosts.", options: [] },
    { id: 100, text: "Match each of the numbered types of recovery capabilities to their correct lettered definition: Terms: 1. Hot site, 2. Cold site, 3. Warm site, 4. Service bureau. Definitions: A. An organization that can provide on-site or off-site IT services in the event of a disaster, B. A site with dedicated storage and real-time data replication, often with shared equipment that allows restoration of service in a very short time, C. A site that relies on shared storage and backups for recovery, D. A rented space with power, cooling, and connectivity that can accept equipment as part of a recovery effort.", options: [] }
];

// Answers for single/multi-choice (1-98) and mapping for Q99, Q100
const answersMap = {
    1: "A", 2: "D", 3: "C", 4: "B", 5: "D", 6: "C", 7: "B", 8: "B", 9: "A", 10: "A",
    11: "B", 12: "A", 13: "B", 14: "D", 15: "A, B, C", 16: "D", 17: "C", 18: "A", 19: "C", 20: "B",
    21: "A", 22: "B", 23: "D", 24: "B, C, D", 25: "A", 26: "B", 27: "B", 28: "C", 29: "A", 30: "A, C, D",
    31: "C", 32: "C", 33: "C", 34: "D", 35: "A", 36: "A", 37: "D", 38: "B", 39: "D", 40: "A",
    41: "B", 42: "D", 43: "B", 44: "C", 45: "C", 46: "C", 47: "A", 48: "B", 49: "C", 50: "D",
    51: "A", 52: "A", 53: "D", 54: "B", 55: "C", 56: "B", 57: "C", 58: "C", 59: "C", 60: "B",
    61: "B", 62: "C", 63: "C", 64: "A", 65: "D", 66: "B", 67: "D", 68: "C", 69: "B", 70: "C",
    71: "A, B, C, E, F", 72: "B, C", 73: "C", 74: "B", 75: "C", 76: "B", 77: "C", 78: "C", 79: "A", 80: "C",
    81: "B", 82: "C", 83: "B", 84: "B", 85: "A, B, D", 86: "A", 87: "A", 88: "A", 89: "A", 90: "D",
    91: "B", 92: "B", 93: "C", 94: "C", 95: "C", 96: "D", 97: "D", 98: "C"
};

// Mapping for Q99: Honeypot->C, Honeynet->B, Pseudo-flaw->A, Darknet->D
const mappingQ99 = [
    { item: "Honeypot", correct: "C" },
    { item: "Honeynet", correct: "B" },
    { item: "Pseudo-flaw", correct: "A" },
    { item: "Darknet", correct: "D" }
];
// Mapping for Q100: Hot site->B, Cold site->D, Warm site->C, Service bureau->A
const mappingQ100 = [
    { item: "Hot site", correct: "B" },
    { item: "Cold site", correct: "D" },
    { item: "Warm site", correct: "C" },
    { item: "Service bureau", correct: "A" }
];

// Render all questions
const container = document.getElementById('questionsContainer');
questionsData.forEach(q => {
    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = `qcard-${q.id}`;
    const isMultiple = q.options.length > 0 && (q.text.includes("(Select all that apply.)") || q.id === 15 || q.id === 24 || q.id === 30 || q.id === 71 || q.id === 72 || q.id === 85);
    const isMapping = (q.id === 99 || q.id === 100);
    let optionsHtml = '';
    if (isMapping && q.id === 99) {
        optionsHtml = `<table class="mapping-table"><thead><tr><th>Term</th><th>Match to definition (A–D)</th></tr></thead><tbody>`;
        mappingQ99.forEach((item, idx) => {
            optionsHtml += `<tr><td><strong>${item.item}</strong></td><td><select class="map-select-99" data-index="${idx}"><option value="">-- select --</option><option value="A">A. An intentionally designed vulnerability used to lure in an attacker</option><option value="B">B. A network set up with intentional vulnerabilities</option><option value="C">C. A system set up with intentional vulnerabilities</option><option value="D">D. A monitored network without any hosts</option></select></td></tr>`;
        });
        optionsHtml += `</tbody></table>`;
    } else if (isMapping && q.id === 100) {
        optionsHtml = `<table class="mapping-table"><thead><tr><th>Recovery Capability</th><th>Match to definition (A–D)</th></tr></thead><tbody>`;
        mappingQ100.forEach((item, idx) => {
            optionsHtml += `<tr><td><strong>${item.item}</strong></td><td><select class="map-select-100" data-index="${idx}"><option value="">-- select --</option><option value="A">A. An organization that can provide on-site or off-site IT services in the event of a disaster</option><option value="B">B. A site with dedicated storage and real-time data replication, often with shared equipment that allows restoration of service in a very short time</option><option value="C">C. A site that relies on shared storage and backups for recovery</option><option value="D">D. A rented space with power, cooling, and connectivity that can accept equipment as part of a recovery effort</option></select></td></tr>`;
        });
        optionsHtml += `</tbody></table>`;
    } else {
        optionsHtml = `<div class="options">`;
        q.options.forEach(opt => {
            const letter = opt.charAt(0);
            const inputType = isMultiple ? 'checkbox' : 'radio';
            const nameAttr = isMultiple ? `q${q.id}_chk` : `q${q.id}`;
            optionsHtml += `<div class="option"><input type="${inputType}" name="${nameAttr}" value="${letter}" id="q${q.id}_${letter}"> <label for="q${q.id}_${letter}">${opt}</label></div>`;
        });
        optionsHtml += `</div>`;
    }
    card.innerHTML = `<div class="question-header"><span class="q-num">Q${q.id}</span><span class="q-text">${q.text}</span><span class="hashtag" id="hashtag-${q.id}"></span></div>${optionsHtml}`;
    container.appendChild(card);
});

const submitBtn = document.getElementById('submitBtn');
const exportBtn = document.getElementById('exportBtn');
const modal = document.getElementById('summaryModal');
const modalBody = document.getElementById('modalBody');
const closeModal = document.querySelector('.close-modal');
let currentResults = [];

function getUserAnswers() {
    let results = [];
    for (let i = 1; i <= 100; i++) {
        const qid = i;
        let userAnswer = "";
        let isCorrect = false;
        let correctAnswerStr = "";
        if (qid === 99) {
            const selects = document.querySelectorAll('.map-select-99');
            let answers = [];
            selects.forEach(sel => answers.push(sel.value));
            userAnswer = answers.join(', ') || "(no selection)";
            const correct = mappingQ99.map(m => m.correct);
            isCorrect = answers.length === correct.length && answers.every((v, idx) => v === correct[idx]);
            correctAnswerStr = "Honeypot→C, Honeynet→B, Pseudo-flaw→A, Darknet→D";
        } else if (qid === 100) {
            const selects = document.querySelectorAll('.map-select-100');
            let answers = [];
            selects.forEach(sel => answers.push(sel.value));
            userAnswer = answers.join(', ') || "(no selection)";
            const correct = mappingQ100.map(m => m.correct);
            isCorrect = answers.length === correct.length && answers.every((v, idx) => v === correct[idx]);
            correctAnswerStr = "Hot site→B, Cold site→D, Warm site→C, Service bureau→A";
        } else {
            const qData = questionsData.find(q => q.id === qid);
            const isMulti = qData && (qData.text.includes("(Select all that apply.)") || qid === 15 || qid === 24 || qid === 30 || qid === 71 || qid === 72 || qid === 85);
            if (isMulti) {
                const checkboxes = document.querySelectorAll(`input[name="q${qid}_chk"]:checked`);
                const selected = Array.from(checkboxes).map(cb => cb.value).sort();
                userAnswer = selected.join(', ') || "(none)";
                const correctRaw = answersMap[qid];
                const correctArray = correctRaw.split(',').map(s => s.trim()).sort();
                isCorrect = selected.length === correctArray.length && correctArray.every((v,i) => v === selected[i]);
                correctAnswerStr = correctRaw;
            } else {
                const radio = document.querySelector(`input[name="q${qid}"]:checked`);
                userAnswer = radio ? radio.value : "(skipped)";
                const correctLetter = answersMap[qid];
                isCorrect = (radio && radio.value === correctLetter);
                correctAnswerStr = correctLetter;
            }
        }
        const status = (userAnswer === "(skipped)" ? "skipped" : (isCorrect ? "correct" : "incorrect"));
        results.push({ qid, userAnswer, correctAnswer: correctAnswerStr || answersMap[qid] || "Mapping", isCorrect, status });
        const hashtagSpan = document.getElementById(`hashtag-${qid}`);
        if (hashtagSpan) {
            if (status === "correct") hashtagSpan.innerHTML = " #️⃣ correct";
            else if (status === "incorrect") hashtagSpan.innerHTML = " #️⃣ incorrect";
            else hashtagSpan.innerHTML = " #️⃣ skipped";
            hashtagSpan.className = `hashtag ${status}`;
        }
    }
    return results;
}

function escapeHtml(str) {
    if (str === undefined || str === null) return '';
    return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
    });
}

function showModal(results) {
    const total = results.length;
    const correctCount = results.filter(r => r.isCorrect).length;
    let html = `<p><strong>Score: ${correctCount}/${total} (${Math.round(correctCount/total*100)}%)</strong></p>`;
    html += `<table class="result-table"><thead><tr><th>Q#</th><th>Your Answer</th><th>Correct Answer</th><th>Result</th></tr></thead><tbody>`;
    results.forEach(r => {
        const statusText = r.isCorrect ? `<span class="hashtag correct">Correct</span>` : (r.userAnswer === "(skipped)" ? `<span class="hashtag skipped">Skipped</span>` : `<span class="hashtag incorrect">Incorrect</span>`);
        html += `<tr><td>${r.qid}</td><td>${escapeHtml(String(r.userAnswer))}</td><td>${escapeHtml(String(r.correctAnswer))}</td><td>${statusText}</td></tr>`;
    });
    html += `</tbody></table>`;
    modalBody.innerHTML = html;
    modal.style.display = 'flex';
}

function exportCSV(results) {
    let csvRows = [["Question ID","User Answer","Correct Answer","Result"]];
    results.forEach(r => {
        csvRows.push([r.qid, r.userAnswer, r.correctAnswer, r.isCorrect ? "Correct" : (r.userAnswer === "(skipped)" ? "Skipped" : "Incorrect")]);
    });
    const csvContent = csvRows.map(row => row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(",")).join("\n");
    const blob = new Blob(["\uFEFF" + csvContent], {type: "text/csv;charset=utf-8;"});
    const link = document.createElement("a");
    const url = URL.createObjectURL(blob);
    link.href = url;
    link.setAttribute("download", "domain7_results.csv");
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
}

submitBtn.addEventListener('click', () => {
    const results = getUserAnswers();
    currentResults = results;
    const correctCount = results.filter(r => r.isCorrect).length;
    document.getElementById('scoreDisplay').innerHTML = `✅ Score: ${correctCount}/${results.length} (${Math.round(correctCount/results.length*100)}%)`;
    showModal(results);
});
exportBtn.addEventListener('click', () => {
    if (currentResults && currentResults.length) exportCSV(currentResults);
    else alert("Please submit your answers first to generate CSV.");
});
document.getElementById('modalExportBtn').addEventListener('click', () => {
    if (currentResults) exportCSV(currentResults);
});
closeModal.addEventListener('click', () => { modal.style.display = 'none'; });
window.addEventListener('click', (e) => { if (e.target === modal) modal.style.display = 'none'; });
</script>
</body>
</html>
