            { id: 13, text: "Naomi knows that commercial data is typically classified based on different criteria than government data. Which of the following is not a common criterion for commercial data classification?", options: ["A. Useful lifespan", "B. Data value", "C. Impact to national security", "D. Regulatory or legal requirements"] },
            { id: 14, text: "The organization leverages memory-resident databases to improve system performance for both customer data and internal business data. What term best describes data that is resident in system memory?", options: ["A. Data at rest", "B. Buffered data", "C. Data in use", "D. Data in motion"] },

            { id: 18, text: "Why is it cost effective to purchase high-quality media to contain sensitive data?", options: ["A. Expensive media is less likely to fail.", "B. The value of the data often far exceeds the cost of the media.", "C. Expensive media is easier to encrypt.", "D. More expensive media typically improves data integrity."] },
            { id: 19, text: "Chris is responsible for workstations throughout his company and knows that some of the company's workstations are used to handle both proprietary information and highly sensitive trade secrets. Which option best describes what should happen at the end of their life (EOL) for workstations he is responsible for?", options: ["A. Erasing", "B. Clearing", "C. Sanitization", "D. Destruction"] },

            { id: 31, text: "The company that Katie works for provides its staff with mobile phones for employee use, with new phones issued every two years. What scenario best describes this type of practice when the phones themselves are still usable and receiving operating system updates?", options: ["A. EOL", "B. Planned obsolescence", "C. EOS", "D. Device risk management"] },

            { id: 38, text: "What technology could Amanda's employer implement to help prevent confidential data from being emailed out of the organization?", options: ["A. DLP", "B. IDS", "C. A firewall", "D. UDP"] },
            { id: 39, text: "Jacob's organization uses the U.S. government's data classification system, which includes Top Secret, Secret, Confidential, and Unclassified ratings (from most sensitive to least). Jacob encounters a system that contains Secret, Confidential, and Top Secret data. How should it be classified?", options: ["A. Top Secret", "B. Confidential", "C. Secret", "D. Mixed classification"] },
            { id: 40, text: "Elle is planning her organization's asset retention efforts and wants to establish when the company will remove assets from use. Which of the following is typically the last event in a manufacturer or software provider's life cycle?", options: ["A. End of life", "B. End of support", "C. End of sales", "D. General availability"] },
            { id: 41, text: "Alice has been asked to ensure that her organization's controls assessment procedures match the specific systems that the company uses. What activity best matches this task?", options: ["A. Asset management", "B. Compliance", "C. Scoping", "D. Tailoring"] },
            { id: 42, text: "Chris is responsible for his organization's security standards and has guided the selection and implementation of a security baseline for Windows PCs in his organization. How can Chris most effectively make sure that the workstations he is responsible for are being checked for compliance and that settings are being applied as necessary?", options: ["A. Assign users to spot-check baseline compliance.", "B. Use Microsoft Group Policy.", "C. Create start-up scripts to apply policy at system start.", "D. Periodically review the baselines with the data owner and system owners."] },

            { id: 44, text: "As a DBA, Amy's data role in her organization includes technical implementations of the data policies and standards, as well as managing the data structures that the data is stored in. What data role best fits what Amy does?", options: ["A. Data custodian", "B. Data owner", "C. Data processor", "D. Data user"] },
            { id: 45, text: "The company Jim works for suffered from a major data breach in the past year and now wants to ensure that it knows where data is located and if it is being transferred, is being copied to a thumb drive, or is in a network file share where it should not be. Which of the following solutions is best suited to tagging, monitoring, and limiting where files are transferred to?", options: ["A. DRM", "B. DLP", "C. A network IPS", "D. Antivirus"] },
            { id: 46, text: "What security measure can provide an additional security control in the event that backup tapes are stolen or lost?", options: ["A. Keep multiple copies of the tapes.", "B. Replace tape media with hard drives.", "C. Use appropriate security labels.", "D. Use AES-256 encryption."] },
            { id: 47, text: "Joe works at a major pharmaceutical research and development company and has been tasked with writing his organization's data retention policy. As part of its legal requirements, the organization must comply with the U.S. Food and Drug Administration's Code of Federal Regulations Title 21. To do so, it is required to retain records with electronic signatures. Why would a signature be part of a retention requirement?", options: ["A. It ensures that someone has reviewed the data.", "B. It provides confidentiality.", "C. It ensures that the data has been changed.", "D. It validates who approved the data."] },

            { id: 49, text: "Ben has been asked to scrub data to eliminate any information that is no longer needed by his organization. What phase of the data life cycle is Ben most likely operating in?", options: ["A. Data retention", "B. Data maintenance", "C. Data remanence", "D. Data collection"] },
            { id: 50, text: "Steve wants to ensure that assets in his organization are properly secured. What should he do to make sure security practices match the data security requirements for each device in his organization?", options: ["A. Sanitization", "B. Asset tagging", "C. Tailoring", "D. Encryption"] },

            { id: 52, text: "Ben is following the National Institute of Standards and Technology (NIST) Special Publication 800-88 guidelines for sanitization and disposition as shown here. He is handling information that his organization classified as sensitive, which is a moderate security categorization in the NIST model. If the media is going to be sold as surplus, what process does Ben need to follow? (Image: NIST diagram)", options: ["A. Destroy, validate, document", "B. Clear, purge, document", "C. Purge, document, validate", "D. Purge, validate, document"] },

            { id: 63, text: "Which of the following is not a common requirement for the collection of data under data privacy laws and statutes?", options: ["A. Only data that is needed is collected.", "B. Data should be obtained lawfully and via fair methods.", "C. Data should be collected only with the consent of the individual whose data is being collected.", "D. Data should be collected from all individuals equally."] },
            { id: 64, text: "Susan works in an organization that labels all removable media with the classification level of the data it contains, including public data. Why would Susan's employer label all media instead of labeling only the media that contains data that could cause harm if it was exposed?", options: ["A. It is cheaper to order all prelabeled media.", "B. It prevents sensitive media from not being marked by mistake.", "C. It prevents reuse of public media for sensitive data.", "D. Labeling all media is required by HIPAA."] },
            { id: 65, text: "Data stored in RAM is best characterized as what type of data?", options: ["A. Data at rest", "B. Data in use", "C. Data in transit", "D. Data at large"] },
            { id: 66, text: "What issue is the validation portion of the NIST SP 800-88 sample certificate of sanitization (shown here) intended to help prevent? (Image: certificate)", options: ["A. Destruction", "B. Reuse", "C. Data remanence", "D. Attribution"] },
            { id: 67, text: "Why is declassification rarely chosen as an option for media reuse?", options: ["A. Purging is sufficient for sensitive data.", "B. Sanitization is the preferred method of data removal.", "C. It is more expensive than new media and may still fail.", "D. Clearing is required first."] },
            { id: 68, text: "Incineration, crushing, shredding, and disintegration all describe what stage in the life cycle of media?", options: ["A. Sanitization", "B. Degaussing", "C. Purging", "D. Destruction"] },
            { id: 69, text: "What term is used to describe information like prescriptions and X-rays?", options: ["A. PHI", "B. Proprietary data", "C. PID", "D. PII"] },
            { id: 70, text: "Why might an organization use unique screen backgrounds or designs on workstations that deal with data of different classification levels?", options: ["A. To indicate the software version in use", "B. To promote a corporate message", "C. To promote availability", "D. To indicate the classification level of the data or system"] },
            { id: 71, text: "Charles has been asked to downgrade the media used for storage of private data for his organization. What process should Charles follow?", options: ["A. Degauss the drives, and then relabel them with a lower classification level.", "B. Pulverize the drives, and then reclassify them based on the data they contain.", "C. Follow the organization's purging process, and then downgrade and replace labels.", "D. Relabel the media, and then follow the organization's purging process to ensure that the media matches the label."] },
            { id: 72, text: "Which of the following tasks is not performed by a system owner per NIST SP 800-18?", options: ["A. Develops a system security plan", "B. Establishes rules for appropriate use and protection of data", "C. Identifies and implements security controls", "D. Ensures that system users receive appropriate security training"] },
            { id: 73, text: "NIST SP 800-60 provides a process shown in the following diagram to assess information systems. What process does this diagram show? (Image: process diagram)", options: ["A. Selecting a standard and implementing it", "B. Categorizing and selecting controls", "C. Baselining and selecting controls", "D. Categorizing and sanitizing"] },
            { id: 74, text: "Which letters on this diagram are locations where you might find data at rest? (Diagram: workstation/server connections)", options: ["A. A, B, and C", "B. C and E", "C. A and E", "D. B, D, and F"] },
            { id: 75, text: "What would be the best way to secure data at points B, D, and F?", options: ["A. AES-256", "B. SSL", "C. TLS", "D. 3DES"] },
            { id: 76, text: "What is the best way to secure files that are sent from workstation A via the Internet service (C) to remote server E?", options: ["A. Use AES at rest at point A, and use TLS in transit via B and D.", "B. Encrypt the data files and send them.", "C. Use 3DES and TLS to provide double security.", "D. Use full-disk encryption at A and E, and use SSL at B and D."] },
            { id: 77, text: "Susan needs to provide a set of minimum security requirements for email. What steps should she recommend for her organization to ensure that the email remains secure?", options: ["A. All email should be encrypted.", "B. All email should be encrypted and labeled.", "C. Sensitive email should be encrypted and labeled.", "D. Only highly sensitive email should be encrypted."] },
            { id: 78, text: "How can a data retention policy reduce liabilities?", options: ["A. By reducing the amount of storage in use", "B. By limiting the number of data classifications", "C. By reducing the amount of data that may need to be produced for lawsuits", "D. By reducing the legal penalties for noncompliance"] },
            { id: 79, text: "What data role does a system that is used to process data have?", options: ["A. Mission owner", "B. Data owner", "C. Data processor", "D. Custodian"] },
            { id: 80, text: "Which one of the following is not considered PII under U.S. federal government regulations?", options: ["A. Name", "B. Social Security number", "C. Student ID number", "D. ZIP code"] },
            { id: 81, text: "What type of health information is the Health Insurance Portability and Accountability Act required to protect?", options: ["A. PII", "B. PHI", "C. SHI", "D. HPHI"] },
            { id: 82, text: "The system that Ian has built replaces data in a database field with a randomized string of characters that remains the same for each instance of that data. What technique has he used?", options: ["A. Data masking", "B. Tokenization", "C. Anonymization", "D. DES"] },
            { id: 83, text: "Juanita's company processes credit cards and wants to select appropriate data security standards. What data security standard is she most likely to need to use and comply with?", options: ["A. CC-Comply", "B. PCI-DSS", "C. GLBA", "D. GDPR"] },
            { id: 84, text: "What is the best method to sanitize a solid-state drive (SSD)?", options: ["A. Clearing", "B. Zero fill", "C. Disintegration", "D. Degaussing"] },
            { id: 85, text: "What data role will own responsibility for step 1, the categorization of information systems; to whom will they delegate step 2; and what data role will be responsible for step 3? (NIST RMF steps)", options: ["A. Data owners, system owners, custodians", "B. Data processors, custodians, users", "C. Business owners, administrators, custodians", "D. System owners, business owners, administrators"] },
            { id: 86, text: "If the systems that are being assessed all handle credit card information (and no other sensitive data), at what step would the PCI DSS first play an important role? (NIST RMF steps)", options: ["A. Step 1", "B. Step 2", "C. Step 3", "D. Step 4"] },
            { id: 87, text: "What data security role is primarily responsible for step 5? (NIST RMF)", options: ["A. Data owners", "B. Data processors", "C. Custodians", "D. Users"] },
            { id: 88, text: "Susan's organization performs a secure disk wipe process on hard drives before they are sent to a third-party organization to be shredded. What issue is her organization attempting to avoid?", options: ["A. Data retention that is longer than defined in policy", "B. Mishandling of drives by the third party", "C. Classification mistakes", "D. Data permanence"] },
            { id: 89, text: "Mike wants to track hardware assets as devices and equipment are moved throughout his organization. What type of system can help do this without requiring staff to individually check bar codes or serial numbers?", options: ["A. A visual inventory", "B. Wi-Fi MAC address tracking", "C. RFID tags", "D. Steganography"] },
            { id: 90, text: "Retaining and maintaining information for as long as it is needed is known as what?", options: ["A. Data storage policy", "B. Data storage", "C. Asset maintenance", "D. Record retention"] },
            { id: 91, text: "Which of the following activities is not a consideration during data classification?", options: ["A. Who can access the data", "B. What the impact would be if the data was lost or breached", "C. How much the data cost to create", "D. What protection regulations may be required for the data"] },
            { id: 92, text: "What type of encryption is typically used for data at rest?", options: ["A. Asymmetric encryption", "B. Symmetric encryption", "C. DES", "D. OTP"] },
            { id: 93, text: "Which data role is tasked with applying rights that provide appropriate access to staff members?", options: ["A. Data processors", "B. Business owners", "C. Custodians", "D. Administrators"] },
            { id: 94, text: "What element of asset security is often determined by identifying an asset's owner?", options: ["A. It identifies the individual(s) responsible for protecting the asset.", "B. It provides a law enforcement contact in case of theft.", "C. It helps establish the value of the asset.", "D. It determines the security classification of the asset."] },
            { id: 95, text: "Fred is preparing to send backup tapes off-site to a secure third-party storage facility. What steps should Fred take before sending the tapes to that facility?", options: ["A. Ensure that the tapes are handled the same way the original media would be handled based on their classification.", "B. Increase the classification level of the tapes because they are leaving the possession of the company.", "C. Purge the tapes to ensure that classified data is not lost.", "D. Decrypt the tapes in case they are lost in transit."] },
            { id: 96, text: "Which of the following does not describe data in motion?", options: ["A. Data on a backup tape that is being shipped to a storage facility", "B. Data in a TCP packet", "C. Data in an e-commerce transaction", "D. Data in files being copied between locations"] },
            { id: 97, text: "A new law is passed that would result in significant financial harm to your company if the data that it covers was stolen or inadvertently released. What should your organization do about this?", options: ["A. Select a new security baseline.", "B. Relabel the data.", "C. Encrypt all of the data at rest and in transit.", "D. Review its data classifications and classify the data appropriately."] },
            { id: 98, text: "Which of the following data roles are typically found inside of a company instead of as a third-party contracting relationship? (Select all that apply.)", options: ["A. Data owners", "B. Data controllers", "C. Data custodians", "D. Data processors"] },
            { id: 99, text: "What commercial data classification is most appropriate for data contained on corporate websites?", options: ["A. Private", "B. Sensitive", "C. Public", "D. Proprietary"] },
            { id: 100, text: "Match each of the numbered data elements shown here with one of the lettered categories. You may use the categories once, more than once, or not at all. If a data element matches more than one category, choose the one that is most specific. Data elements: 1. Medical records 2. Trade secrets 3. Social Security numbers 4. Driver's license numbers. Categories: A. Proprietary data B. Protected health information C. Personally identifiable information", options: [] }, // mapping
            { id: 101, text: "Michelle wants to ensure that her organization's policies are enforced across all of the cloud services that it has adopted. What type of tool would be best suited to ensuring her organization's policies are enforced, regardless of the cloud service her users are accessing?", options: ["A. A SIEM", "B. A DLP", "C. A CASB", "D. A NGFW"] },
            { id: 102, text: "Devices in Adam's organization are no longer receiving updates, and hardware support contracts cannot be extended. How should Adam describe the devices that are impacted by this?", options: ["A. End of support", "B. End of development", "C. End of life", "D. End of sales"] },
            { id: 103, text: "Gary is responsible for the procurement, management, and life cycle of network devices in his organization. What role best describes him?", options: ["A. Data owner", "B. Asset custodian", "C. Data custodian", "D. Asset owner"] },
            { id: 104, text: "Jessica has adopted the CIS benchmark for Windows 11 workstations for her organization. She has modified what settings are called for in the benchmark to fit her organization's needs as well. What has she done?", options: ["A. Tailoring", "B. Scoping", "C. Editing", "D. Defining"] },
            { id: 105, text: "Why is data location a significant concern for data owners, controllers, and custodians?", options: ["A. It prevents the data from being lost.", "B. Geographic location may impact compliance requirements.", "C. Geographic location may drive storage costs.", "D. It ensures that the proper data custodian works with it."] }
        ];

        // ANSWERS (based on standard CISSP Domain 2 knowledge) – exact correct letters
        const answersMap = {
            1: "A", 2: "C", 3: "B", 4: "B", 5: "A", 6: "A", 7: "D", 8: "C", 9: "C", 10: "A",
            11: "B", 12: "D", 13: "C", 14: "C", 15: "C", 16: "B", 17: "A", 18: "B", 19: "C", 20: "D",
            21: "C", 22: "C", 23: "D", 24: "B", 25: "B", 26: "D", 27: "B", 28: "A", 29: "B", 30: "B",
            31: "C", 32: "D", 33: "B", 34: "A", 35: "D", 36: "C", 37: "C", 38: "A", 39: "A", 40: "B",
            41: "C", 42: "B", 43: "B", 44: "A", 45: "B", 46: "D", 47: "D", 48: "D", 49: "A", 50: "C",
            51: "C", 52: "D", 53: "D", 54: "C", 55: "C", 56: "B", 57: "B", 58: "C", 59: "B", 60: "B",
            61: "C", 62: "D", 63: "D", 64: "B", 65: "B", 66: "C", 67: "C", 68: "D", 69: "A", 70: "D",
            71: "C", 72: "B", 73: "B", 74: "C", 75: "C", 76: "A", 77: "C", 78: "C", 79: "C", 80: "D",
            81: "B", 82: "B", 83: "B", 84: "C", 85: "A", 86: "B", 87: "C", 88: "D", 89: "C", 90: "D",
            91: "C", 92: "B", 93: "C", 94: "A", 95: "A", 96: "A", 97: "D", 98: "A, C", 99: "C",
            // mapping Q100: correct matches: 1-B, 2-A, 3-C, 4-C
            101: "C",   // CASB
            102: "A",   // End of support
            103: "B",   // Asset custodian
            104: "A",   // Tailoring
            105: "B"    // Geographic location may impact compliance requirements
        };
        // For Q100 mapping (special handling)
        const mappingItems = [
            { element: "Medical records", correct: "B" },
            { element: "Trade secrets", correct: "A" },
            { element: "Social Security numbers", correct: "C" },
            { element: "Driver's license numbers", correct: "C" }
        ];

        // Render questions
        const container = document.getElementById('questionsContainer');
        questionsData.forEach(q => {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.id = `qcard-${q.id}`;
            const isMultiple = q.options.length > 0 && q.text.includes("(Select all that apply.)");
            const isMapping = (q.id === 100);
            let optionsHtml = '';
            if (isMapping) {
                optionsHtml = `<table class="mapping-table"><tr><th>Data Element</th><th>Match to category (A, B, or C)</th></tr>`;
                mappingItems.forEach((item, idx) => {
                    optionsHtml += `<tr><td>${item.element}</td><td><select class="map-select-100" data-index="${idx}"><option value="">-- select --</option><option value="A">A. Proprietary data</option><option value="B">B. Protected health information</option><option value="C">C. Personally identifiable information</option></select></td></tr>`;
                });
                optionsHtml += `</table>`;
            } else {
                optionsHtml = `<div class="options">`;
                q.options.forEach(opt => {
                    const letter = opt.charAt(0);
                    const inputType = isMultiple ? 'checkbox' : 'radio';
                    const nameAttr = isMultiple ? `q${q.id}_chk` : `q${q.id}`;
                    optionsHtml += `<div class="option"><input type="${inputType}" name="${nameAttr}" value="${letter}" id="q${q.id}_${letter}"> <label for="q${q.id}_${letter}">${opt}</label></div>`;
                });
                optionsHtml += `</div>`;
            }
            card.innerHTML = `<div class="question-header"><span class="q-num">Q${q.id}</span><span class="q-text">${q.text}</span><span class="hashtag" id="hashtag-${q.id}"></span></div>${optionsHtml}`;
            container.appendChild(card);
        });

        const submitBtn = document.getElementById('submitBtn');
        const exportBtn = document.getElementById('exportBtn');
        const modal = document.getElementById('summaryModal');
        const modalBody = document.getElementById('modalBody');
        const closeModal = document.querySelector('.close-modal');

        let currentResults = [];

        function getUserAnswers() {
            let results = [];
            for (let i = 1; i <= 105; i++) {
                const qid = i;
                let userAnswer = "";
                let isCorrect = false;
                if (qid === 100) {
                    const selects = document.querySelectorAll('.map-select-100');
                    let answers = [];
                    selects.forEach((sel, idx) => {
                        answers.push(sel.value);
                    });
                    userAnswer = answers.join(', ');
                    const correctAnswers = mappingItems.map(m => m.correct);
                    isCorrect = answers.length === correctAnswers.length && answers.every((v, idx) => v === correctAnswers[idx]);
                } else {
                    const qData = questionsData.find(q => q.id === qid);
                    const isMulti = qData && qData.text.includes("(Select all that apply.)");
                    if (isMulti) {
                        const checkboxes = document.querySelectorAll(`input[name="q${qid}_chk"]:checked`);
                        const selected = Array.from(checkboxes).map(cb => cb.value).sort();
                        userAnswer = selected.join(', ') || "(none)";
                        const correctLettersRaw = answersMap[qid];
                        const correctArray = correctLettersRaw.split(',').map(s => s.trim()).sort();
                        isCorrect = selected.length === correctArray.length && correctArray.every((v, i) => v === selected[i]);
                    } else {
                        const radio = document.querySelector(`input[name="q${qid}"]:checked`);
                        userAnswer = radio ? radio.value : "(skipped)";
                        const correctLetter = answersMap[qid];
                        isCorrect = (radio && radio.value === correctLetter);
                    }
                }
                const status = (userAnswer === "(skipped)" ? "skipped" : (isCorrect ? "correct" : "incorrect"));
                results.push({ qid, userAnswer, correctAnswer: answersMap[qid] || "Mapping", isCorrect, status });
                // Update hashtag
                const hashtagSpan = document.getElementById(`hashtag-${qid}`);
                if (hashtagSpan) {
                    if (status === "correct") hashtagSpan.innerHTML = " #️⃣ correct";
                    else if (status === "incorrect") hashtagSpan.innerHTML = " #️⃣ incorrect";
                    else hashtagSpan.innerHTML = " #️⃣ skipped";
                    hashtagSpan.className = `hashtag ${status}`;
                }
            }
            return results;
        }

        function showModal(results) {
            const total = results.length;
            const correctCount = results.filter(r => r.isCorrect).length;
            let html = `<p><strong>Score: ${correctCount}/${total} (${Math.round(correctCount / total * 100)}%)</strong></p>`;
            html += `<table class="result-table"><thead><tr><th>Q#</th><th>Your Answer</th><th>Correct Answer</th><th>Result</th></tr></thead><tbody>`;
            results.forEach(r => {
                const statusText = r.isCorrect ? "Correct" : (r.userAnswer === "(skipped)" ? "Skipped" : "Incorrect");
                html += `<tr><td>${r.qid}</td><td>${escapeHtml(r.userAnswer)}</td><td>${escapeHtml(r.correctAnswer)}</td><td>${statusText}</td></tr>`;
            });
            html += `</tbody></table>`;
            modalBody.innerHTML = html;
            modal.style.display = 'flex';
        }

        function escapeHtml(str) { return str.replace(/[&<>]/g, function (m) { if (m === '&') return '&amp;'; if (m === '<') return '&lt;'; if (m === '>') return '&gt;'; return m; }); }

        function exportCSV(results) {
            let csvRows = [["Question ID", "User Answer", "Correct Answer", "Result"]];
            results.forEach(r => {
                csvRows.push([r.qid, r.userAnswer, r.correctAnswer, r.isCorrect ? "Correct" : (r.userAnswer === "(skipped)" ? "Skipped" : "Incorrect")]);
            });
            const csvContent = csvRows.map(row => row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(",")).join("\n");
            const blob = new Blob(["\uFEFF" + csvContent], { type: "text/csv;charset=utf-8;" });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.href = url;
            link.setAttribute("download", "domain2_results.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        submitBtn.addEventListener('click', () => {
            const results = getUserAnswers();
            currentResults = results;
            const correctCount = results.filter(r => r.isCorrect).length;
            document.getElementById('scoreDisplay').innerHTML = `✅ Score: ${correctCount}/105 (${Math.round(correctCount)}%)`;
            showModal(results);
        });

        exportBtn.addEventListener('click', () => {
            if (currentResults && currentResults.length) exportCSV(currentResults);
            else alert("Please submit your answers first to generate CSV.");
        });
        document.getElementById('modalExportBtn').addEventListener('click', () => {
            if (currentResults) exportCSV(currentResults);
        });
        closeModal.addEventListener('click', () => { modal.style.display = 'none'; });
        window.addEventListener('click', (e) => { if (e.target === modal) modal.style.display = 'none'; });
    </script>
</body>
