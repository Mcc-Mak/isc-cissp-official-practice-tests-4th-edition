    <script>
        // --------------------------------------------------------------
        // EXACT QUESTIONS AND OPTIONS – DOMAIN 3
        // Extracted from the original CISSP practice test XML (1 to 101)
        // --------------------------------------------------------------
        const questionsData = [
            { id: 1, text: "Matthew is the security administrator for a consulting firm and must enforce access controls that restrict users' access based upon their previous activity. For example, once a consultant accesses data belonging to Acme Cola, a consulting client, they may no longer access data belonging to any of Acme's competitors. What security model best fits Matthew's needs?", options: ["A. Clark-Wilson", "B. Biba", "C. Bell-LaPadula", "D. Brewer-Nash"] },
            { id: 2, text: "Referring to the figure shown here, what is the earliest stage of a fire where it is possible to use detection technology to identify it? (Image: fire stages graph)", options: ["A. Incipient", "B. Smoke", "C. Flame", "D. Heat"] },
            { id: 3, text: "Ralph is designing a physical security infrastructure for a new computing facility that will remain largely unstaffed. He plans to implement motion detectors in the facility but would also like to include a secondary verification control for physical presence. Which one of the following would best meet his needs?", options: ["A. CCTV", "B. IPS", "C. Turnstiles", "D. Faraday cages"] },
            { id: 4, text: "Harry would like to retrieve a lost encryption key from a database that uses m of n control, with m = 4 and n = 8. What is the minimum number of escrow agents required to retrieve the key?", options: ["A. 2", "B. 4", "C. 8", "D. 12"] },
            { id: 5, text: "Fran's company is considering purchasing a web-based email service from a vendor and eliminating its own email server environment as a cost-saving measure. What type of cloud computing environment is Fran's company considering?", options: ["A. SaaS", "B. IaaS", "C. CaaS", "D. PaaS"] },
            { id: 6, text: "Bob is a security administrator with the U.S. federal government and wants to choose a digital signature approach that is an approved part of the federal Digital Signature Standard under FIPS 186-5. Which one of the following encryption algorithms is not an acceptable choice for use in digital signatures?", options: ["A. EdDSA", "B. HAVAL", "C. RSA", "D. ECDSA"] },
            { id: 7, text: "Harry would like to access a document owned by Sally and stored on a file server. Applying the subject/object model to this scenario, who or what is the subject of the resource request?", options: ["A. Harry", "B. Sally", "C. Server", "D. Document"] },
            { id: 8, text: "Michael is responsible for forensic investigations and is investigating a medium-severity security incident that involved the defacement of a corporate website. The web server in question ran on a virtualization platform, and the marketing team would like to get the website up and running as quickly as possible. What would be the most reasonable next step for Michael to take?", options: ["A. Keep the website offline until the investigation is complete.", "B. Take the virtualization platform offline as evidence.", "C. Take a snapshot of the compromised system and use that for the investigation.", "D. Ignore the incident and focus on quickly restoring the website."] },
            { id: 9, text: "Helen is a software engineer and is developing code that she would like to restrict to running within an isolated sandbox for security purposes. What software development technique is Helen using?", options: ["A. Bounds", "B. Input validation", "C. Confinement", "D. TCB"] },
            { id: 10, text: "What concept describes the degree of confidence that an organization has that its controls satisfy security requirements?", options: ["A. Trust", "B. Credentialing", "C. Verification", "D. Assurance"] },
            { id: 11, text: "What type of security vulnerability are developers most likely to introduce into code when they seek to facilitate their own access, for testing purposes, to software they developed?", options: ["A. Maintenance hook", "B. Cross-site scripting", "C. SQL injection", "D. Buffer overflow"] },
            { id: 12, text: "In the figure shown here, Sally is blocked from reading the file due to the Biba integrity model. Sally has a Secret security clearance, and the file has a Confidential classification. What principle of the Biba model is being enforced? (Image: Biba diagram)", options: ["A. Simple Security Property", "B. Simple Integrity Property", "C. *-Security Property", "D. *-Integrity Property"] },
            { id: 13, text: "Tom is responsible for maintaining the security of systems used to control industrial processes located within a power plant. What term is used to describe these systems?", options: ["A. POWER", "B. SCADA", "C. HAVAL", "D. COBOL"] },
            { id: 14, text: "Sonia recently removed an encrypted hard drive from a laptop and moved it to a new device because of a hardware failure. She is having difficulty accessing encrypted content on the drive despite that she knows the user's password. What hardware security feature is likely causing this problem?", options: ["A. TCB", "B. TPM", "C. NIACAP", "D. RSA"] },
            { id: 15, text: "Chris wants to verify that a software package that he downloaded matches the original version. What hashing tool should he use if he believes that technically sophisticated attackers may have replaced the software package with a version containing a backdoor?", options: ["A. MD5", "B. 3DES", "C. SHA1", "D. SHA 256"] },
            { id: 16, text: "If Alice wants to send Bob a message that is encrypted for confidentiality, what key does she use to encrypt the message?", options: ["A. Alice's public key", "B. Alice's private key", "C. Bob's public key", "D. Bob's private key"] },
            { id: 17, text: "When Bob receives the encrypted message from Alice, what key does he use to decrypt the message's plaintext content?", options: ["A. Alice's public key", "B. Alice's private key", "C. Bob's public key", "D. Bob's private key"] },
            { id: 18, text: "Which one of the following keys would Bob not possess in this scenario?", options: ["A. Alice's public key", "B. Alice's private key", "C. Bob's public key", "D. Bob's private key"] },
            { id: 19, text: "Alice would also like to digitally sign the message that she sends to Bob. What key should she use to create the digital signature?", options: ["A. Alice's public key", "B. Alice's private key", "C. Bob's public key", "D. Bob's private key"] },
            { id: 20, text: "What name is given to the random value added to a password in an attempt to defeat rainbow table attacks?", options: ["A. Hash", "B. Salt", "C. Extender", "D. Rebar"] },
            { id: 21, text: "Which one of the following is not an attribute of a typical hashing algorithm?", options: ["A. They require a cryptographic key.", "B. They are irreversible.", "C. It is very difficult to find two messages with the same hash value.", "D. They take variable-length input."] },
            { id: 22, text: "What type of fire suppression system fills with water after a valve opens when the initial stages of a fire are detected and then requires a sprinkler head heat activation before dispensing water?", options: ["A. Wet pipe", "B. Dry pipe", "C. Deluge", "D. Preaction"] },
            { id: 23, text: "Susan would like to configure IPsec in a manner that provides confidentiality for the content of packets. What component of IPsec provides this capability?", options: ["A. AH", "B. ESP", "C. IKE", "D. ISAKMP"] },
            { id: 24, text: "Which one of the following cryptographic goals protects against the risks posed when a device is lost or stolen?", options: ["A. Nonrepudiation", "B. Authentication", "C. Integrity", "D. Confidentiality"] },
            { id: 25, text: "Joanna wants to review the status of the industrial control systems her organization uses for building control. What type of systems should she inquire about access to?", options: ["A. SCADA", "B. DSS", "C. BAS", "D. ICS-CSS"] },
            { id: 26, text: "In the figure shown here, Harry's request to write to the data file is blocked. Harry has a Secret security clearance, and the data file has a Confidential classification. What principle of the Bell-LaPadula model blocked this request? (Image: Bell-LaPadula diagram)", options: ["A. Simple Security Property", "B. Simple Integrity Property", "C. *-Security Property", "D. Discretionary Security Property"] },
            { id: 27, text: "Florian and Tobias would like to begin communicating using a symmetric cryptosystem, but they have no prearranged secret and are not able to meet in person to exchange keys. What algorithm can they use to securely exchange the secret key?", options: ["A. IDEA", "B. Diffie-Hellman", "C. RSA", "D. MD5"] },
            { id: 28, text: "Carl's organization recently underwent a user access review. At the conclusion of the review, the auditors noted several cases of privilege creep. What security principle was violated?", options: ["A. Fail securely", "B. Keep it simple and secure", "C. Trust but verify", "D. Least privilege"] },
            { id: 29, text: "Matt's organization recently adopted a zero trust network architecture. Under this approach, which one of the following criteria would be LEAST appropriate to use when granting a subject access to resources?", options: ["A. Password", "B. Two-factor authentication", "C. IP address", "D. Biometric scan"] },
            { id: 30, text: "Colin is the chief privacy officer for a nonprofit organization and is assisting with the team's transition to a Privacy by Design approach. Under this approach, which is not one of the Privacy by Design principles?", options: ["A. Proactive, not reactive", "B. Privacy as the default setting", "C. End-to-end security", "D. Defense in depth"] },
            { id: 31, text: "What cryptographic principle stands behind the idea that cryptographic algorithms should be open to public inspection?", options: ["A. Security through obscurity", "B. Kerckhoffs' principle", "C. Defense in depth", "D. Heisenburg principle"] },
            { id: 32, text: "Ryan is developing a physical access plan for his organization's data center and wants to implement the security control indicated by the arrow in this diagram. What is the name of this control? (Image: access control vestibule)", options: ["A. Access control vestibule", "B. Turnstile", "C. Intrusion prevention system", "D. Portal"] },
            { id: 33, text: "Which one of the following does not describe a standard physical security requirement for wiring closets?", options: ["A. Place only in areas monitored by security guards.", "B. Do not store flammable items in the closet.", "C. Use sensors on doors to log entries.", "D. Perform regular inspections of the closet."] },
            { id: 34, text: "In the figure shown here, Sally is blocked from writing to the data file by the Biba integrity model. Sally has a Secret security clearance, and the file is classified Top Secret. What principle is preventing her from writing to the file? (Image: Biba write block)", options: ["A. Simple Security Property", "B. Simple Integrity Property", "C. *-Security Property", "D. *-Integrity Property"] },
            { id: 35, text: "Lana recently implemented a new process in her organization where managers who are responsible for granting users access to a system are not permitted to participate in access reviews. What principle is she enforcing?", options: ["A. Two-person control", "B. Least privilege", "C. Privilege creep", "D. Segregation of duties"] },
            { id: 36, text: "Which of the following statements about system development are correct? (Select all that apply.)", options: ["A. Systems should be designed to operate in a secure manner if the user performs no other configuration.", "B. Systems should be designed to fall back to a secure state if they experience an error.", "C. Systems should be designed to incorporate security as a design feature.", "D. Systems should be designed in a manner that keeps their functionality as simple as possible."] },
            { id: 37, text: "Alan is reviewing a system that has been assigned the EAL1 evaluation assurance level under the Common Criteria. What is the degree of assurance that he may have about the system?", options: ["A. It has been functionally tested.", "B. It has been structurally tested.", "C. It has been formally verified, designed, and tested.", "D. It has been methodically designed, tested, and reviewed."] },
            { id: 38, text: "Jake works for a research organization that is seeking to deploy a grid computing system that will perform cycle scavenging on user workstations to conduct research tasks that require high-performance computing. What is the most significant risk associated with this operation?", options: ["A. Data confidentiality", "B. Isolation breach", "C. Data integrity", "D. Data availability"] },
            { id: 39, text: "Eimear's software development team uses an approach that creates many discrete software objects and then binds them together using APIs. What term best describes this architecture?", options: ["A. Microservices", "B. Function-as-a-service", "C. Containerization", "D. Virtualization"] },
            { id: 40, text: "Adam recently configured permissions on an NTFS filesystem to describe the access that different users may have to a file by listing each user individually. What did Adam create?", options: ["A. An access control list", "B. An access control entry", "C. Role-based access control", "D. Mandatory access control"] },
            { id: 41, text: "Betty is concerned about the use of buffer overflow attacks against a custom application developed for use in her organization. What security control would provide the strongest defense against these attacks?", options: ["A. Firewall", "B. Intrusion detection system", "C. Parameter checking", "D. Vulnerability scanning"] },
            { id: 42, text: "Which one of the following combinations of controls best embodies the defense-in-depth principle?", options: ["A. Encryption of email and network intrusion detection", "B. Cloud access security brokers (CASBs) and security awareness training", "C. Data loss prevention and multifactor authentication", "D. Network firewall and host firewall"] },
            { id: 43, text: "James is working with a Department of Defense system that is authorized to simultaneously handle information classified at the Secret and Top Secret levels. What type of system is he using?", options: ["A. Single state", "B. Unclassified", "C. Compartmented", "D. Multistate"] },
            { id: 44, text: "Kyle is being granted access to a military computer system that uses System High mode. What is not true about Kyle's security clearance requirements?", options: ["A. Kyle must have a clearance for the highest level of classification processed by the system, regardless of his access.", "B. Kyle must have access approval for all information processed by the system.", "C. Kyle must have a valid need to know for all information processed by the system.", "D. Kyle must have a valid security clearance."] },
            { id: 45, text: "Gary intercepts a communication between two individuals and suspects that they are exchanging secret messages. The content of the communication appears to be the image shown here. What type of technique may the individuals use to hide messages inside this image? (Image: seashore photo)", options: ["A. Visual cryptography", "B. Steganography", "C. Cryptographic hashing", "D. Transport layer security"] },
            { id: 46, text: "Philip is developing a new security tool that will be used by individuals in many different subsidiaries of his organization. He chooses to use Docker to deploy the tool to simplify configuration. What term best describes this approach?", options: ["A. Virtualization", "B. Abstraction", "C. Simplification", "D. Containerization"] },
            { id: 47, text: "In the ring protection model shown here, what ring contains the operating system's kernel? (Image: ring diagram)", options: ["A. Ring 0", "B. Ring 1", "C. Ring 2", "D. Ring 3"] },
            { id: 48, text: "In an infrastructure-as-a-service environment where a vendor supplies a customer with access to storage services, who is normally responsible for removing sensitive data from drives that are taken out of service?", options: ["A. Customer's security team", "B. Customer's storage team", "C. Customer's vendor management team", "D. Vendor"] },
            { id: 49, text: "During a system audit, Casey notices that the private key for her organization's web server has been stored in a public Amazon S3 storage bucket for more than a year. Which one of the following actions should she take first?", options: ["A. Remove the key from the bucket.", "B. Notify all customers that their data may have been exposed.", "C. Request a new certificate using a new key.", "D. Nothing, because the private key should be accessible for validation."] },
            { id: 50, text: "Which one of the following systems assurance processes provides an independent third-party evaluation of a system's controls that may be trusted by many different organizations?", options: ["A. Certification", "B. Definition", "C. Verification", "D. Accreditation"] },
            { id: 51, text: "Darcy's organization is deploying serverless computing technology to better meet the needs of developers and users. In a serverless model, who is normally responsible for configuring operating system security controls?", options: ["A. Software developer", "B. Cybersecurity professional", "C. Cloud architect", "D. Vendor"] },
            { id: 52, text: "Harold is assessing the susceptibility of his environment to hardware failures and would like to identify the expected lifetime of a piece of hardware. What measure should he use for this?", options: ["A. MTTR", "B. MTTF", "C. RTO", "D. MTO"] },
            { id: 53, text: "Chris is designing a cryptographic system for use within his company. The company has 1,000 employees, and they plan to use an asymmetric encryption system. They would like the system to be set up so that any pair of arbitrary users may communicate privately. How many total keys will they need?", options: ["A. 500", "B. 1,000", "C. 2,000", "D. 499,500"] },
            { id: 54, text: "Gary is concerned about applying consistent security settings to the many mobile devices used throughout his organization. What technology would best assist with this challenge?", options: ["A. MDM", "B. IPS", "C. IDS", "D. SIEM"] },
            { id: 55, text: "Alice sent a message to Bob. Bob would like to demonstrate to Charlie that the message he received definitely came from Alice. What goal of cryptography is Bob attempting to achieve?", options: ["A. Authentication", "B. Confidentiality", "C. Nonrepudiation", "D. Integrity"] },
            { id: 56, text: "Rhonda is considering the use of new identification cards for physical access control in her organization. She comes across a military system that uses the card shown here. What type of card is this? (Image: smart card)", options: ["A. Smart card", "B. Proximity card", "C. Magnetic stripe card", "D. Phase three card"] },
            { id: 57, text: "Gordon is concerned about the possibility that hackers may be able to use the Van Eck radiation phenomenon to remotely read the contents of computer monitors in a restricted work area within his facility. What technology would protect against this type of attack?", options: ["A. TCSEC", "B. SCSI", "C. GHOST", "D. TEMPEST"] },
            { id: 58, text: "Jorge believes that an attacker has obtained the hash of the Kerberos service account from one of his organization's Active Directory servers. What type of attack would this enable?", options: ["A. Golden ticket", "B. Kerberoasting", "C. Pass the ticket", "D. Brute force"] },
            { id: 59, text: "Sherry conducted an inventory of the cryptographic technologies in use within her organization and found the following algorithms and protocols in use. Which one of these technologies should she replace because it is no longer considered secure?", options: ["A. MD5", "B. AES", "C. PGP", "D. WPA3"] },
            { id: 60, text: "Robert is investigating a security breach and discovers the Mimikatz tool installed on a system in his environment. What type of attack has likely taken place?", options: ["A. Password cracking", "B. Pass the hash", "C. MAC spoofing", "D. ARP poisoning"] },
            { id: 61, text: "Tom is a cryptanalyst and is working on breaking a cryptographic algorithm's secret key. He has a copy of an intercepted message that is encrypted, and he also has a copy of the decrypted version of that message. He wants to use both the encrypted message and its decrypted plaintext to retrieve the secret key for use in decrypting other messages. What type of attack is Tom engaging in?", options: ["A. Chosen ciphertext", "B. Chosen plaintext", "C. Known plaintext", "D. Brute force"] },
            { id: 62, text: "A hacker recently violated the integrity of data in James's company by modifying a file using a precise timing attack. The attacker waited until James verified the integrity of a file's contents using a hash value and then modified the file between the time that James verified the integrity and read the contents of the file. What type of attack took place?", options: ["A. Social engineering", "B. TOCTOU", "C. Data diddling", "D. Parameter checking"] },
            { id: 63, text: "Carl is deploying a set of video sensors that will be placed in remote locations as part of a research project. Because of connectivity limitations, he would like to perform as much image processing and computation as possible on the device itself before sending results back to the cloud for further analysis. What computing model would best meet his needs?", options: ["A. Serverless computing", "B. Edge computing", "C. IaaS computing", "D. SaaS computing"] },
            { id: 64, text: "What action can you take to prevent accidental data disclosure due to wear leveling on an SSD device before reusing the drive?", options: ["A. Reformatting", "B. Disk encryption", "C. Degaussing", "D. Physical destruction"] },
            { id: 65, text: "Johnson Widgets strictly limits access to total sales volume information, classifying it as a competitive secret. However, shipping clerks have unrestricted access to order records to facilitate transaction completion. A shipping clerk recently pulled all of the individual sales records for a quarter from the database and totaled them up to determine the total sales volume. What type of attack occurred?", options: ["A. Social engineering", "B. Inference", "C. Aggregation", "D. Data diddling"] },
            { id: 66, text: "What physical security control broadcasts false emanations constantly to mask the presence of true electromagnetic emanations from computing equipment?", options: ["A. Faraday cage", "B. Copper-infused windows", "C. Shielded cabling", "D. White noise"] },
            { id: 67, text: "In a software-as-a-service cloud computing environment, who is normally responsible for ensuring that appropriate firewall controls are in place to protect the application?", options: ["A. Customer's security team", "B. Vendor", "C. Customer's networking team", "D. Customer's infrastructure management team"] },
            { id: 68, text: "Alice has read permissions on an object, and she would like Bob to have those same rights. Which one of the rules in the Take-Grant protection model would allow her to complete this operation?", options: ["A. Create rule", "B. Remove rule", "C. Grant rule", "D. Take rule"] },
            { id: 69, text: "As part of his incident response process, Charles securely wipes the drive of a compromised machine and reinstalls the operating system (OS) from original media. Once he is done, he patches the machine fully and applies his organization's security templates before reconnecting the system to the network. Almost immediately after the system is returned to service, he discovers that it has reconnected to the same botnet it was part of before. Where should Charles look for the malware that is causing this behavior?", options: ["A. The operating system partition", "B. The system BIOS or firmware", "C. The system memory", "D. The installation media"] },
            { id: 70, text: "Lauren implements ASLR to help prevent system compromises. What technique has she used to protect her system?", options: ["A. Encryption", "B. Mandatory access control", "C. Memory address randomization", "D. Discretionary access control"] },
            { id: 71, text: "Alan intercepts an encrypted message and wants to determine what type of algorithm was used to create the message. He first performs a frequency analysis and notes that the frequency of letters in the message closely matches the distribution of letters in the English language. What type of cipher was most likely used to create this message?", options: ["A. Substitution cipher", "B. AES", "C. Transposition cipher", "D. 3DES"] },
            { id: 72, text: "In a zero trust network architecture, what component is responsible for making policy decisions based upon rules and external data sources?", options: ["A. Policy engine", "B. Policy administrator", "C. Policy enforcement point", "D. Subject"] },
            { id: 73, text: "Grace would like to implement application control technology in her organization. Users often need to install new applications for research and testing purposes, and she does not want to interfere with that process. At the same time, she would like to block the use of known malicious software. What type of application control would be appropriate in this situation?", options: ["A. Blacklisting", "B. Graylisting", "C. Whitelisting", "D. Bluelisting"] },
            { id: 74, text: "Warren is designing a physical intrusion detection system for use in a sensitive media storage facility and wants to include technology that issues an alert if the communications lines for the alarm system are unexpectedly cut. What technology would meet this requirement?", options: ["A. Heartbeat sensor", "B. Emanation security", "C. Motion detector", "D. Faraday cage"] },
            { id: 75, text: "John and Gary are negotiating a business transaction, and John must demonstrate to Gary that he has access to a system. He engages in an electronic version of the “magic door” scenario shown here. What technique is John using? (Image: zero-knowledge proof diagram)", options: ["A. Split-knowledge proof", "B. Zero-knowledge proof", "C. Logical proof", "D. Mathematical proof"] },
            { id: 76, text: "After scanning all of the systems on his wireless network, Mike notices that one system is identified as an iOS device running a massively out-of-date version of Apple's mobile operating system. When he investigates further, he discovers that the device is an original iPad and that it cannot be updated to a current secure version of the operating system. What would be the best option for handling this device?", options: ["A. Retire or replace the device.", "B. Isolate the device on a dedicated wireless network.", "C. Install a firewall on the tablet.", "D. Reinstall the OS."] },
            { id: 77, text: "Tonya believes that an attacker was able to eavesdrop on legitimate HTTPS communications between her users and remote web servers by engaging in a DNS poisoning attack. After conducting DNS poisoning, what technique would an attacker likely use to conduct this eavesdropping?", options: ["A. Man-in-the-middle", "B. Brute-force", "C. Timing", "D. Meet-in-the-middle"] },
            { id: 78, text: "Howard is choosing a cryptographic algorithm for his organization, and he would like to choose an algorithm that supports the creation of digital signatures. Which one of the following algorithms would meet his requirement?", options: ["A. RSA", "B. 3DES", "C. AES", "D. Blowfish"] },
            { id: 79, text: "Laura is responsible for securing her company's web-based applications and wants to conduct an educational program for developers on common web application security vulnerabilities. Where can she turn for a concise listing of the most common web application issues?", options: ["A. CVE", "B. NSA", "C. OWASP", "D. CSA"] },
            { id: 80, text: "The Bell-LaPadula and Biba models implement state machines in a fashion that uses what specific state machine model?", options: ["A. Information flow", "B. Noninterference", "C. Cascading", "D. Feedback"] },
            { id: 81, text: "During a third-party vulnerability scan and security test, Danielle's employer recently discovered that the embedded systems that were installed to manage her company's new buildings have a severe remote access vulnerability. The manufacturer has gone out of business, and there is no patch or update for the devices. What should Danielle recommend that her employer do about the hundreds of devices that are vulnerable?", options: ["A. Identify a replacement device model and replace every device.", "B. Turn off all of the devices.", "C. Move the devices to a secure and isolated network segment.", "D. Reverse engineer the devices and build an in-house patch."] },
            { id: 82, text: "What type of motion detector senses changes in the electromagnetic fields in monitored areas?", options: ["A. Infrared", "B. Wave pattern", "C. Capacitance", "D. Photoelectric"] },
            { id: 83, text: "Mike has been tasked with preventing an outbreak of malware like Mirai, a botnet that targeted IP-based cameras and routers. What type of systems should be protected in his organization?", options: ["A. Servers", "B. SCADA", "C. Mobile devices", "D. Internet of Things (IoT) devices"] },
            { id: 84, text: "Which one of the following statements is correct about the Biba model of access control?", options: ["A. It addresses confidentiality and integrity.", "B. It addresses integrity and availability.", "C. It prevents covert channel attacks.", "D. It focuses on protecting objects from integrity threats."] },
            { id: 85, text: "In Transport Layer Security, what type of key is used to encrypt the actual content of communications between a web server and a client?", options: ["A. Ephemeral session key", "B. Client's public key", "C. Server's public key", "D. Server's private key"] },
            { id: 86, text: "Beth would like to include technology in a secure area of her data center to protect against unwanted electromagnetic emanations. What technology would assist her with this goal?", options: ["A. Heartbeat sensor", "B. Faraday cage", "C. Piggybacking", "D. WPA2"] },
            { id: 87, text: "In a virtualized computing environment, what component is responsible for enforcing separation between guest machines?", options: ["A. Guest operating system", "B. Hypervisor", "C. Kernel", "D. Protection manager"] },
            { id: 88, text: "Rick is an application developer who works primarily in Python. He recently decided to evaluate a new service where he provides his Python code to a vendor who then executes it on their server environment. What type of cloud computing environment is this service?", options: ["A. SaaS", "B. PaaS", "C. IaaS", "D. CaaS"] },
            { id: 89, text: "A component failure in the primary HVAC system leads to a high temperature alarm in the data center that Kim manages. After resolving the issue, what should Kim consider to prevent future issues like this?", options: ["A. A closed loop chiller", "B. Redundant cooling systems", "C. Swamp coolers", "D. Relocating the data center to a colder climate"] },
            { id: 90, text: "Tommy is planning to implement a power conditioning UPS for a rack of servers in his data center. Which one of the following conditions will the UPS be unable to protect against if it persists for an extended period of time?", options: ["A. Fault", "B. Blackout", "C. Sag", "D. Noise"] },
            { id: 91, text: "Which one of the following humidity values is within the acceptable range for a data center operation?", options: ["A. 0%", "B. 10%", "C. 15%", "D. 40%"] },
            { id: 92, text: "Kristen's organization suffered a ransomware infection and has lost access to critical business data. She is considering paying the ransom to regain access to her data. Which of the following statements about this payment are correct? (Select all that apply.)", options: ["A. Payment of the ransom may be illegal.", "B. Payment of the ransom may result in further demands for payments.", "C. Payment of the ransom guarantees access to the decryption key.", "D. Payment of the ransom may cause a data breach."] },
            { id: 93, text: "Alex's employer creates most of their work output as PDF files. Alex is concerned about limiting the audience for the PDF files to those individuals who have paid for them. What technology can he use to most effectively control the access to and distribution of these files?", options: ["A. EDM", "B. Encryption", "C. Digital signatures", "D. DRM"] },
            { id: 94, text: "As part of his team's forensic investigation process, Matt signs out drives and other evidence from an evidence storage facility before working with them. What type of documentation is he creating?", options: ["A. Criminal", "B. Chain of custody", "C. Civil", "D. CYA"] },
            { id: 95, text: "Todd believes that a digital certificate used by his organization has been compromised, and he wants to add it to the certificate revocation list (CRL). What element of the certificate goes on the CRL?", options: ["A. Serial number", "B. Public key", "C. Digital signature", "D. Private key"] },
            { id: 96, text: "Alison is examining a digital certificate presented to her by her bank's website. Which one of the following requirements is not necessary for her to trust the digital certificate?", options: ["A. She knows that the server belongs to the bank.", "B. She trusts the certificate authority.", "C. She verifies that the certificate is not listed on a CRL.", "D. She verifies the digital signature on the certificate."] },
            { id: 97, text: "Which one of the following is an example of a covert timing channel when used to exfiltrate information from an organization?", options: ["A. Sending an electronic mail message", "B. Posting a file on a peer-to-peer file sharing service", "C. Typing with the rhythm of Morse code", "D. Writing data to a shared memory space"] },
            { id: 98, text: "Which one of the following would be a reasonable application for the use of self-signed digital certificates?", options: ["A. Digital commerce website", "B. Banking application", "C. Internal scheduling application", "D. Customer portal"] },
            { id: 99, text: "Ron is investigating a security incident that took place at a highly secure government facility. He believes that encryption keys were stolen during the attack and finds evidence that the attackers used dry ice to freeze an encryption component. What type of attack was likely attempted?", options: ["A. Side channel attack", "B. Brute-force attack", "C. Timing attack", "D. Fault injection attack"] },

        const explanations = {
            1: "The Brewer-Nash model allows access controls to change dynamically based upon a user's actions. It is often used in environments like Matthew's to implement a “Chinese wall” between data belonging to different clients.",
            2: "Fires may be detected as early as the incipient stage. During this stage, air ionization takes place, and specialized incipient fire detection systems can identify these changes to provide early warning of a fire.",
            3: "Closed-circuit television (CCTV) systems act as a secondary verification mechanism for physical presence because they allow security officials to view the interior of the facility when a motion alarm sounds to determine the current occupants and their activities.",
            4: "In an m of n control system, at least m of n possible escrow agents must collaborate to retrieve an encryption key from the escrow database.",
            5: "This is an example of a vendor offering a fully functional application as a web-based service. Therefore, it fits under the definition of software as a service (SaaS). In infrastructure as a service (IaaS), compute as a service (CaaS), and platform as a service (PaaS), the customer provides their own software. In this example, the vendor is providing the email software, so none of those choices is appropriate.",
            6: "The Digital Signature Standard approves three encryption algorithms for use in digital signatures: the Rivest, Shamir, Adleman (RSA) algorithm; the Elliptic Curve DSA (ECDSA) algorithm, and the Edwards Curve Digital Signature Algorithm (EdDSA). HAVAL is a hash function, not an encryption algorithm. While hash functions are used as part of the digital signature process, they do not provide encryption.",
            7: "In the subject/object model of access control, the user or process making the request for a resource is the subject of that request. In this example, Harry is requesting resource access and is, therefore, the subject.",
            8: "Michael should conduct his investigation, but there is a pressing business need to bring the website back online. The most reasonable course of action would be to take a snapshot of the compromised system and use the snapshot for the investigation, restoring the website to operation as quickly as possible while using the results of the investigation to improve the security of the site.",
            9: "Using a sandbox is an example of confinement, where the system restricts the access of a particular process to limit its ability to affect other processes running on the same system.",
            10: "Assurance is the degree of confidence that an organization has that its security controls are correctly implemented. It must be continually monitored and reverified.",
            11: "Maintenance hooks, otherwise known as backdoors, provide developers with easy access to a system, bypassing normal security controls. If not removed prior to finalizing code, they pose a significant security vulnerability if an attacker discovers the maintenance hook.",
            12: "The Simple Integrity Property states that an individual may not read a file classified at a lower security level than the individual's security clearance.",
            13: "Supervisory control and data acquisition (SCADA) systems are used to control and gather data from industrial processes. They are commonly found in power plants and other industrial environments.",
            14: "The Trusted Platform Module (TPM) is a hardware security technique that stores an encryption key on a chip on the motherboard and prevents someone from accessing an encrypted drive by installing it in another computer.",
            15: "Intentional collisions have been created with MD5, and a real-world collision attack against SHA 1 was announced in early 2017. 3DES is not a hashing tool, leaving SHA 256 (sometimes called SHA 2) as the only real choice that Chris has in this list.",
            16: "In an asymmetric cryptosystem, the sender of a message encrypts the message using the recipient's public key. The recipient may then decrypt that message using their own private key, which only they should possess.",
            17: "When Bob receives the message, he uses his own private key to decrypt it. Since he is the only one with his private key, he is the only one who should be able to decrypt it, thus preserving confidentiality.",
            18: "Each user retains their own private key as secret information. In this scenario, Bob would only have access to his own private key and would not have access to the private key of Alice or any other user.",
            19: "Alice creates the digital signature using her own private key. Then Bob, or any other user, can verify the digital signature using Alice's public key.",
            20: "The salt is a random value added to a password before it is hashed by the operating system. The salt is then stored in a password file with the hashed password. This increases the complexity of cryptanalytic attacks by negating the usefulness of attacks that use precomputed hash values, such as rainbow tables.",
            21: "Hash functions do not include any element of secrecy and, therefore, do not require a cryptographic key.",
            22: "A preaction fire suppression system activates in two steps. The pipes fill with water once the early signs of a fire are detected. The system does not dispense water until heat sensors on the sprinkler heads trigger the second phase.",
            23: "The Encapsulating Security Payload (ESP) protocol provides confidentiality and integrity for packet contents. It encrypts packet payloads and provides limited authentication and protection against replay attacks.",
            24: "The greatest risk when a device is lost or stolen is that sensitive data contained on the device will fall into the wrong hands. Confidentiality processes protect against this risk. Nonrepudiation is when the recipient of a message can prove the originator's identity to a third party. Authentication is a means of proving one's identity. Integrity demonstrates that information has not been modified since transmission.",
            25: "Supervisory Control and Data Acquisition systems, or SCADA systems, provide a graphical interface to monitor industrial control systems (ICS). Joanna should ask about access to her organization's SCADA systems.",
            26: "The *-Security Property states that an individual may not write to a file at a lower classification level than that of the individual. This is also known as the confinement property.",
            27: "The Diffie-Hellman algorithm allows for the secure exchange of symmetric encryption keys over a public network. IDEA and RSA are encryption algorithms. MD5 is a hashing function.",
            28: "The principle of least privilege says that an employee should have only the minimum necessary privileges required to perform their jobs. Privilege creep indicates that an employee has accumulated permissions that they no longer require, indicating a violation of the least privilege principle. The trust but verify principle says that organizations should use auditing to ensure that control objectives are met. The fail securely principle says that security controls should default to a secure state in the event of a control failure. The keep it simple and secure principle says that security controls and other technologies should remain as simple as possible while still completing their objectives.",
            29: "In a zero trust network architecture, access control decisions should never be made based upon a system's location on the network. Therefore, an IP address should never be used and would be the least appropriate of these options. While the other options have differing levels of security (two-factor authentication is clearly stronger than a password or biometrics alone), they do not violate the principles of a zero trust network architecture.",
            30: "While defense in depth is a strong security principle, it is not a component of Privacy by Design. The following are the seven principles of the Privacy by Design model: Proactive, not reactive; preventative not remedial; Privacy as the default; Privacy embedded into design; Full functionality—positive-sum, not zero-sum; End-to-end life-cycle protection; Visibility and transparency; Respect for user privacy.",
            31: "Kerckhoffs' principle says that a cryptographic system should be secure even if everything about the system, except the key, is public knowledge.",
            32: "Access control vestibules use two sets of doors to control access to a facility. This may be used to prevent piggybacking by monitoring use of the vestibule to allow only a single individual to enter a facility at a time. They may also be used to allow manual inspection of individuals or perform other security screening. Access control vestibules are also commonly known as mantraps.",
            33: "While it would be ideal to have wiring closets in a location where they are monitored by security staff, this is not feasible in most environments. Wiring closets must be distributed geographically in multiple locations across each building used by an organization.",
            34: "The *-Integrity Property states that a subject cannot modify an object at a higher integrity level than that possessed by the subject.",
            35: "The segregation of duties principle says that no employee should have permission to perform two tasks that, when combined, would pose a security risk. In this situation, an employee auditing their own work would create a conflict of interest, so Lana has implemented a segregation of duties. Two-person control is closely related, but it requires that two different employees approve an action. If she required that two managers approve new accounts, that would be an example of two-person control.",
            36: "All of these statements are correct. The idea that systems should be designed to operate in a secure manner if the user performs no other configuration is the secure defaults principle. The idea that systems should be designed to fall back to a secure state if they experience an error is the fail securely principle. The idea that systems should be designed to incorporate security as a design feature is the security by design principle. The idea that systems should be designed in a manner that keeps their functionality as simple as possible is the keep it simple principle.",
            37: "EAL1 assurance applies when the system in question has been functionally tested. It is the lowest level of assurance under the Common Criteria.",
            38: "The system can be designed in a manner that protects the confidentiality, integrity, and availability of data. The research workstations included in the grid are from internal users, minimizing the risk of distributing the data. However, an isolation breach in the distributed computing client could be catastrophic, allowing someone who compromises the controller to assume control of every device in the organization.",
            39: "This is an example of a microservices architecture. Each of the component microservices performs a discrete task and then communicates with other microservices using APIs. This might be accomplished using function-as-a-service (FaaS) cloud computing, containerization, and/or virtualization, but there is no indication whether those services are being used in the scenario.",
            40: "Adam created a list of individual users who may access the file. This is an access control list, which consists of multiple access control entries. It includes the names of users, so it is not role-based, and Adam was able to modify the list, so it is not mandatory access control.",
            41: "Parameter checking, or input validation, is used to ensure that input provided by users to an application matches the expected parameters for the application. Developers may use parameter checking to ensure that input does not exceed the expected length, preventing a buffer overflow attack.",
            42: "The defense-in-depth principle suggests using multiple overlapping security controls to achieve the same control objective. Network and host firewalls are both designed to limit network traffic and therefore are an example of defense in depth. The encryption of email and network intrusion detection are unrelated controls and do not satisfy the same objective. The same is true for the combination of CASB and security awareness training and the combination of DLP and multifactor authentication.",
            43: "Multistate systems are certified to handle data from different security classifications simultaneously by implementing protection mechanisms that segregate data appropriately.",
            44: "For systems running in System High mode, the user must have a valid security clearance for all information processed by the system, access approval for all information processed by the system, and a valid need to know for some, but not necessarily all, information processed by the system.",
            45: "Steganography is the art of using cryptographic techniques to embed secret messages within other content. Some steganographic algorithms work by making alterations to the least significant bits of the many bits that make up image files.",
            46: "All of these terms accurately describe this use of technology. However, the use of Docker is best described as a containerization technology, so this is the best possible answer choice.",
            47: "The kernel lies within the central ring, Ring 0. Conceptually, Ring 1 contains other operating system components. Ring 2 is used for drivers and protocols. User-level programs and applications run at Ring 3. Rings 0 through 2 run in privileged mode, while Ring 3 runs in user mode. It is important to note that many modern operating systems do not fully implement this model.",
            48: "In an infrastructure-as-a-service environment, security duties follow a shared responsibility model. Since the vendor is responsible for managing the storage hardware, the vendor would retain responsibility for destroying or wiping drives as they are taken out of service. However, it is still the customer's responsibility to validate that the vendor's sanitization procedures meet their requirements prior to utilizing the vendor's storage services.",
            49: "The first thing Casey should do is notify her management, but after that, replacing the certificate and using proper key management practices with the new certificate's key should be at the top of her list.",
            50: "The verification process is similar to the certification process in that it validates security controls. Verification may go a step further by involving a third-party testing service and compiling results that may be trusted by many different organizations. Accreditation is the act of management formally accepting a system, not evaluating the system itself.",
            51: "In a serverless computing model, the vendor does not expose details of the operating system to its customers. Therefore, the vendor retains full responsibility for configuring it securely under the shared responsibility model of cloud computing.",
            52: "The mean time to failure (MTTF) provides the average amount of time before a device of that particular specification fails.",
            53: "Asymmetric cryptosystems use a pair of keys for each user. In this case, with 1,000 users, the system will require 2,000 keys. 499,500 would be the correct answer for a symmetric system.",
            54: "Mobile Device Management (MDM) products provide a consistent, centralized interface for applying security configuration settings to mobile devices.",
            55: "Nonrepudiation occurs when the recipient of a message is able to demonstrate to a third party that the message came from the purported sender.",
            56: "The card shown in the image has a smart chip underneath the American flag. Therefore, it is an example of a smart card. This is the most secure type of identification card technology.",
            57: "The TEMPEST program creates technology that is not susceptible to Van Eck phreaking attacks because it reduces or suppresses natural electromagnetic emanations.",
            58: "Golden ticket attacks use the hash of the Kerberos service account to create tickets in an Active Directory environment. Kerberoasting attacks rely on collected TGS tickets. Pass the ticket attacks rely on tickets harvested from the LSASS process. Brute-force attacks depend on random guessing without any additional information.",
            59: "The MD5 hashing algorithm has known collisions and, as of 2005, is no longer considered secure for use in modern environments. The AES, PGP, and WPA3 algorithms are all still considered secure.",
            60: "The use of the Mimikatz tool is indicative of an attempt to capture user password hashes for use in a pass-the-hash attack against Microsoft Active Directory accounts.",
            61: "In a known plaintext attack, the attacker has a copy of the encrypted message along with the plaintext message used to generate that ciphertext. In a chosen plaintext attack, the attacker has the ability to choose the plaintext to be encrypted. In a chosen ciphertext attack, the attacker can choose the ciphertext output. In a brute-force attack, the attacker simply tries all possible key combinations.",
            62: "In a time of check to time of use (TOCTOU) attack, the attacker exploits the difference in time between when a security control is verified and the data protected by the control is actually used.",
            63: "In this case, most cloud service models (including IaaS, SaaS, and serverless/FaaS) would require transmitting most information back to the cloud. The edge computing service model would be far more appropriate, as it places computing power at the sensor, minimizing the data that must be sent back to the cloud over limited connectivity network links.",
            64: "Wear leveling is about writing to the disk evenly. Encrypting the data would protect against the disclosure of data on portions of the disk that have remnants due to too much wear and having been set aside as no longer usable. Disk formatting does not effectively remove data from any device. Degaussing is effective only for magnetic media. Physically destroying the drive would not permit reuse.",
            65: "In an aggregation attack, individual(s) use their access to specific pieces of information to piece together a larger picture that they are not authorized to access.",
            66: "While all of the controls mentioned protect against unwanted electromagnetic emanations, only white noise is an active control. White noise generates false emanations that effectively “jam” the true emanations from electronic equipment.",
            67: "In a software-as-a-service environment, the customer has no access to any underlying infrastructure, so firewall management is a vendor responsibility under the cloud computing shared responsibility model.",
            68: "The grant rule allows a subject to grant rights that it possesses on an object to another subject.",
            69: "The system Charles is remediating may have a firmware or BIOS infection, with malware resident on the system board. While uncommon, this type of malware can be difficult to find and remove. Since he used original media, it is unlikely that the malware came from the software vendor. Charles wiped the system partition, and the system would have been rebooted before being rebuilt, thus clearing system memory.",
            70: "Lauren has implemented address space layout randomization, a memory protection methodology that randomizes memory locations, which prevents attackers from using known address spaces and contiguous memory regions to execute code via overflow or stack smashing attacks.",
            71: "This message was most likely encrypted with a transposition cipher. The use of a substitution cipher, a category that includes AES and 3DES, would change the frequency distribution so that it did not mirror that of the English language. This type of attack, where the attacker only has access to an encrypted message, is also known as a ciphertext-only attack.",
            72: "In a zero trust network architecture, the policy engine is responsible for making policy decisions based upon rules and external data sources. It uses a trust algorithm to decide whether to grant, deny, or revoke access, considering factors like identity management, threat intelligence, and security information and event management (SIEM) data. The policy administrator, on the other hand, acts based on the decisions made by the policy engine, establishing or removing communication paths and managing session-specific credentials. The policy enforcement point enforces these decisions by controlling access to resources based on instructions from the policy administrator. Lastly, the subject refers to users, services, or systems that request access or attempt to use rights and is not involved in decision-making.",
            73: "The blacklisting approach to application control allows users to install any software they want except for packages specifically identified by the administrator as prohibited. This would be an appropriate approach in a scenario where users should be able to install any nonmalicious software they want to use.",
            74: "Heartbeat sensors send periodic status messages from the alarm system to the monitoring center. The monitoring center triggers an alarm if it does not receive a status message for a prolonged period of time, indicating that communications were disrupted.",
            75: "In a zero-knowledge proof, one individual demonstrates to another that they can achieve a result that requires sensitive information without actually disclosing the sensitive information.",
            76: "When operating system patches are no longer available for mobile devices, the best option is typically to retire or replace the device. Building isolated networks will not stop the device from being used for browsing or other purposes, which means it is likely to continue to be exposed to threats. Installing a firewall will not remediate the security flaws in the OS, although it may help somewhat. Finally, reinstalling the OS will not allow new updates or fix the root issue.",

        // Mapping for Q100
        const mappingQ100 = [
            { item: "Clark-Wilson", correct: "C" },
            { item: "Bell-LaPadula", correct: "A" },
            { item: "Biba", correct: "B" }
        ];

        // Mapping for Q101
        const mappingQ101 = [
            { item: "Time of check", correct: "C" },
            { item: "Covert channel", correct: "A" },
            { item: "Time of use", correct: "D" },
            { item: "Maintenance hooks", correct: "E" },
            { item: "Parameter checking", correct: "F" },
            { item: "Race condition", correct: "B" }
        ];

        // Render questions
        const container = document.getElementById('questionsContainer');
        questionsData.forEach(q => {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.id = `qcard-${q.id}`;
            const isMultiple = q.options.length > 0 && (q.text.includes("(Select all that apply.)") || q.id === 36 || q.id === 92);
            const isMapping = (q.id === 100 || q.id === 101);
            let optionsHtml = '';
            if (isMapping && q.id === 100) {
                optionsHtml = `<table class="mapping-table"><thead><tr><th>Security Model</th><th>Match to description (A, B, or C)</th></tr></thead><tbody>`;
                mappingQ100.forEach((item, idx) => {
                    optionsHtml += `<tr>
                        <td><strong>${item.item}</strong></td>
                        <td><select class="map-select-100" data-index="${idx}">
                            <option value="">-- select --</option>
                            <option value="A">A. This model blocks lower-classified objects from accessing higher-classified objects, thus ensuring confidentiality.</option>
                            <option value="B">B. The * property of this model can be summarized as “no write-up.”</option>
                            <option value="C">C. This model uses security labels to grant access to objects via transformation procedures and a restricted interface model.</option>
                        </select></td>
                    </tr>`;
                });
                optionsHtml += `</tbody></table>`;
            } else if (isMapping && q.id === 101) {
                optionsHtml = `<table class="mapping-table"><thead><tr><th>Architectural Security Concept</th><th>Match to description (A–F)</th></tr></thead><tbody>`;
                mappingQ101.forEach((item, idx) => {
                    optionsHtml += `<tr>
                        <td><strong>${item.item}</strong></td>
                        <td><select class="map-select-101" data-index="${idx}">
                            <option value="">-- select --</option>
                            <option value="A">A. A method used to pass information over a path not normally used for communication</option>
                            <option value="B">B. The exploitation of the reliance of a system's behavior on the sequence of events that occur externally</option>
                            <option value="C">C. The time at which the subject checks whether an object is available</option>
                            <option value="D">D. The time at which a subject can access an object</option>
                            <option value="E">E. An access method known only to the developer of the system</option>
                            <option value="F">F. A method that can help prevent buffer overflow attacks</option>
                        </select></td>
                    </td>`;
                });
                optionsHtml += `</tbody><table>`;
            } else {
                optionsHtml = `<div class="options">`;
                q.options.forEach(opt => {
                    const letter = opt.charAt(0);
                    const inputType = isMultiple ? 'checkbox' : 'radio';
                    const nameAttr = isMultiple ? `q${q.id}_chk` : `q${q.id}`;
                    optionsHtml += `<div class="option"><input type="${inputType}" name="${nameAttr}" value="${letter}" id="q${q.id}_${letter}"> <label for="q${q.id}_${letter}">${opt}</label></div>`;
                });
                optionsHtml += `</div>`;
            }
            card.innerHTML = `<div class="question-header"><span class="q-num">Q${q.id}</span><span class="q-text">${q.text}</span><span class="hashtag" id="hashtag-${q.id}"></span></div>${optionsHtml}`;
            container.appendChild(card);
        });

        const submitBtn = document.getElementById('submitBtn');
        const exportBtn = document.getElementById('exportBtn');
        const modal = document.getElementById('summaryModal');
        const modalBody = document.getElementById('modalBody');
        const closeModal = document.querySelector('.close-modal');
        let currentResults = [];

        function getUserAnswers() {
            let results = [];
            for (let i = 1; i <= 101; i++) {
                const qid = i;
                let userAnswer = "";
                let isCorrect = false;
                let correctAnswerStr = "";
                let explanation = explanations[qid] || "No explanation available.";
                if (qid === 100) {
                    const selects = document.querySelectorAll('.map-select-100');
                    let answers = [];
                    selects.forEach(sel => answers.push(sel.value));
                    userAnswer = answers.join(', ') || "(no selection)";
                    const correct = mappingQ100.map(m => m.correct);
                    isCorrect = answers.length === correct.length && answers.every((v, idx) => v === correct[idx]);
                    correctAnswerStr = "Clark-Wilson→C, Bell-LaPadula→A, Biba→B";
                } else if (qid === 101) {
                    const selects = document.querySelectorAll('.map-select-101');
                    let answers = [];
                    selects.forEach(sel => answers.push(sel.value));
                    userAnswer = answers.join(', ') || "(no selection)";
                    const correct = mappingQ101.map(m => m.correct);
                    isCorrect = answers.length === correct.length && answers.every((v, idx) => v === correct[idx]);
                    correctAnswerStr = "Time of check→C, Covert channel→A, Time of use→D, Maintenance hooks→E, Parameter checking→F, Race condition→B";
                } else {
                    const isMulti = (qid === 36 || qid === 92);
                    if (isMulti) {
                        const checkboxes = document.querySelectorAll(`input[name="q${qid}_chk"]:checked`);
                        const selected = Array.from(checkboxes).map(cb => cb.value).sort();
                        userAnswer = selected.join(', ') || "(none)";
                        const correctRaw = answersMap[qid];
                        const correctArray = correctRaw.split(',').map(s => s.trim()).sort();
                        isCorrect = selected.length === correctArray.length && correctArray.every((v, i) => v === selected[i]);
                        correctAnswerStr = correctRaw;
                    } else {
                        const radio = document.querySelector(`input[name="q${qid}"]:checked`);
                        userAnswer = radio ? radio.value : "(skipped)";
                        const correctLetter = answersMap[qid];
                        isCorrect = (radio && radio.value === correctLetter);
                        correctAnswerStr = correctLetter;
                    }
                }
                const status = (userAnswer === "(skipped)" ? "skipped" : (isCorrect ? "correct" : "incorrect"));
                results.push({ qid, userAnswer, correctAnswer: (qid === 100 || qid === 101) ? correctAnswerStr : (answersMap[qid] || "Mapping"), isCorrect, status, explanation });
                const hashtagSpan = document.getElementById(`hashtag-${qid}`);
                if (hashtagSpan) {
                    if (status === "correct") hashtagSpan.innerHTML = " #️⃣ correct";
                    else if (status === "incorrect") hashtagSpan.innerHTML = " #️⃣ incorrect";
                    else hashtagSpan.innerHTML = " #️⃣ skipped";
                    hashtagSpan.className = `hashtag ${status}`;
                }
            }
            return results;
        }

        function showModal(results) {
            document.querySelectorAll(`input,select`).forEach(e => e.disabled = true);
            const total = results.length;
            const correctCount = results.filter(r => r.isCorrect).length;
            let html = `<p><strong>Score: ${correctCount}/${total} (${Math.round(correctCount / total * 100)}%)</strong></p>`;
            html += `<div style="overflow-x: auto;"><table class="result-table"><thead><tr><th>Q#</th><th>Your Answer</th><th>Correct Answer</th><th>Result</th><th>Explanation</th></tr></thead><tbody>`;
            results.forEach(r => {
                const statusText = r.isCorrect ? `<span class="hashtag correct">Correct</span>` : (r.userAnswer === "(skipped)" ? `<span class="hashtag skipped">Skipped</span>` : `<span class="hashtag incorrect">Incorrect</span>`);
                html += `<tr>
                    <td>${r.qid}</td>
                    <td>${escapeHtml(r.userAnswer)}</td>
                    <td>${escapeHtml(r.correctAnswer)}</td>
                    <td>${statusText}</td>
                    <td>${escapeHtml(r.explanation)}</td>
                </tr>`;
            });
            html += `</tbody></table></div>`;
            modalBody.innerHTML = html;
            modal.style.display = 'flex';
        }

        function escapeHtml(str) {
            if (str === undefined || str === null) return '';
            return str.replace(/[&<>]/g, function (m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        function exportCSV(results) {
            let csvRows = [["Question ID", "User Answer", "Correct Answer", "Result", "Explanation"]];
            results.forEach(r => {
                csvRows.push([r.qid, r.userAnswer, r.correctAnswer, r.isCorrect ? "Correct" : (r.userAnswer === "(skipped)" ? "Skipped" : "Incorrect"), r.explanation]);
            });
            const csvContent = csvRows.map(row => row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(",")).join("\n");
            const blob = new Blob(["\uFEFF" + csvContent], { type: "text/csv;charset=utf-8;" });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.href = url;
            link.setAttribute("download", "domain3_results.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        submitBtn.addEventListener('click', () => {
            const results = getUserAnswers();
            currentResults = results;
            const correctCount = results.filter(r => r.isCorrect).length;
            document.getElementById('scoreDisplay').innerHTML = `✅ Score: ${correctCount}/101 (${Math.round(correctCount / 101 * 100)}%)`;
            showModal(results);
        });

        exportBtn.addEventListener('click', () => {
            if (currentResults && currentResults.length) exportCSV(currentResults);
            else alert("Please submit your answers first to generate CSV.");
        });
        document.getElementById('modalExportBtn').addEventListener('click', () => {
            if (currentResults) exportCSV(currentResults);
        });
        closeModal.addEventListener('click', () => { modal.style.display = 'none'; });
        window.addEventListener('click', (e) => { if (e.target === modal) modal.style.display = 'none'; });
    </script>
</body>
