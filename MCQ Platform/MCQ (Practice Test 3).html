<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Practice Test 3 – CISSP (All Domains)</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
        }

        body {
            background: #f0f2f5;
            margin: 0;
            padding: 20px;
            color: #1e293b;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 0.25rem;
            color: #0f3b5c;
        }

        .sub {
            color: #2c5a7a;
            margin-bottom: 2rem;
            border-left: 4px solid #2c7da0;
            padding-left: 1rem;
        }

        .toolbar {
            background: white;
            border-radius: 20px;
            padding: 1rem 1.5rem;
            margin-bottom: 2rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            position: sticky;
            top: 10px;
            z-index: 10;
            backdrop-filter: blur(8px);
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid #e2e8f0;
        }

        button {
            background: #1e6f5c;
            color: white;
            border: none;
            padding: 8px 22px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            background: #0f5a49;
            transform: translateY(-1px);
        }

        .btn-export {
            background: #2b6e4e;
        }

        .score-area {
            font-size: 1.2rem;
            font-weight: 700;
            background: #e9f5f1;
            padding: 6px 18px;
            border-radius: 40px;
            color: #0e5e4a;
        }

        .questions-grid {
            display: flex;
            flex-direction: column;
            gap: 1.75rem;
        }

        .question-card {
            background: white;
            border-radius: 24px;
            padding: 1.3rem 1.8rem;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.03);
            border: 1px solid #e2edf2;
        }

        .question-header {
            display: flex;
            gap: 12px;
            align-items: baseline;
            flex-wrap: wrap;
            margin-bottom: 1rem;
            border-bottom: 2px solid #eef2f8;
            padding-bottom: 0.5rem;
        }

        .q-num {
            background: #d4e6f1;
            padding: 4px 12px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 0.8rem;
            color: #1a4d6b;
        }

        .q-text {
            font-weight: 600;
            font-size: 1rem;
            line-height: 1.4;
            color: #0f2f3f;
        }

        .hashtag {
            font-size: 0.8rem;
            margin-left: auto;
            background: #f1f5f9;
            padding: 4px 12px;
            border-radius: 40px;
            font-weight: 500;
        }

        .hashtag.correct {
            background: #c8e6df;
            color: #0b5345;
        }

        .hashtag.incorrect {
            background: #f8dddd;
            color: #9b2c2c;
        }

        .hashtag.skipped {
            background: #fff3bf;
            color: #856404;
        }

        .options {
            margin: 1rem 0 0.5rem 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .option input {
            margin: 0;
            width: 18px;
            height: 18px;
            accent-color: #2c7da0;
        }

        .option label {
            font-size: 0.95rem;
            color: #1e3b4a;
        }

        .mapping-table {
            margin: 1rem 0 0.5rem 1rem;
            border-collapse: collapse;
            background: #fafdff;
            width: 100%;
            max-width: 800px;
        }

        .mapping-table td,
        .mapping-table th {
            border: 1px solid #cbdde6;
            padding: 10px 12px;
            vertical-align: middle;
        }

        .mapping-table th {
            background: #e7f0f5;
            font-weight: 600;
        }

        select {
            padding: 6px 12px;
            border-radius: 28px;
            border: 1px solid #bdd4e2;
            background: white;
            font-size: 0.9rem;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            border-radius: 28px;
            max-width: 95%;
            width: 1200px;
            max-height: 85%;
            overflow: auto;
            padding: 1.5rem;
            position: relative;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.2);
        }

        .close-modal {
            position: absolute;
            top: 12px;
            right: 20px;
            font-size: 28px;
            cursor: pointer;
            color: #777;
        }

        .result-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
            background: white;
        }

        .result-table th,
        .result-table td {
            border: 1px solid #d4dee5;
            padding: 10px 8px;
            text-align: left;
            vertical-align: top;
        }

        .result-table th {
            background: #eef3f7;
        }

        footer {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.75rem;
            color: #5b7c93;
        }

        @media (max-width: 760px) {
            .question-card {
                padding: 1rem;
            }

            .options {
                margin-left: 0.2rem;
            }
        }
    </style>
</head>

<body>

        <div class="toolbar">

    <div id="summaryModal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>

    <script>
        // =============================================================
        // PRACTICE TEST 3 – QUESTIONS (exact wording from earlier XML)
        // 125 questions, IDs 1 to 125
        // =============================================================
        const questionsData = [
            { id: 1, text: "Fred's data role requires him to maintain system security plans and to ensure that system users and support staff get the training they need about security practices and acceptable use. What is the role that Fred is most likely to hold in the organization?", options: ["A. Data owner", "B. System owner", "C. User", "D. Custodian"] },
            { id: 2, text: "Sally is using IPsec's ESP component in transport mode. What important information should she be aware of about transport mode?", options: ["A. Transport mode provides full encryption of the entire IP packet.", "B. Transport mode adds a new, unencrypted header to ensure that packets reach their destination.", "C. Transport mode does not encrypt the header of the packet.", "D. Transport mode provides no encryption; only tunnel mode provides encryption."] },
            { id: 3, text: "Which one of the following is not an essential process area for the Repeatable phase of the Software Capability Maturity Model (SW-CMM)?", options: ["A. Software Project Planning", "B. Software Quality Management", "C. Software Project Tracking", "D. Software Subcontract Management"] },
            { id: 4, text: "Ben wants to provide predictive information about his organization's risk exposure in an automated way as part of an ongoing organizational risk management plan. What should he use to do this?", options: ["A. KRIs", "B. Quantitative risk assessments", "C. KPIs", "D. Penetration tests"] },
            { id: 5, text: "In the image shown here, what does system B send to system A at step 2 of the three-way TCP handshake? (Image: TCP handshake)", options: ["A. SYN", "B. ACK", "C. FIN/ACK", "D. SYN/ACK"] },
            { id: 6, text: "Chris is conducting reconnaissance on a remote target and discovers that pings are allowed through his target's border firewall. What can he learn by using pings to probe the remote network?", options: ["A. Which systems respond to pings, a rough network topology, and potentially the location of additional firewalls", "B. A list of all of the systems behind the target's firewall", "C. The hostnames and time to live (TTL) for each pingable system and the ICMP types allowed through the firewall", "D. Router advertisements, echo request responses, and potentially which hosts are tarpitted"] },
            { id: 7, text: "Jake is conducting a review of his organization's identity and access management program. During his review, he is verifying the privileges assigned to each user and ensuring that they match with business requirements. What element of the program is he reviewing?", options: ["A. Identification", "B. Accounting", "C. Authorization", "D. Authentication"] },
            { id: 8, text: "Faith is looking at the /etc/passwd file on a system configured to use shadowed passwords. When she examines a line in the file for a user with interactive login permissions, what should she expect to see in the password field?", options: ["A. Plaintext password", "B. Hashed password", "C. x", "D. *"] },
            { id: 9, text: "Berta is analyzing the logs of the Windows Firewall on one of her servers and comes across the entries shown in this figure. What type of attack do these entries indicate? (Image: firewall log)", options: ["A. SQL injection", "B. Port scan", "C. Teardrop", "D. Land"] },
            { id: 10, text: "Danielle is testing tax software, and part of her testing process requires her to input a variety of actual tax forms to verify that the software produces the right answers. What type of testing is Danielle performing?", options: ["A. Use-case testing", "B. Dynamic testing", "C. Fuzzing", "D. Misuse testing"] },
            { id: 11, text: "After 10 years working in her organization, Cassandra is moving into her fourth role, this time as a manager in the accounting department. What issue is likely to show up during an account review if her organization does not have strong account maintenance practices?", options: ["A. An issue with least privilege", "B. Privilege creep", "C. Account creep", "D. Account termination"] },
            { id: 12, text: "IP addresses like 10.10.10.10 and 172.19.24.21 are both examples of what type of IP address?", options: ["A. Public IP addresses", "B. Prohibited IP addresses", "C. Private IP addresses", "D. Class B IP ranges"] },
            { id: 13, text: "Ben is reviewing the password recovery mechanism used by his website and discovers that the approach uses cognitive authentication through the use of security questions. What is the major issue with this approach?", options: ["A. It prevents the use of tokens.", "B. The question's answer may be easy to find on the Internet.", "C. Cognitive passwords require users to think to answer the question, and not all users may be able to solve the problems presented.", "D. Cognitive passwords don't support long passwords."] },
            { id: 14, text: "Megan needs to create a forensic copy of a hard drive that will be used in an investigation. Which of the following tools is best suited to her work?", options: ["A. xcopy", "B. dd", "C. DBAN", "D. ImageMagick"] },
            { id: 15, text: "Kay is selecting an application management approach for her organization. Employees need the flexibility to install software on their systems, but Kay wants to prevent them from installing certain prohibited packages. What type of approach should she use?", options: ["A. Antivirus", "B. Whitelist", "C. Blacklist", "D. Heuristic"] },
            { id: 16, text: "Donna is a security administrator for a healthcare provider located in the United States and is reviewing their payment processing system. It contains data relating to the past, present, or future payment for the provision of healthcare to an individual. How would this information be classified under HIPAA?", options: ["A. PCI", "B. Personal billing data", "C. PHI", "D. PII"] },
            { id: 17, text: "Harold's company has a strong password policy that requires a minimum length of 12 characters and the use of both alphanumeric characters and symbols. What technique would be the most effective way for an attacker to compromise passwords in Harold's organization?", options: ["A. Brute-force attack", "B. Dictionary attack", "C. Rainbow table attack", "D. Social engineering attack"] },
            { id: 18, text: "While traveling, James is held at knifepoint and forced to log into his laptop. What is this called?", options: ["A. Duress", "B. Antisocial engineering", "C. Distress", "D. Knifepoint hacking"] },
            { id: 19, text: "Kayla recently took a position at a new start-up company that runs entirely in the cloud. The company leverages a major IaaS provider for hosting its web services and a SaaS email system. Both of these providers operate multitenant environments. What term best describes the type of cloud environment this organization uses?", options: ["A. Public cloud", "B. Dedicated cloud", "C. Private cloud", "D. Hybrid cloud"] },
            { id: 20, text: "Cameron is responsible for backing up his company's primary file server. He configured a backup schedule that performs full backups every Monday evening at 9 p.m. and incremental backups on other days of the week at that same time. How many files will be copied in Wednesday's backup? (Image: file changes)", options: ["A. 1", "B. 2", "C. 5", "D. 6"] },
            { id: 21, text: "Susan uses a SPAN port to monitor traffic to her production website and uses a monitoring tool to identify performance issues in real time. What type of monitoring is she conducting?", options: ["A. Passive monitoring", "B. Active monitoring", "C. Synthetic monitoring", "D. Signature-based monitoring"] },
            { id: 22, text: "In what type of attack do attackers manage to insert themselves into a connection between a user and a legitimate website?", options: ["A. Man-in-the-middle attack", "B. Fraggle attack", "C. Wardriving attack", "D. Meet-in-the-middle attack"] },
            { id: 23, text: "Which one of the following would be considered an example of infrastructure-as-a-service cloud computing?", options: ["A. Payroll system managed by a vendor and delivered over the web", "B. Application platform managed by a vendor that runs customer code", "C. Servers provisioned by customers on a vendor-managed virtualization platform", "D. Web-based email service provided by a vendor"] },
            { id: 24, text: "Based on the information in this scenario, what is the exposure factor for the effect of a fire on the Roscommon Agricultural Products data center? (Scenario: replacement cost $2M, fire damage $750k)", options: ["A. 7.5%", "B. 15.0%", "C. 27.5%", "D. 37.5%"] },
            { id: 25, text: "Based on the information in this scenario, what is the annualized rate of occurrence for a fire at the Roscommon Agricultural Products data center? (Expect a fire once every 50 years)", options: ["A. 0.002", "B. 0.005", "C. 0.02", "D. 0.05"] },
            { id: 26, text: "Based on the information in this scenario, what is the annualized loss expectancy for a fire at the Roscommon Agricultural Products data center?", options: ["A. $15,000", "B. $25,000", "C. $75,000", "D. $750,000"] },
            { id: 27, text: "Which one of the following techniques uses statistical methods to select a small number of log records from a large pool for further analysis with the goal of choosing a set of records that is representative of the entire pool?", options: ["A. Clipping", "B. Randomization", "C. Sampling", "D. Selection"] },
            { id: 28, text: "Mike wants to ensure that third-party users of his service's API can be tracked to prevent abuse of the API. What should he implement to help with this?", options: ["A. Session IDs", "B. An API firewall", "C. API keys", "D. An API buffer"] },
            { id: 29, text: "Fran is a web developer who works for an online retailer. Her boss asked her to create a way that customers can easily integrate themselves with Fran's company's site. They need to be able to check inventory in real time, place orders, and check order status programmatically without having to access the web page. What can Fran create to most directly facilitate this interaction?", options: ["A. An API", "B. A web scraper", "C. A data dictionary", "D. A call center"] },
            { id: 30, text: "Todd's data center facility recently experienced a series of events that involved the momentary loss of power. What term best describes these events?", options: ["A. Fault", "B. Blackout", "C. Sag", "D. Brownout"] },
            { id: 31, text: "Lauren's team of system administrators each deals with hundreds of systems with varying levels of security requirements and finds it difficult to handle the multitude of usernames and passwords they each have. What type of solution should she recommend to ensure that passwords are properly handled and that features like logging and password rotation occur?", options: ["A. A credential management system", "B. A strong password policy", "C. Separation of duties", "D. Single sign-on"] },
            { id: 32, text: "Ed's Windows system can't connect to the network, and ipconfig shows the following: (Image: APIPA address 169.254.x.x). What has occurred on the system?", options: ["A. The system has been assigned an invalid IP address by its DHCP server.", "B. The system has a manually assigned IP address.", "C. The system has failed to get a DHCP address and has assigned itself an address.", "D. The subnet mask is set incorrectly, and the system cannot communicate with the gateway."] },
            { id: 33, text: "Gina is performing the initial creation of user accounts for a batch of new employees. What phase of the provisioning process is she conducting?", options: ["A. Enrollment", "B. Clearance verification", "C. Background checks", "D. Initialization"] },
            { id: 34, text: "Ravi is developing procedures for forensic investigations conducted by his organization and would like to differentiate based upon the evidentiary standards commonly used for each type of investigation. What type of forensic investigation typically has the highest evidentiary standards?", options: ["A. Administrative", "B. Criminal", "C. Civil", "D. Industry"] },
            { id: 35, text: "What U.S. legal protection prevents law enforcement agencies from searching an American facility or electronic system without either probable cause or consent?", options: ["A. First Amendment", "B. Fourth Amendment", "C. Fifth Amendment", "D. Fifteenth Amendment"] },
            { id: 36, text: "Tom believes that a customer of his Internet service provider has been exploiting a vulnerability in his system to read the email messages of other customers. If true, what law did the customer most likely violate?", options: ["A. ECPA", "B. CALEA", "C. HITECH", "D. Privacy Act"] },
            { id: 37, text: "In the protection ring model shown here, what ring contains user programs and applications? (Image: ring diagram)", options: ["A. Ring 0", "B. Ring 1", "C. Ring 2", "D. Ring 3"] },
            { id: 38, text: "In virtualization platforms, what name is given to the module that is responsible for controlling access to physical resources by virtual resources?", options: ["A. Guest machine", "B. SDN", "C. Kernel", "D. Hypervisor"] },
            { id: 39, text: "In which cloud computing model does a customer share computing infrastructure with other customers of the cloud vendor where one customer may not know the other's identity?", options: ["A. Public cloud", "B. Private cloud", "C. Community cloud", "D. Shared cloud"] },
            { id: 40, text: "Justin recently participated in a disaster recovery plan test where the team sat together and discussed the response to a scenario but did not actually activate any disaster recovery controls. What type of test did he participate in?", options: ["A. Read-through", "B. Full interruption test", "C. Parallel test", "D. Tabletop exercise"] },
            { id: 41, text: "Susan wants to integrate her website to allow users to use accounts from sites like Google. What technology should she adopt?", options: ["A. Kerberos", "B. LDAP", "C. OpenID Connect", "D. SESAME"] },
            { id: 42, text: "Tom is conducting a business continuity planning effort for Orange Blossoms, a fruit orchard located in Central Florida. During the assessment process, the committee determined that there is a small risk of snow in the region but that the cost of implementing controls to reduce the impact of that risk is not warranted. They elect to not take any specific action in response to the risk. What risk management strategy is Orange Blossoms pursuing?", options: ["A. Risk mitigation", "B. Risk transference", "C. Risk avoidance", "D. Risk acceptance"] },
            { id: 43, text: "Paul is reviewing the contents of an audit report and discovers a finding that a manager in the accounting department has full access to perform every function in the financial system. What security principles have most likely been violated? (Select all that apply.)", options: ["A. Separation of duties", "B. Job rotation", "C. Management review", "D. Least privilege"] },
            { id: 44, text: "Jack's organization is a multinational nonprofit that has small offices in many developing countries throughout the world. They need to implement an access control system that allows flexibility and that can work despite poor Internet connectivity at their locations. What is the best type of access control design for Jack's organization?", options: ["A. Centralized access control", "B. Mandatory access control", "C. Decentralized access control", "D. Rule-based access control"] },
            { id: 45, text: "What U.S. government classification label is applied to information that, if disclosed, could cause serious damage to national security and also requires that the damage that would be caused is able to be described or identified by the classification authority?", options: ["A. Classified", "B. Secret", "C. Confidential", "D. Top Secret"] },
            { id: 46, text: "When the certificate authority (CA) created Renee's digital certificate, what key was contained within the body of the certificate? (Scenario: asymmetric crypto)", options: ["A. Renee's public key", "B. Renee's private key", "C. CA's public key", "D. CA's private key"] },
            { id: 47, text: "When the certificate authority (CA) created Renee's digital certificate, what key did it use to digitally sign the completed certificate?", options: ["A. Renee's public key", "B. Renee's private key", "C. CA's public key", "D. CA's private key"] },
            { id: 48, text: "When Mike receives Renee's digital certificate, what key does he use to verify the authenticity of the certificate?", options: ["A. Renee's public key", "B. Renee's private key", "C. CA's public key", "D. CA's private key"] },
            { id: 49, text: "Mike would like to send Renee a private message using the information gained during this exchange. What key should he use to encrypt the message?", options: ["A. Renee's public key", "B. Renee's private key", "C. CA's public key", "D. CA's private key"] },
            { id: 50, text: "Which one of the following tools may be used to directly violate the confidentiality of communications on an unencrypted VoIP network?", options: ["A. Nmap", "B. Nessus", "C. Wireshark", "D. Nikto"] },
            { id: 51, text: "Which of the following is not true about the ISC2 Code of Ethics?", options: ["A. Adherence to the code is a condition of certification.", "B. Failure to comply with the code may result in revocation of certification.", "C. The code applies to all members of the information security profession.", "D. Members who observe a breach of the code are required to report the possible violation."] },
            { id: 52, text: "Which one of the following cryptographic algorithms supports the goal of nonrepudiation?", options: ["A. Blowfish", "B. DES", "C. AES", "D. RSA"] },
            { id: 53, text: "Microsoft's STRIDE threat assessment framework uses six categories for threats: Spoofing, Tampering, Repudiation, Information Disclosure, Denial of Service, and Elevation of Privilege. If a penetration tester is able to modify audit logs, what STRIDE categories best describe this issue?", options: ["A. Tampering and information disclosure", "B. Elevation of privilege and tampering", "C. Repudiation and denial of service", "D. Repudiation and tampering"] },
            { id: 54, text: "Carmen is reviewing her organization's web architecture and realizes that the web server is often under heavy load from users in different regions of the world. This load comes at unpredictable times. She would like to find a solution that minimizes the burden on her organization's servers and places content geographically closer to the user to decrease load time. What would be the best solution to Carmen's requirements?", options: ["A. Load balancer", "B. Content delivery network", "C. TLS acceleration", "D. Web application firewall"] },
            { id: 55, text: "Brian recently joined an organization that runs the majority of its services on a virtualization platform located in its own data center but also leverages an IaaS provider for hosting its web services and an SaaS email system. What term best describes the type of cloud environment this organization uses?", options: ["A. Public cloud", "B. Dedicated cloud", "C. Private cloud", "D. Hybrid cloud"] },
            { id: 56, text: "The government agency that Ben works at installed a new access control system. The system uses information such as Ben's identity, department, normal working hours, job category, and location to make authorization decisions. What type of access control system did Ben's employer adopt?", options: ["A. Role-based access control", "B. Attribute-based access control", "C. Administrative access control", "D. System discretionary access control"] },
            { id: 57, text: "Ben is building his organization's security awareness and training program and would like to include interactive activities that better engage users. What techniques would best help him meet this goal? (Select all that apply.)", options: ["A. Policy reviews", "B. Gamification", "C. Classroom training", "D. Phishing simulations"] },
            { id: 58, text: "Andrew believes that a digital certificate belonging to his organization was compromised and would like to add it to a certificate revocation list (CRL). Who must add the certificate to the CRL?", options: ["A. Andrew", "B. The root authority for the top-level domain", "C. The CA that issued the certificate", "D. The revocation authority for the top-level domain"] },
            { id: 59, text: "Amanda is considering the implementation of a database recovery mechanism recommended by a consultant. In the recommended approach, an automated process will move records of transactions from the primary site to a backup site on an hourly basis. What type of database recovery technique is the consultant describing?", options: ["A. Electronic vaulting", "B. Transaction logging", "C. Remote mirroring", "D. Remote journaling"] },
            { id: 60, text: "Ron is working to classify information used by his organization and would like to include all information that might trigger a U.S. state data breach notification law in his classification scheme. Which of the following categories of information should he include, assuming that they are connected to a specific individual? (Select all that apply.)", options: ["A. Bank account number and PIN", "B. Driver's license number", "C. Marital status", "D. Social Security number"] },
            { id: 61, text: "Which one of the following investigation types has the loosest standards for the collection and preservation of information?", options: ["A. Civil investigation", "B. Operational investigation", "C. Criminal investigation", "D. Regulatory investigation"] },
            { id: 62, text: "Sue was required to sign an NDA when she took a job at her new company. Why did the company require her to sign it?", options: ["A. To protect the confidentiality of their data", "B. To ensure that Sue did not delete their data", "C. To prevent Sue from directly competing with them in the future", "D. To require Sue to ensure the availability for their data as part of her job"] },
            { id: 63, text: "Susan is concerned about the FAR associated with her biometric technology. What is the best method to deal with the FAR?", options: ["A. Adjust the CER.", "B. Change the sensitivity of the system to lower the FRR.", "C. Add a second factor.", "D. Replace the biometric system."] },
            { id: 64, text: "Which data role in an organization is most likely to perform backups of critical systems to ensure that their availability is preserved?", options: ["A. Business owners", "B. Data users", "C. Data owners", "D. Data custodians"] },
            { id: 65, text: "Ron is the CISO of a U.S. company that is entering into a business partnership with a European firm. The European firm will be sending his company customer records to run through Ron's firm's proprietary credit scoring algorithm. Under GDPR, what role will Ron's company have relative to the customer data?", options: ["A. Data controller", "B. Data owner", "C. Data subject", "D. Data processor"] },
            { id: 66, text: "Tonya recently introduced a new security control in her organization for emergency access to system administrator privileges. Under this procedure, two qualified administrators must agree to retrieve emergency credentials. What term best describes this process?", options: ["A. Separation of duties", "B. Least privilege", "C. Two-person control", "D. Multifactor authentication"] },
            { id: 67, text: "Attackers who compromise websites often acquire databases of hashed passwords. What technique can best protect these passwords against automated password cracking attacks that use precomputed values?", options: ["A. Using the MD5 hashing algorithm", "B. Using the SHA-1 hashing algorithm", "C. Salting", "D. Double-hashing"] },
            { id: 68, text: "Jim starts a new job as a system engineer, and he is reviewing a team document entitled “Forensic Response Guidelines.” Which one of the following statements is not true?", options: ["A. Jim must comply with the information in this document.", "B. The document contains information about forensic examinations.", "C. Jim should read the document thoroughly.", "D. The document is likely based on industry best practices."] },
            { id: 69, text: "Evan is reviewing his access control system to ensure that no user is able to read information that is above their security clearance level. What security model is he enforcing?", options: ["A. Bell–LaPadula", "B. Star security property", "C. Discretionary security property", "D. Biba"] },
            { id: 70, text: "Ben needs to verify that the most recent patch for his organization's critical application did not introduce issues elsewhere. What type of testing does Ben need to conduct to ensure this?", options: ["A. Unit testing", "B. White box", "C. Regression testing", "D. Black box"] },
            { id: 71, text: "Tamara recently decided to purchase cyber-liability insurance to cover her company's costs in the event of a data breach. What risk management strategy is she pursuing?", options: ["A. Risk acceptance", "B. Risk mitigation", "C. Risk transference", "D. Risk avoidance"] },
            { id: 72, text: "Which of the following is not one of the four canons of the ISC2 Code of Ethics?", options: ["A. Avoid conflicts of interest that may jeopardize impartiality.", "B. Protect society, the common good, necessary public trust and confidence, and the infrastructure.", "C. Act honorably, honestly, justly, responsibly, and legally.", "D. Provide diligent and competent service to principals."] },
            { id: 73, text: "Jim wants to allow a partner organization's Active Directory forest (B) to access his domain forest's (A)'s resources but doesn't want to allow users in his domain to access B's resources. He also does not want the trust to flow upward through the domain tree as it is formed. What should he do?", options: ["A. Set up a two-way transitive trust.", "B. Set up a one-way transitive trust.", "C. Set up a one-way nontransitive trust.", "D. Set up a two-way nontransitive trust."] },
            { id: 74, text: "Susan's team is performing code analysis by manually reviewing the code for flaws. What type of analysis are they performing?", options: ["A. Gray box", "B. Static", "C. Dynamic", "D. Fuzzing"] },
            { id: 75, text: "Kevin's organization recently suffered a ransomware attack, and he is considering paying the ransom. Which of the following statements are true about paying the ransom? (Select all that apply.)", options: ["A. There is no guarantee that he will receive the decryption key.", "B. The attackers have encrypted his data but do not have access to the data itself.", "C. Restoring from backup will not recover information.", "D. Paying ransoms may be illegal."] },
            { id: 76, text: "What feature of a Trusted Platform Module (TPM) creates a hash summary of the system configuration to verify that changes have not been made?", options: ["A. Remote attestation", "B. Binding", "C. Sealing", "D. RNG"] },
            { id: 77, text: "Gary is concerned that the environmental controls in his organization's data center may not be effectively controlling humidity. Which of the following circumstances may result from humidity issues? (Select all that apply.)", options: ["A. Static electricity damaging equipment", "B. Fires in power supplies", "C. Corrosion of equipment", "D. Physical access control failures"] },
            { id: 78, text: "Evan recently built an alternate processing facility that includes all of the hardware and data necessary to restore operations in a matter of minutes or seconds. What type of facility has he built?", options: ["A. Hot site", "B. Warm site", "C. Cold site", "D. Mobile site"] },
            { id: 79, text: "Hadley is reviewing network traffic logs and is searching for syslog activity on his network. When he creates a filter to look for this traffic, which UDP port should he include?", options: ["A. 443", "B. 514", "C. 515", "D. 445"] },
            { id: 80, text: "Fred finds a packet that his protocol analyzer shows with both PSH and URG set. What type of packet is he looking at, and what do the flags mean?", options: ["A. A UDP packet; PSH and URG are used to indicate that the data should be sent at high speed", "B. A TCP packet; PSH and URG are used to clear the buffer and indicate that the data is urgent", "C. A TCP packet; PSH and URG are used to preset the header and indicate that the speed of the network is unregulated", "D. A UDP packet; PSH and URG are used to indicate that the UDP buffer should be cleared and that the data is urgent"] },
            { id: 81, text: "What code review process is shown here? (Image: Fagan inspection diagram)", options: ["A. Static inspection", "B. Fagan inspection", "C. Dynamic inspection", "D. Interface testing"] },
            { id: 82, text: "During a log review, Karen discovers that the system she needs to gather logs from has the log setting shown here. What problem is Karen likely to encounter? (Image: log properties with max log size 20480 KB, overwrite events as needed)", options: ["A. Too much log data will be stored on the system.", "B. The system is automatically purging archived logs.", "C. The logs will not contain the information needed.", "D. The logs will contain only the most recent 20 MB of log data."] },
            { id: 83, text: "While investigating a widespread distributed denial-of-service attack, Matt types in the IP address of one of the attacking systems into his browser and sees the following page. What type of devices is the botnet likely composed of? (Image: IoT camera)", options: ["A. SCADA", "B. Cloud infrastructure", "C. Web servers", "D. IoT"] },
            { id: 84, text: "What stage of the incident response process is Alejandro currently conducting? (Scenario: IDS alert, initial triage)", options: ["A. Detection", "B. Response", "C. Recovery", "D. Mitigation"] },
            { id: 85, text: "If Alejandro's initial investigation determines that a security incident is likely taking place, what should be his next step?", options: ["A. Investigate the root cause.", "B. File a written report.", "C. Activate the incident response team.", "D. Attempt to restore the system to normal operations."] },
            { id: 86, text: "As the incident response progresses, during which stage should the team conduct a root-cause analysis?", options: ["A. Response", "B. Reporting", "C. Remediation", "D. Lessons learned"] },
            { id: 87, text: "Barry recently received a message from Melody that Melody encrypted using symmetric cryptography. What key should Barry use to decrypt the message?", options: ["A. Barry's public key", "B. Barry's private key", "C. Melody's public key", "D. Shared secret key"] },
            { id: 88, text: "After you do automated functional testing with 100% coverage of an application, what type of error is most likely to remain?", options: ["A. Business logic errors", "B. Input validation errors", "C. Runtime errors", "D. Error handling errors"] },
            { id: 89, text: "During what phase of the incident response process would security professionals analyze the process itself to determine whether any improvements are warranted?", options: ["A. Lessons learned", "B. Remediation", "C. Recovery", "D. Reporting"] },
            { id: 90, text: "What U.S. law prevents the removal of protection mechanisms placed on a copyrighted work by the copyright holder?", options: ["A. HIPAA", "B. DMCA", "C. GLBA", "D. ECPA"] },
            { id: 91, text: "Linda is selecting a disaster recovery facility for her organization, and she wants to retain independence from other organizations as much as possible. She would like to choose a facility that balances cost and recovery time, allowing activation in about one week after a disaster is declared. What type of facility should she choose?", options: ["A. Cold site", "B. Warm site", "C. Mutual assistance agreement", "D. Hot site"] },
            { id: 92, text: "Helen's organization handles large quantities of highly sensitive information. To help address this risk, she purchased a cyber-liability insurance policy. What type of risk response action is Helen taking?", options: ["A. Transfer", "B. Avoid", "C. Mitigate", "D. Accept"] },
            { id: 93, text: "What type of penetration testing provides detail on the scope of a penetration test—including items like what systems would be targeted—but does not provide full visibility into the configuration or other details of the systems or networks the penetration tester must test?", options: ["A. Crystal box", "B. White box", "C. Black box", "D. Gray box"] },
            { id: 94, text: "Joanna would like to implement multifactor authentication for access to a restricted work area in her building. Which pairing of controls would best meet her requirement?", options: ["A. ID card and PIN", "B. Password and retinal scan", "C. ID card and access token", "D. Retinal scan and fingerprint scan"] },
            { id: 95, text: "What network topology is used by modern-day Ethernet networks?", options: ["A. Star", "B. Mesh", "C. Ring", "D. Bus"] },
            { id: 96, text: "Reed would like to add capabilities to his network that allow him to hide the identities of his users from remote web servers. Which one of the following tools would best meet his needs?", options: ["A. Proxy server", "B. Content filter", "C. Malware filter", "D. Caching server"] },
            { id: 97, text: "Evelyn is preparing a training program that will provide cybersecurity advice to users who often travel internationally. Which of the following topics requires special training to ensure that users do not run afoul of U.S. export control laws?", options: ["A. Encryption software", "B. Content filtering", "C. Firewall rules", "D. Phishing simulations"] },
            { id: 98, text: "Skip needs to transfer files from his PC to a remote server. What protocol should he use instead of FTP?", options: ["A. SCP", "B. SSH", "C. HTTP", "D. Telnet"] },
            { id: 99, text: "Ben's New York–based commercial web service collects personal information from California residents. What does the California Online Privacy Protection Act require Ben to do to be compliant?", options: ["A. Ben must encrypt all personal data he receives.", "B. Ben must comply with the EU GDPR.", "C. Ben must have a conspicuously posted privacy policy on his site.", "D. Ben must provide notice and choice for users of his website."] },
            { id: 100, text: "Grayson is reviewing his organization's password policies and would like to follow modern best practices. What is the recommended expiration period for passwords?", options: ["A. 30 days", "B. 90 days", "C. 180 days", "D. None"] },
            { id: 101, text: "A consortium of colleges and universities recently worked to integrate their authentication systems so that students registered at one institution may use their credentials to access services at other institutions. What term best describes this arrangement?", options: ["A. Federation", "B. Identity proofing", "C. Enrollment", "D. Provisioning"] },
            { id: 102, text: "Olivia is selecting a new biometric authentication technology and is considering purchasing iris scanners. What advantage do iris scans have over most other types of biometric factors?", options: ["A. Iris scanners are harder to deceive.", "B. Irises don't change as much as other factors.", "C. Iris scanners are cheaper than other factors.", "D. Iris scans cannot be easily replicated."] },
            { id: 103, text: "Jen's firm received a new contract to develop information systems for use by a U.S. federal government agency. She is concerned about identifying any required security controls that must be in place. Which one of the following standards describes controls mandatory for use on U.S. government systems?", options: ["A. PCI DSS", "B. ISO 27001", "C. SABSA", "D. NIST 800-53"] },
            { id: 104, text: "Matthew, Richard, and Christopher would like to exchange messages with each other using symmetric cryptography. They want to ensure that each individual can privately send a message to another individual without the third person being able to read the message. How many keys do they need?", options: ["A. 1", "B. 2", "C. 3", "D. 6"] },
            { id: 105, text: "Colleen is responsible for protecting credit card numbers as part of her organization's efforts to comply with PCI DSS. She would like to select an appropriate control to protect those numbers while in transit over the network. Which of the following controls would best meet this need?", options: ["A. FDE", "B. SSL", "C. TPM", "D. TLS"] },
            { id: 106, text: "Joe is concerned about the confidentiality of email messages as they are transiting the Internet from his organization's servers to their final destination. What is the best way that Joe can ensure email confidentiality in transit?", options: ["A. Use TLS between the client and server.", "B. Use SSL between the client and server.", "C. Encrypt the email content.", "D. Use a digital signature."] },
            { id: 107, text: "Brenda is analyzing the web server logs after a successful compromise of her organization's web-based order processing application. She finds an entry in the log file showing that a user entered the following information as his last name when placing an order: Smith'; DROP TABLE orders;--. What type of attack was attempted?", options: ["A. Buffer overflow", "B. Cross-site scripting", "C. Cross-site request forgery", "D. SQL injection"] },
            { id: 108, text: "Hannah's organization is implementing a new approach to user authentication that relies upon SAML. She would like to protect against eavesdropping on this traffic and also ensure that SAML traffic is not forged by an attacker. What should she do to protect against both types of attack?", options: ["A. Use SAML's secure mode to provide secure authentication.", "B. Implement TLS using a strong cipher suite, which will protect against both types of attacks.", "C. Implement TLS using a strong cipher suite and use digital signatures.", "D. Implement TLS using a strong cipher suite and message hashing."] },
            { id: 109, text: "What is the goal of the BCP process?", options: ["A. RTO < MTD", "B. MTD < RTO", "C. RPO < MTD", "D. MTD < RPO"] },
            { id: 110, text: "During which phase of the incident response process would administrators design new security controls intended to prevent a recurrence of the incident?", options: ["A. Reporting", "B. Recovery", "C. Remediation", "D. Lessons learned"] },
            { id: 111, text: "Bethany received an email from one of her colleagues with an unusual attachment named smime.p7s. She does not recognize the attachment and is unsure what to do. What is the most likely scenario?", options: ["A. This is an encrypted email message.", "B. This is a phishing attack.", "C. This is embedded malware.", "D. This is a spoofing attack."] },
            { id: 112, text: "Kim learned that the military is planning a classified mission that involves some ASI aircraft. She is concerned that employees not cleared for the mission may learn of it by noticing the movement of many aircraft to the region. Individual employees are cleared to know about the movement of an individual aircraft, but they are not cleared to know about the overall mission. What type of attack is Kim concerned about? (Scenario: multilevel security)", options: ["A. Aggregation", "B. SQL injection", "C. Inference", "D. Multilevel security"] },
            { id: 113, text: "What technique can Kim employ to prevent employees not cleared for the mission from learning the true location of the aircraft?", options: ["A. Input validation", "B. Polyinstantiation", "C. Parameterization", "D. Server-side validation"] },
            { id: 114, text: "Kim's database uniquely identifies aircrafts by using their tail number. Which one of the following terms would not necessarily accurately describe the tail number?", options: ["A. Database field", "B. Foreign key", "C. Primary key", "D. Candidate key"] },
            { id: 115, text: "Kim would like to create a key that enforces referential integrity for the database. What type of key does she need to create?", options: ["A. Primary key", "B. Foreign key", "C. Candidate key", "D. Master key"] },
            { id: 116, text: "Doug is choosing a software development life-cycle model for use in a project he is leading to develop a new business application. He has clearly defined requirements and would like to choose an approach that places an early emphasis on developing comprehensive documentation. He does not have a need for the production of rapid prototypes or iterative improvement. Which model is most appropriate for this scenario?", options: ["A. Agile", "B. Waterfall", "C. Spiral", "D. DevOps"] },
            { id: 117, text: "Which individual bears the ultimate responsibility for data protection tasks?", options: ["A. Data owner", "B. Data custodian", "C. User", "D. Auditor"] },
            { id: 118, text: "Carla is conducting a web application security test and would like to automatically generate input that is used to test the application. Which of the following tools would be best suited for this purpose?", options: ["A. Static application testing tool", "B. White-box testing tool", "C. Brute-force testing tool", "D. Fuzz testing tool"] },
            { id: 119, text: "Warren's organization recently completed a massive phishing awareness campaign, and he would like to measure its effectiveness. Which of the following tools would best provide this measurement?", options: ["A. Survey", "B. Simulation", "C. Code review", "D. Third-party assessment"] },
            { id: 120, text: "Which one of the following controls would be most effective in detecting zero-day attack attempts?", options: ["A. Signature-based intrusion detection", "B. Anomaly-based intrusion detection", "C. Strong patch management", "D. Full-disk encryption"] },
            { id: 121, text: "Rob believes that an individual he met on an online forum used unapproved resources to cheat on the CISSP exam. He has evidence to back up his claim. Which one of the following statements is most correct?", options: ["A. Rob may report this situation to ISC2 as a violation of the Code of Ethics.", "B. Rob does not have standing to report this situation to ISC2 unless he is an employer of the individual in question.", "C. Rob does not have standing to report this situation to ISC2 unless he holds a professional license or certification that includes a code of ethics.", "D. Rob does not have standing to report this situation to ISC2 unless he is a member of ISC2 or holds an ISC2 certification."] },
            { id: 122, text: "Which one of the following components should be included in an organization's emergency response guidelines?", options: ["A. Secondary response procedures for incident responders", "B. Long-term business continuity protocols", "C. Activation procedures for the organization's cold sites", "D. Contact information for ordering equipment"] },
            { id: 123, text: "When Jim enters his organization's data center, he has to use a smartcard and code to enter and is allowed through one set of doors. The first set of doors closes, and he must then use his card again to get through a second set, which locks behind him. What type of control is this, and what is it called?", options: ["A. A physical control; a one-way trapdoor", "B. A logical control; a dual-swipe authorization", "C. A directive control; a one-way access corridor", "D. A preventive access control; an access control vestibule"] },
            { id: 124, text: "Bill implemented RAID level 5 on a server that he operates using a total of three disks. How many disks may fail without the loss of data?", options: ["A. 0", "B. 1", "C. 2", "D. 3"] },
            { id: 125, text: "Match the following numbered system and organization controls (SOC) levels to their matching lettered SOC report descriptions: SOC levels: 1. SOC 1, Type 1, 2. SOC 1, Type 2, 3. SOC 2, 4. SOC 3. SOC report descriptions: A. A general use report that reports on controls related to compliance and/or operations, B. A report that provides predefined, standard benchmarks for controls involving confidentiality, availability, integrity, and privacy of a system and the information it contains, generally for restricted use, C. A report that provides an assessment of the risk of material misstatement of financial statement assertions affected by the service organization's processing and that includes a description of the service auditor's tests of the controls and the results of the tests and their effectiveness, D. A report that provides the auditor's opinions of financial statements about controls at the service organization and that includes a report on the opinion on the presentation of the service organization's system as well as suitability of the controls.", options: [] }
        ];

        const explanations = {
            1: "NIST SP 800-18 describes system owner responsibilities that include helping to develop system security plans, maintaining the plan, ensuring training, and identifying, implementing, and assessing security controls. A data owner is more likely to delegate these tasks to the system owner. Custodians may be asked to enforce those controls, whereas a user will be directly affected by them.",
            2: "ESP's Transport mode encrypts IP packet data but leaves the packet header unencrypted. Tunnel mode encrypts the entire packet and adds a new header to support transmission through the tunnel.",
            3: "In level 2, the Repeatable level of the SW-CMM, the organization introduces basic life cycle management processes. Reuse of code in an organized fashion begins, and repeatable results are expected from similar projects. The crucial process areas for this level include Requirements Management, Software Project Planning, Software Project Tracking and Oversight, Software Subcontract Management, Software Quality Assurance, and Software Configuration Management. Software Quality Management is a process that occurs during level 4, the Managed stage of the SW-CMM.",
            4: "Key risk indicators (KRIs) are often used to monitor risk for organizations that establish an ongoing risk management program. Using automated data gathering and tools that allow data to be digested and summarized can provide predictive information about how organizational risks are changing. KPIs are key performance indicators, which are used to assess how an organization is performing. Quantitative risk assessments are good for point-in-time views with detailed valuation and measurement-based risk assessments, whereas a penetration test would provide details of how well an organization's security controls are working.",
            5: "The three-way handshake is SYN, SYN/ACK, ACK. System B should respond with “Synchronize and Acknowledge” to System A after it receives a SYN.",
            6: "Systems that respond to pings will show the time to live for packets that reach them. Since TTL is decremented at each hop, this can help build a rough network topology map. In addition, some firewalls respond differently to pings than a normal system, which means pinging a network can sometimes reveal the presence of firewalls that would otherwise be invisible. Hostnames are revealed by a DNS lookup, and ICMP types allowed through a firewall are not revealed by only performing a ping. ICMP can be used for router advertisements, but pinging won't show them!",
            7: "Authorization defines what a subject can or can't do. Identification occurs when a subject claims an identity, accounting is provided by the logs and audit trail that track what occurs on a system, and authentication occurs when that identity is validated.",
            8: "When a system uses shadowed passwords, the hashed password value is stored in /etc/shadow instead of /etc/passwd. The /etc/passwd file would not contain the password in plaintext or hashed form. Instead, it would contain an x to indicate that the password hash is in the shadow file. The * character is normally used to disable interactive logins to an account.",
            9: "The log entries show the characteristic pattern of a port scan. The attacking system sends connection attempts to the target system against a series of commonly used ports.",
            10: "Testing for desired functionality is use-case testing. Dynamic testing is used to determine how code handles variables that change over time. Misuse testing focuses on how code handles examples of misuse, and fuzzing feeds unexpected data as an input to see how the code responds.",
            11: "Privilege creep is a common problem when employees change roles over time and their privileges and permissions are not properly modified to reflect their new roles. Least privilege issues are a design or implementation problem, and switching roles isn't typically what causes them to occur. Account creep is not a common industry term, and account termination would imply that someone has removed her account instead of switching her to new groups or new roles.",
            12: "These are examples of private IP addresses. RFC 1918 defines a set of private IP addresses for use in internal networks. These private addresses including 10.0.0.0 to 10.255.255.255, 172.16.0.0 to 172.31.255.255, and 192.168.0.0 to 192.168.255.255 should never be routable on the public Internet.",
            13: "A cognitive password authenticates users based on a series of facts or answers to questions that they know. Preset questions for cognitive passwords typically rely on common information about a user like their mother's maiden name or the name of their pet, and that information can frequently be found on the Internet. The best cognitive password systems let users make up their own questions.",
            14: "The Linux tool dd creates a bit-by-bit copy of the target drive that is well suited to forensic use, and special forensic versions of dd exist that can provide even more forensic features. Simply copying files using a tool like xcopy does not create a forensically sound copy. DBAN is a drive wiping tool and would cause Megan to lose the data she is seeking to copy. ImageMagick is a graphics manipulation and editing program.",
            15: "The blacklist approach to application control blocks certain prohibited packages but allows the installation of other software on systems. The whitelist approach uses the reverse philosophy and allows only approved software. Antivirus software would detect the installation of malicious software only after the fact. Heuristic detection is a variant of antivirus software.",
            16: "Protected health information (PHI) is specifically defined by HIPAA to include information about an individual's medical bills. PCI could refer to the payment card industry's security standard but would apply only in relation to payment cards. PII is a broadly defined term for personally identifiable information, and personal billing data isn't a broadly used industry term.",
            17: "A social engineering attack may trick a user into revealing their password to the attacker. Other attacks that depend on guessing passwords, such as brute-force attacks, rainbow table attacks, and dictionary attacks, are unlikely to be successful in light of the organization's strong password policy.",
            18: "When someone is forced to perform an action under threat, it is known as duress.",
            19: "The term that best describes the type of cloud environment used by Kayla's company, which leverages a major IaaS provider for hosting its web services and a SaaS email system operating in multitenant environments, is a public cloud. A public cloud is where the services are delivered over the public Internet and shared across different organizations. A dedicated cloud, also known as a private cloud, is operated solely for one organization, and this is not the case for Kayla's company. A private cloud is infrastructure operated solely for a single organization, whether managed internally or by a third-party, and hosted either internally or externally, which also does not apply here. A hybrid cloud is a composition of two or more cloud delivery models (private, community, or public) that remain distinct entities but are bound together, offering the benefits of multiple deployment models, which again does not match the company's use of exclusively public cloud services.",
            20: "In this scenario, all of the files on the server will be backed up on Monday evening during the full backup. Tuesday's incremental backup will include all files changed since Monday's full backup: files 1, 2, and 5. Wednesday's incremental backup will then include all files modified since Tuesday's incremental backup: files 3 and 6. Therefore, only two files are included in Wednesday's incremental backup.",
            21: "Susan is performing passive monitoring, which uses a network tap or SPAN port to capture traffic to analyze it without impacting the network or devices that it is used to monitor. Synthetic, or active, monitoring uses recorded or generated traffic to test for performance and other issues. Signature-based technologies include IDS, IPS, and antimalware systems.",
            22: "In a man-in-the-middle attack, attackers manage to insert themselves into a connection between a user and a legitimate website, relaying traffic between the two parties while eavesdropping on the connection. Although similarly named, the meet-in-the-middle attack is a cryptographic attack that does not necessarily involve connection tampering. Fraggle is a network-based denial-of-service attack using UDP packets. Wardriving is a reconnaissance technique for discovering open or weakly secured wireless networks.",
            23: "One of the core capabilities of infrastructure as a service is providing servers on a vendor-managed virtualization platform. Web-based payroll and email systems are examples of software as a service. An application platform managed by a vendor that runs customer code is an example of platform as a service.",
            24: "The exposure factor is the percentage of the facility that risk managers expect will be damaged if a risk materializes. It is calculated by dividing the amount of damage by the asset value. In this case, that is $750,000 in damage divided by the $2 million facility value, or 37.5%.",
            25: "The annualized rate of occurrence is the number of times each year that risk analysts expect a risk to happen. In this case, the analysts expect fires will occur once every 50 years, or 0.02 times per year.",
            26: "The annualized loss expectancy is calculated by multiplying the single loss expectancy (SLE) by the annualized rate of occurrence (ARO). In this case, the SLE is $750,000, and the ARO is 0.02. Multiplying these numbers together gives you the ALE of $15,000.",
            27: "The two main methods of choosing records from a large pool for further analysis are sampling and clipping. Sampling uses statistical techniques to choose a sample that is representative of the entire pool, while clipping uses threshold values to select those records that exceed a predefined threshold because they may be of most interest to analysts.",
            28: "API keys, or application programming interface keys, are passed to services and identify the program, developer, or user. With this information, Mike can programmatically control API usage per user. Of course, if the keys are inadvertently exposed, the API keys themselves could be abused. Session IDs are typically used to identify users of an application, not an API. API firewalls and API buffers were made up for this question.",

            30: "A fault is a momentary loss of power. Blackouts are sustained complete losses of power. Sags and brownouts are not complete power disruptions but rather periods of low-voltage conditions.",

            34: "Criminal forensic investigations typically have the highest standards for evidence, as they must be able to help prove the case beyond a reasonable doubt. Administrative investigations merely need to meet the standards of the organization and to be able to be defended in court, while civil investigations operate on a preponderance of evidence. There is not a category of forensic investigation referred to as “industry” in the CISSP exam's breakdown of forensic types.",
            35: "The Fourth Amendment states, in part, that “the right of the people to be secure in their persons, houses, papers and effects, against unreasonable searches and seizures, shall not be violated, and no Warrants shall issue, but upon probable cause, supported by Oath or affirmation, and particularly describing the place to be searched, and the persons or things to be seized.” The First Amendment contains protections related to freedom of speech. The Fifth Amendment ensures that no person will be required to serve as a witness against themselves. The Fifteenth Amendment protects the voting rights of citizens.",
            36: "The Electronic Communications Privacy Act (ECPA) makes it a crime to invade the electronic privacy of an individual. It prohibits the unauthorized monitoring of email and voicemail communications.",

            40: "During a tabletop exercise, team members come together and walk through a scenario without making any changes to information systems. The read-through is the least disruptive type of disaster recovery test. During a read-through, team members each review the contents of their disaster recovery checklists on their own and suggest any necessary changes. During a parallel test, the team actually activates the disaster recovery site for testing, but the primary site remains operational. During a full interruption test, the team takes down the primary site and confirms that the disaster recovery site is capable of handling regular operations. The full interruption test is the most thorough test but also the most disruptive.",

            44: "Decentralized access control makes sense because it allows local control over access. When network connectivity to a central control point is a problem or if rules and regulations may vary significantly from location to location, centralized control can be less desirable than decentralized control despite its challenges with consistency. Since the problem does not describe specific control needs, mandatory access control and rule-based access controls could fit the need but aren't the best answer.",
            45: "The U.S. government classifies data that could reasonably be expected to cause damage to national security if disclosed, and for which the damage can be identified or described, as Secret. The U.S. government does not use Classified in its formal four levels of classification. Top Secret data could cause exceptionally grave damage, whereas Confidential data could be expected to cause damage.",

            51: "The ISC2 Code of Ethics applies only to information security professionals who are members of ISC2. Adherence to the code is a condition of certification, and individuals found in violation of the code may have their certifications revoked. ISC2 members who observe a breach of the code are required to report the possible violation by following the ethics complaint procedures.",
            52: "Nonrepudiation is possible only with an asymmetric encryption algorithm. RSA is an asymmetric algorithm. AES, DES, and Blowfish are all symmetric encryption algorithms that do not provide nonrepudiation.",

            54: "Content delivery networks (CDNs) place endpoints at geographic locations around the world and then cache customer content at those endpoints. The CDN servers then handle user requests for data, greatly reducing the burden on the organization's own servers and improving load time. Load balancers would distribute the load among Carmen's own servers and would, therefore, not meet her requirements. TLS acceleration may improve load time by reducing the burden of encryption on servers, but they would not place content closer to end users. Web application firewalls would be used to protect the servers against attack, but this does not match Carmen's requirements.",

            59: "Remote journaling transfers transaction logs to a remote site on a more frequent basis than electronic vaulting, typically hourly. Transaction logging is not a recovery technique alone; it is a process for generating the logs used in remote journaling. In an electronic vaulting approach, automated technology moves database backups from the primary database server to a remote site on a scheduled basis, typically daily. Remote mirroring maintains a live database server at the backup site and mirrors all transactions at the primary site on the server at the backup site.",

            63: "Adding a second factor can ensure that users who might be incorrectly accepted are not given access due to a higher than desired false acceptance rate (FAR) from accessing a system. The CER is the crossover between the false acceptance and false rejection rate (FRR) and is used as a way to measure the accuracy of biometric systems. Changing the sensitivity to lower the FRR may actually increase the FAR, and replacing a biometric system can be expensive in terms of time and cost.",
            64: "Data custodians are typically responsible for the technical environment and procedures related to data management, which include the backup and recovery of systems to ensure data availability. While data owners are accountable for the data and may decide what needs to be backed up, they do not perform the actual backups. Business owners and data users are more focused on the operational and decision-making aspects of the data's business use and are generally not involved in the technical aspects of data maintenance such as system backups.",
            65: "Ron's company is a data processor in this instance, as it is receiving records from the European firm. The European firm is the data controller in this case, as they bear responsibility for the data. The individuals described in the records are the data subjects. Data owners are tasked with making decisions about data such as who receives access to it and how it is used.",
            66: "This is an example of two-person control, where two people must concur to perform a sensitive action. Separation of duties is a slightly different principle, where one individual is prevented from holding the privileges to perform two separate actions that, when combined, would result in excessive permissions. Least privilege says that an individual should have the minimum necessary set of permissions to carry out their job functions. There is no indication that least privilege is violated in this scenario. Multifactor authentication is an important security control, but the scenario does not mention whether the administrators use multifactor authentication to perform these activities.",
            67: "Salting adds random text to the password before hashing in an attempt to defeat automated password cracking attacks that use precomputed values. MD5 and SHA-1 are both common hashing algorithms, so using them does not add any security. Double-hashing would only be a minor inconvenience for an attacker and would not be as effective as the use of salting.",
            68: "Guidelines provide advice based on best practices developed throughout industry and organizations, but they are not compulsory. Compliance with guidelines is optional.",
            69: "The Bell–LaPadula model includes the simple security property, which says that no user should be able to read information above their security clearance level. It also includes the star property, which says that a subject should not be able to write data to an object below their security clearance level, and the discretionary security property, which uses access matrices to control access. The Biba integrity model says that users should not be able to read data below their security clearance level.",
            70: "Regression testing ensures proper functionality of an application or system after it has been changed. Unit testing focuses on testing each module of a program instead of against its previous functional state. White- and black-box testing both describe the amount of knowledge about a system or application, rather than a specific type or intent for testing.",
            71: "Risk transference involves shifting the impact of a potential risk from the organization incurring the risk to another organization. Insurance is a common example of risk transference.",

            100: "Modern recommendations from the National Institute of Standards and Technology (NIST) are that users should not be forced to change their passwords through the use of password expiration policies. More information on these recommendations can be found in NIST Special Publication (SP) 800-63B, “Digital Identity Guidelines.”",

            103: "NIST 800-53 is the standard that describes the security controls mandatory for use on U.S. federal government systems. It provides a catalog of security and privacy controls for all U.S. federal information systems except those related to national security. PCI DSS is a proprietary information security standard for organizations that handle payment cards and is not specific to government systems. ISO 27001 is an international standard on how to manage information security and is not specific to U.S. federal systems. SABSA is a framework and methodology for enterprise security architecture and service management, again not specific to the mandatory controls required by U.S. government systems.",
            104: "They need a key for every possible pair of users in the cryptosystem. The first key would allow communication between Matthew and Richard. The second key would allow communication between Richard and Christopher. The third key would allow communication between Christopher and Matthew.",
            105: "All of these controls involve the use of encryption, but only Transport Layer Security (TLS) provides a strong, effective means for protecting data in transit. Secure Sockets Layer (SSL) is an outdated method for protecting data in transit that should no longer be used. Full disk encryption (FDE) provides encryption for data at rest. The Trusted Platform Module (TPM) manages encryption keys for use in FDE.",

            109: "The goal of the business continuity planning process is to ensure that your recovery time objectives are all less than your maximum tolerable downtimes.",

            112: "Aggregation is a security issue that arises when a collection of facts has a higher classification than the classification of any of those facts standing alone. An inference problem occurs when an attacker can deduce information of greater sensitivity from a lower security level fact. SQL injection is a web application exploit. Multilevel security is a system control that allows the simultaneous processing of information at different classification levels.",
            113: "Polyinstantiation allows the storage of multiple different pieces of information in a database at different classification levels to prevent attackers from conducting aggregation or inference attacks. Kim could store incorrect location information in the database at lower classification levels to prevent the aggregation attack in this scenario. Input validation, server-side validation, and parameterization are all techniques used to prevent web application attacks and are not effective against inference attacks.",
            114: "The tail number is a database field because it is stored in the database. It is also a primary key because the question states that the database uniquely identifies aircraft using this field. Any primary key is, by definition, also a candidate key. There is no information provided that the tail number is a foreign key used to reference a different database table.",

            117: "The data owner is a senior manager who bears ultimate responsibility for data protection tasks. The data owner typically delegates this responsibility to one or more data custodians.",

            120: "Anomaly-based intrusion detection systems may identify a zero-day vulnerability because it deviates from normal patterns of activity. Signature-based detection methods would not be effective because there are no signatures for zero-day vulnerabilities. Strong patch management would not be helpful because, by definition, zero-day vulnerabilities do not have patches available. Full-disk encryption would not detect an attack because it is not a detective control.",
            121: "Whether Rob has standing to report this situation to ISC2 depends upon the canon(s) violated by the activity. This behavior violates canon II, “Act honorably, honestly, justly, responsibly, and legally.” Any member of the public may file a claim under canons I or II. Only an employer or someone with a contracting relationship with the individual may file a complaint under canon III. Anyone who is certified or licensed as a professional and subscribes to a code of ethics as part of that licensure or certification is eligible to file a canon IV complaint.",
            122: "The emergency response guidelines should include the immediate steps an organization should follow in response to an emergency situation. These include immediate response procedures, a list of individuals who should be notified of the emergency, and secondary response procedures for incident responders. They do not include long-term actions such as activating business continuity protocols, ordering equipment, or activating disaster recovery sites.",
